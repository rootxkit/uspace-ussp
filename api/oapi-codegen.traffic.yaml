# oapi-codegen configuration for internal/traffic/gen: the net/http
# server interface (Go 1.22 routing) of the operations traffic-ws serves
# from api/openapi.yaml, the traffic and health tags. Models only for
# the query parameters and the shared responses: the frames are the
# shapes of schemas/traffic/product/v1, alert/v1 and the console
# frames, written by internal/traffic and internal/app/trafficws.
# Run through `make generate`; never edit the generated file.
package: gen
generate:
  std-http-server: true
  strict-server: false
  models: true
  embedded-spec: false
output-options:
  include-tags: [health, traffic]
