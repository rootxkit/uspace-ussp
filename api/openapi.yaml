openapi: 3.1.0
info:
  title: uspace-ussp national USSP API
  version: 0.1.0
  description: |
    The national API of a U-space Service Provider of the Georgian
    U-space system-of-systems (Reg. (EU) 2021/664 Art. 7-13, 15). This
    file is the published contract: an endpoint that is not in it does
    not exist. The standard interfaces (ASTM F3411-22a, ASTM F3548-21)
    are served from the pinned standard files, not from this one.

    Every error is application/problem+json in the shape of the Problem
    schema (reconciliation M28).

    Skeleton (WP-0): health and readiness, the security schemes and the
    tags. Every later work package adds its paths under its tag. WP-4:
    the CIS change-notification receiver. WP-5: the cached registry
    validity lookup. WP-7: operational intents and flight authorisation.
    WP-8: operator telemetry (served by telemetry-ingest). WP-9: the
    optional authority flight push (served by rid-sp).
  license:
    name: Apache-2.0
servers:
  - url: "https://{host}"
    description: A USSP deployment; the host is configuration, never code.
    variables:
      host:
        default: localhost
        description: The public host of the deployment.
tags:
  - name: health
    description: Liveness and readiness of one process instance.
  - name: intents
    description: Flight authorisation and operational intents (Art. 10).
  - name: geo
    description: Geo-awareness from the CIS (Art. 9).
  - name: telemetry
    description: Operator telemetry in (Art. 8(2)).
  - name: traffic
    description: Traffic information and its stream (Art. 11).
  - name: alerts
    description: Conformance and proximity alerts and their acknowledgement (Art. 13).
  - name: registry
    description: Registry validation through the authority (F8).
  - name: weather
    description: Weather information (Art. 12, optional).
  - name: records
    description: Flight records and daily bundles for the authority (Art. 15(1)(g)).
  - name: authority
    description: The optional national push of network identification to the authority.
  - name: cis
    description: CIS change notifications from the CISP or the ANSP.
  - name: oauth
    description: This USSP's token issuer for operator machine clients.
  - name: accounts
    description: Operator and staff accounts, clients and sessions.
  - name: admin
    description: The USSP console (staff).

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      description: 200 while the process runs. Says nothing about dependencies.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      description: |
        Runs every dependency check of the process and reports each with
        its state, since when, how long ago it was last seen up, and why
        it is not up. 503 while a required dependency is down or has not
        been checked; 200 otherwise, with every dependency that is not up
        listed in degraded. A check that did not run is "unknown", never
        "up".
      security: []
      responses:
        "200":
          description: Ready; degraded lists what is not up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; a required dependency is down or unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"

  /v1/cis/notifications:
    post:
      operationId: receiveCISNotification
      tags: [cis]
      summary: Receive a CIS change notification (F3 push)
      description: |
        The receiver of every subscriber in the ecosystem (M1): the CISP
        POSTs here the callback it registered, and the ANSP posts here
        on its degraded direct path while the CISP is down (M5). The body
        is a compact JWS (application/jose) whose payload is {iss, aud,
        sub, iat, jti, body}: iss one of USSP_CIS_NOTIFY_ISSUERS (each
        verified against its JWKS), aud this host (M19), sub the
        subscription (the restriction id from the ANSP), jti the
        delivery id, iat at most 5 minutes old, and body the
        cis/change/v1 record of the CISP's pinned schema. There is no
        bearer: the signature authenticates the sender.

        A delivery id seen before is acknowledged 204 and not acted on
        (it is remembered in the database on every replica). The
        reasons subscription_test and republished, and any reason this
        USSP does not know, are acknowledged 204 without a pull (M16).
        Every other reason is logged and triggers a pull of the dataset:
        from pull_url when its host is the issuer's configured base host
        (and the issuer is the CISP), otherwise from the configured CISP
        base URL, the mismatch counted (the SSRF guard). The answer does
        not wait for the pull.
      security: []
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              type: string
              description: A compact JWS (three base64url parts separated by dots).
              maxLength: 262144
      responses:
        "204":
          description: Accepted, acknowledged or a replay; nothing to return.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/registry/validate:
    get:
      operationId: validateRegistry
      tags: [registry]
      summary: Validity of an operator, a UAS and a remote pilot (F8, cached)
      description: |
        The authority's F8 answer through this USSP's cache, status only:
        `valid`, `suspended`, `revoked` or `unknown` per key asked, with
        the end of validity, the class label and MTOM band of a UAS and
        the competency set of a pilot, never a name, address, phone or
        e-mail (spec 02 F8, 06 §5). An answer cached within the policy's
        TTL (`registry_positive_ttl_s`, `registry_negative_ttl_s`) carries
        its `cache_age_s`; otherwise the authority is asked and the answer
        cached. When the authority cannot answer, a key without a cached
        answer is `unknown` with `reason: registry_unavailable` (or
        `registry_answer_refused` when its answer was refused), never an
        error and never `valid`. `operator` is compared on its public part
        (a secret part is neither sent, stored nor echoed); `serial` as
        given, trimmed. Every call is an `events` row
        (`registry_validated`) with the client and the purpose.
      security:
        - operatorToken: []
      parameters:
        - name: purpose
          in: query
          required: true
          schema: {$ref: "#/components/schemas/RegistryPurpose"}
        - name: operator
          in: query
          schema: {type: string, maxLength: 64}
        - name: serial
          in: query
          schema: {type: string, maxLength: 64}
        - name: pilot
          in: query
          schema: {type: string, maxLength: 32}
      responses:
        "200":
          description: One part per key asked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryValidation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/intents:
    post:
      operationId: createIntent
      tags:
      - intents
      summary: File an operational intent and get the authorisation decision
      description: 'Decides an intent/request/v1 (2021/664 Art. 6(4), 10) in the order of brief WP-7: the
        registry (F8, purpose authorisation), the CIS cache (stale or known outdated refuses; U-space airspace
        and its Art. 3(4) constraints; zones and ANSP restrictions, Art. 10(7)), strategic deconfliction
        against the authorised intents of this USSP and the peers'' intents (priority, then first come first
        served, Art. 10(8), (9)), then the DSS, the deviation thresholds and the authorisation number (Art.
        10(11)). A missing, stale or untrusted input refuses or holds; it never authorises. An open A1 flight
        with a C0 or privately built UA below 250 g is accepted voluntarily without a number (Art. 1(3)).
        A refusal is a decision (201) whose conflicts[] name the Annex IV item, zone, airspace, restriction,
        intent or registry key; a request that does not carry the items is 400 annex_iv_invalid. Idempotent
        on (client, client_ref): the same body answers the decision as it stands (200), another body 409.
        The UAS serial must be bound to the client and operator_reg must be the client''s operator (403).
        503 names the dependency that is missing (geoid_unavailable, database_unavailable, projection_unavailable).'
      security:
      - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
      responses:
        '201':
          description: 'Decided: authorised, accepted_voluntary, rejected or pending_*.'
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDecision'
        '200':
          description: The decision of an earlier request with the same client_ref and body.
          content: *id001
        '400': &id002
          $ref: '#/components/responses/Problem'
        '401': *id002
        '403': *id002
        '409': *id002
        '413': *id002
        '429': *id002
        '503': *id002
        default: *id002
    get:
      operationId: listIntents
      tags:
      - intents
      summary: The operator's intents, newest first
      description: At most 500; from and to keep the intents whose window overlaps them; state filters.
      security:
      - operatorToken: []
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: state
        in: query
        schema:
          type: string
          maxLength: 32
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: The intents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentList'
        '400': *id002
        '401': *id002
        '403': *id002
        '503': *id002
        default: *id002
  /v1/intents/{intent_id}:
    parameters:
    - $ref: '#/components/parameters/IntentID'
    get:
      operationId: getIntent
      tags:
      - intents
      summary: 'One of the operator''s intents: its decision and state'
      description: Another operator's intent is 404, never 403.
      security:
      - operatorToken: []
      responses:
        '200':
          description: The decision as it stands.
          content: *id001
        '401': *id002
        '403': *id002
        '404': *id002
        '503': *id002
        default: *id002
    patch:
      operationId: changeIntent
      tags:
      - intents
      summary: Activate, modify or end an intent
      description: 'activate: an accepted intent from time_start - policy.activation_lead_s to time_end,
        on the database clock, confirmed in the response (Art. 10(5)); modify: an accepted intent''s new
        volumes decided as a new version that keeps the id and, when still authorised, the authorisation
        number (Art. 6(6)); a modification that is not authorised leaves the intent in its new decision''s
        state without a number; end: any open intent. A transition the state does not allow is 409.'
      security:
      - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentPatch'
      responses:
        '200':
          description: The new version.
          content: *id001
        '400': *id002
        '401': *id002
        '403': *id002
        '404': *id002
        '409': *id002
        '413': *id002
        '503': *id002
        default: *id002

  /v1/telemetry:
    get:
      operationId: openTelemetryStream
      tags: [telemetry]
      summary: Stream operator telemetry (WebSocket)
      description: |
        A WebSocket upgrade (served by telemetry-ingest). The client is an
        operator machine client with a bearer token granting
        ussp.telemetry (issued by this USSP); the client id is the token's
        sub. A browser upgrade must come from an Origin on
        USSP_WS_ALLOWED_ORIGINS with the uspace_session cookie, and a
        refused upgrade is accepted and closed with 4401 (M22); no session
        realm streams telemetry. A client whose operator_ws source is
        switched off is refused before the upgrade with 503 and
        Retry-After (B-10), and an open socket is closed with 1013 when
        the switch goes off.

        Client to server: one message per sample, {"schema":
        "telemetry/v1", "body": TelemetryFrame} (the console frame, M29;
        other envelope members are ignored), at most 8 KiB, for a serial
        bound to the client (06 T3). A sample for an unbound serial is
        refused_unbound and the socket stays up. One aircraft is streamed
        by one socket: a later socket that sends for it replaces the
        earlier one, whose next sample for it is refused_replaced (B-14).
        Live samples above 2 Hz per aircraft are dropped and counted; a
        (serial, epoch, seq) with the same ts seen in the last
        telemetry_dedupe_s (600 s, the client's queue) is acknowledged and
        not published twice; the same key with another ts is a new
        sample. Inside U-space airspace a sample needs an
        activated intent of this aircraft (intent_id), else it is refused
        (refused_no_authorisation, refused_intent_state).

        Server to client: only console/status/v1 frames, on connect,
        every 2 s and after a refusal, with these extras in the body:
        accepted, refused, dropped, outcomes (count per outcome name),
        rate (accepted samples per second), backlog (history samples
        accepted) and acked_seq (per serial, the highest seq such that
        every sample of that serial sent on this socket up to it is
        published or durably queued, or refused for good: the client may
        let those go, B-05). Nothing else is ever sent: the socket has no
        message that could command an aircraft (CLAUDE.md rule 1).
      security:
      - operatorToken: []
      responses:
        "101":
          description: Switching protocols; the stream described above follows.
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          description: The client's operator_ws source is switched off; retry after the Retry-After seconds.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/authority/flights:
    get:
      operationId: openAuthorityFlights
      tags: [authority]
      summary: Stream every airborne flight to the authority (WebSocket, optional)
      description: |
        The optional national extension of spec 02 F7 (docs/PLAN.md D12),
        served by rid-sp only when USSP_AUTHORITY_PUSH=on; otherwise the
        path is not served (404). It never replaces the F3411 Display
        Provider path (GET /uss/flights), which works with it off.

        A WebSocket upgrade with an ecosystem bearer token granting
        rid.display_provider (aud this host). Server to client only, the
        console frame (M29): console/status/v1 on connect and every 2 s,
        and one authority/flight/v1 frame (schemas/authority/flight/v1:
        the common envelope with an ASTM F3411-22a RIDFlight as body,
        operator_location never included) per airborne flight per second.
        While no client is connected the frames are buffered for ten
        minutes and sent on the next connection with backlog true; what
        the buffer sheds is a gap: counted, logged and shown as
        dropped_frames and the degraded slug authority_push_gap on the
        next status frame. Client messages are ignored.
      security:
      - ecosystemToken: []
      responses:
        "101":
          description: Switching protocols; the stream described above follows.
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/telemetry/batch:
    post:
      operationId: postTelemetryBatch
      tags: [telemetry]
      summary: Send telemetry samples in one request
      description: |
        The same pipeline as the WebSocket (served by telemetry-ingest)
        for at most 2000 samples whose own times span at most 1 s per
        serial (telemetry_batch_span_s), placed against the batch's
        sent_at when it has one (T-02); backlog samples (a client
        draining its queue after an outage) carry backlog true and are
        recorded, never alerted (T-04). The answer comes once every
        accepted sample is published or durably queued (B-05): accepted
        counts only those; a sample that could not be handed is
        not_acknowledged and is sent again. A sample that does not read
        as telemetry/v1 is refused_invalid with its field errors and the
        others are taken. 503 with Retry-After when the client's
        operator_ws source is switched off (B-10).
      security:
      - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
      responses:
        "202":
          description: Taken; the counts and every sample that was not accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryBatchResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /oauth/token:
    post:
      operationId: requestToken
      tags: [oauth]
      summary: Client credentials grant for operator machine clients
      description: |
        RFC 6749 §4.4 client credentials at this USSP's own issuer (D9).
        The client authenticates with HTTP Basic (`client_secret_basic`)
        or with `client_id` and `client_secret` in the body
        (`client_secret_post`), never both; the secret is checked with
        argon2id in constant time, and during a rotation the previous
        secret is accepted until its overlap ends
        (`policy.client_secret_overlap_s`). Parameters in the query
        string are refused. `scope` names operator scopes (`ussp.intents`,
        `ussp.telemetry`, `ussp.traffic`, `ussp.geo`); an unknown scope is
        refused; the token grants the requested scopes that the client
        holds (all of them when `scope` is absent). `audience`, when
        given, must be this USSP's host: `aud` is always this USSP's host
        (M18). The TTL is `policy.operator_token_ttl_s` (at most 3600 s).
        Issuance is rate-limited per client and per client address (429
        with `Retry-After`). Every issuance and refusal is an `events`
        row. Errors carry the RFC 6749 §5.2 `error` beside the problem
        members.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: An operator machine token (cross-plan Appendix A).
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "429":
          description: The client's or the address's issuance budget is spent.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/OAuthProblem"
        "503":
          $ref: "#/components/responses/OAuthError"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [oauth]
      summary: The issuer's public keys
      description: |
        The RS256 keys of this USSP's issuer (`use: sig`, `kid` = the RFC
        7638 SHA-256 thumbprint): the current key and, during a rotation,
        the previous one (`USSP_ISSUER_PREVIOUS_KEY_FILE`). Operator
        tokens and session tokens are signed by the current key.
      security: []
      responses:
        "200":
          description: The JWKS.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "503":
          description: No issuer key is configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/login:
    post:
      operationId: login
      tags: [accounts]
      summary: Start a portal or console session
      description: |
        Checks a username and password (argon2id) in the realm `portal`
        (operator users) or `console` (staff); a staff `admin` also sends
        a TOTP code. An unknown user, a wrong password and a wrong code
        are one answer. Ten consecutive failures for one username lock it
        for 15 minutes (the lock is in the database and holds across
        replicas; 429 with `Retry-After`); attempts are also limited per
        client address. On success the answer carries the session JWT
        (`iss` = this issuer, `aud` = this host, `sub` = the account id,
        `scope = "session"`, `roles`, `realm`, `jti` = the session id,
        `exp` at most 12 h, idle end after 30 min) and sets the cookies
        `uspace_session` and `uspace_csrf` (`HttpOnly; Secure;
        SameSite=Strict`). A request authenticated by the cookie sends the
        `uspace_csrf` value as `X-CSRF-Token` on every method that is not
        GET, HEAD or OPTIONS. Every attempt is an `events` row.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The session.
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          description: The username is locked or the address's budget is spent.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/logout:
    post:
      operationId: logout
      tags: [accounts]
      summary: End the caller's session
      description: Revokes the session (its `jti`) and clears both cookies.
      security:
        - session: []
      responses:
        "204":
          description: The session is ended.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/me:
    get:
      operationId: getMe
      tags: [accounts]
      summary: The caller's account and session
      security:
        - session: []
      responses:
        "200":
          description: The account behind the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators:
    post:
      operationId: registerOperator
      tags: [accounts]
      summary: Self-registration of a UAS operator
      description: |
        Creates the USSP's customer record of an operator registered with
        the authority, and its first portal user with the role
        `operator_admin`. The registration number is checked with the
        authority's registry (F8): the operator is `active` once the
        registry says `valid`, `pending_validation` while it says
        `unknown` or cannot be asked, and refused when it says anything
        else. No client may be created and no token issued before the
        operator is `active`. Rate-limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorRegistration"
      responses:
        "201":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
    get:
      operationId: getOperator
      tags: [accounts]
      summary: The caller's operator
      description: Portal session of an `operator_admin` of this operator.
      security:
        - session: []
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOperator
      tags: [accounts]
      summary: Change the operator's record
      description: |
        Changes the display name and the contact email. An operator still
        `pending_validation` is checked with the registry again.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorUpdate"
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
    post:
      operationId: createClient
      tags: [accounts]
      summary: Create a machine client of the operator
      description: |
        A client-credentials client with operator scopes, for an `active`
        operator. The secret is in this answer only; it is stored as an
        argon2id hash. The creation is an `events` row, which is the
        operator's notification for now (06 T3).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
      responses:
        "201":
          description: The client and its secret, shown once.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSecret"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients/{client_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
      - $ref: "#/components/parameters/ClientID"
    post:
      operationId: rotateClientSecret
      tags: [accounts]
      summary: Rotate a client's secret
      description: |
        A new secret, shown once. The previous one keeps working until
        `previous_valid_until` (`policy.client_secret_overlap_s` from
        now) and never after.
      security:
        - session: []
      responses:
        "200":
          description: The new secret.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSecret"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients/{client_id}/serials:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
      - $ref: "#/components/parameters/ClientID"
    post:
      operationId: bindSerial
      tags: [accounts]
      summary: Bind a UAS serial number to a client
      description: |
        A client sends telemetry only for its bound serials (06 T3). The
        serial is validated by uspace-core `serial.ValidateForClass` with
        `class_label` and compared by `serial.FoldKey`; a serial bound to
        another client is refused (409). The binding is projected to KV `client_bindings`
        in the same transaction; when the projection cannot take it,
        nothing changes (503).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialBindingRequest"
      responses:
        "201":
          description: The binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialBinding"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients/{client_id}/serials/{serial}:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
      - $ref: "#/components/parameters/ClientID"
      - name: serial
        in: path
        required: true
        schema: {type: string, maxLength: 64}
    delete:
      operationId: unbindSerial
      tags: [accounts]
      summary: Unbind a serial from a client
      security:
        - session: []
      responses:
        "204":
          description: The serial is no longer bound to the client.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 machine token issued by this USSP (POST /oauth/token,
        client credentials) to an operator client; aud is this host.
    ecosystemToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 machine token of an allow-listed ecosystem issuer (the
        authority's token service; the lab issuer in the lab) presented
        by the authority, the ANSP or a peer; aud is this host (M18).
    session:
      type: apiKey
      in: cookie
      name: uspace_session
      description: |
        Portal or console session: a JWT with scope "session", roles and
        realm, in the uspace_session cookie; state-changing requests also
        send the uspace_csrf cookie's value as X-CSRF-Token (M20, M21).

  parameters:
    OperatorID:
      name: operator_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientID:
      name: client_id
      in: path
      required: true
      schema: {type: string, maxLength: 64}

    IntentID:
      name: intent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    OAuthError:
      description: A refused token request (RFC 6749 §5.2 inside a problem).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OAuthProblem"

  schemas:
    Problem:
      type: object
      description: |
        The ecosystem-wide error body (RFC 9457), the shape of
        uspace-lab schemas/common/problem/v1, mirrored here until that
        schema is published (reconciliation M28).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          pattern: "^https://schemas\\.uspace\\.ge/problems/[a-z][a-z0-9_]*$"
          description: https://schemas.uspace.ge/problems/<slug>, the slug being the counter or refusal name.
          examples: ["https://schemas.uspace.ge/problems/not_found"]
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        errors:
          type: array
          description: Field problems, at most 100; truncated says when more existed.
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldProblem"
        truncated:
          type: boolean
    FieldProblem:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: The JSON path or parameter name at fault.
        reason:
          type: string

    RegistryPurpose:
      type: string
      enum: [authorisation, identification]
      description: Why the lookup is made; recorded on every call here and at the authority (spec 02 F8).
    RegistryStatus:
      type: string
      enum: [valid, suspended, revoked, unknown]
    RegistryCompetency:
      type: object
      required: [competency, valid_until]
      properties:
        competency: {type: string, maxLength: 64}
        valid_until: {type: string, format: date-time}
    RegistryAnswer:
      type: object
      required: [key, status]
      description: One entity's answer, status only.
      properties:
        key:
          type: string
          description: The key as answered (an operator number's public part, the serial, the pilot id).
        status: {$ref: "#/components/schemas/RegistryStatus"}
        reason:
          type: string
          enum: [registry_unavailable, registry_answer_refused]
          description: Why the status is unknown without the registry having said so; absent when it did.
        valid_until:
          type: string
          format: date-time
          description: The registration's end of validity (an operator's), as the authority answers it.
        class_label: {type: string, maxLength: 64}
        mtom_band: {type: string, maxLength: 64}
        competencies:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/RegistryCompetency"}
        cache_age_s:
          type: number
          format: double
          minimum: 0
          description: The age of the answer in seconds (0 when the authority was just asked); absent when there is no answer.
    RegistryValidation:
      type: object
      description: One part per key asked.
      properties:
        operator: {$ref: "#/components/schemas/RegistryAnswer"}
        uas: {$ref: "#/components/schemas/RegistryAnswer"}
        pilot: {$ref: "#/components/schemas/RegistryAnswer"}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      required: [status, checked_at, dependencies, degraded]
      properties:
        status:
          type: string
          enum: [ready, degraded, not_ready]
          description: not_ready while a required dependency is down or unknown; degraded while any dependency is not up.
        checked_at:
          type: string
          format: date-time
        dependencies:
          type: object
          description: Every dependency of the process, by name (postgres, timescaledb, nats).
          additionalProperties:
            $ref: "#/components/schemas/Dependency"
        degraded:
          type: array
          description: The names of the dependencies that are not up, sorted.
          items:
            type: string
    Dependency:
      type: object
      required: [state, required, since]
      properties:
        state:
          type: string
          enum: [up, degraded, down, unknown]
        required:
          type: boolean
          description: Whether the process is not ready while this dependency is down or unknown.
        since:
          type: string
          format: date-time
          description: When the dependency entered its current state.
        age_s:
          type: number
          format: double
          minimum: 0
          description: Seconds since the dependency was last seen up; 0 while it is up, absent when it never was.
        detail:
          type: string
          description: Why the dependency is not up; absent while it is.

    OAuthProblem:
      description: |
        A problem (M28) that also carries the RFC 6749 §5.2 members, so an
        OAuth2 client library reads `error` and a uspace client reads the
        problem.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [invalid_request, invalid_client, invalid_scope, invalid_target, unauthorized_client, unsupported_grant_type, temporarily_unavailable]
            error_description:
              type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          maxLength: 64
        client_secret:
          type: string
          maxLength: 256
        scope:
          type: string
          description: Space-separated operator scopes.
        audience:
          type: string
          description: When given, this USSP's host (M18).
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string}
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          maximum: 3600
          description: Seconds until exp.
        scope:
          type: string
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true

    Realm:
      type: string
      enum: [portal, console]
      description: portal for operator users, console for staff (M20).
    LoginRequest:
      type: object
      required: [realm, username, password]
      properties:
        realm:
          $ref: "#/components/schemas/Realm"
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
        totp_code:
          type: string
          description: Six digits; required for a staff admin.
          maxLength: 16
    Session:
      type: object
      required: [token, csrf_token, account_id, realm, roles, expires_at, idle_expires_at]
      properties:
        token:
          type: string
          description: The session JWT, also set as the uspace_session cookie; the BFF carries it as a bearer.
        csrf_token:
          type: string
          description: The uspace_csrf value, sent as X-CSRF-Token with a cookie-authenticated request.
        account_id:
          type: string
        realm:
          $ref: "#/components/schemas/Realm"
        roles:
          type: array
          items: {type: string}
        operator_id:
          type: string
          description: The operator of a portal account.
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
    Me:
      type: object
      required: [account_id, username, realm, roles, session_expires_at]
      properties:
        account_id: {type: string}
        username: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        roles:
          type: array
          items: {type: string}
        operator_id: {type: string}
        session_expires_at:
          type: string
          format: date-time

    OperatorStatus:
      type: string
      enum: [pending_validation, active, refused]
    OperatorRegistration:
      type: object
      required: [registration_number, display_name, contact_email, admin_username, admin_password]
      properties:
        registration_number:
          type: string
          maxLength: 32
          description: The operator registration number the authority issued.
        display_name:
          type: string
          maxLength: 200
        contact_email:
          type: string
          maxLength: 254
        admin_username:
          type: string
          maxLength: 64
        admin_password:
          type: string
          maxLength: 1024
    OperatorUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 200
        contact_email:
          type: string
          maxLength: 254
    Operator:
      type: object
      required: [id, registration_number, display_name, contact_email, status, created_at]
      properties:
        id: {type: string}
        registration_number: {type: string}
        display_name: {type: string}
        contact_email: {type: string}
        status:
          $ref: "#/components/schemas/OperatorStatus"
        validation_status:
          type: string
          description: The registry's last answer (valid, unknown, or the refusal).
        validated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    OperatorScope:
      type: string
      enum: [ussp.intents, ussp.telemetry, ussp.traffic, ussp.geo]
    ClientRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/OperatorScope"
    ClientSecret:
      type: object
      required: [client_id, client_secret, scopes, status]
      properties:
        client_id: {type: string}
        client_secret:
          type: string
          description: Shown once; never stored in clear and never retrievable again.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/OperatorScope"
        status: {type: string}
        previous_valid_until:
          type: string
          format: date-time
          description: Set by a rotation; the previous secret works until then.
    SerialBindingRequest:
      type: object
      required: [serial]
      properties:
        serial:
          type: string
          maxLength: 64
          description: The UAS serial number (ANSI/CTA-2063-A).
        class_label:
          type: string
          enum: [C0, C1, C2, C3, C4, C5, C6]
          description: |
            The aircraft's class (2019/945). C1, C2, C3, C5 and C6 need a
            valid CTA-2063-A serial; C0, C4 and an unlabelled aircraft (no
            class_label) only a serial that is not empty (LESSONS G-06).
    SerialBinding:
      type: object
      required: [client_id, serial, serial_fold, bound_at]
      properties:
        client_id: {type: string}
        serial: {type: string}
        serial_fold:
          type: string
          description: uspace-core serial.FoldKey of the serial.
        bound_at:
          type: string
          format: date-time
    IntentRequest:
      description: 'intent/request/v1 (schemas/intent/request/v1/schema.json, the source of truth): the ten
        Annex IV items numbered as in the Annex, the contingency measures, the emergency contact reference
        and the idempotency reference.'
      type: object
      additionalProperties: false
      required:
      - client_ref
      - uas_serial
      - mode
      - flight_type
      - category
      - volumes
      - identification_technology
      - connectivity_methods
      - endurance_s
      - loss_of_c2_procedure
      - operator_reg
      - contingency
      - emergency_contact_ref
      properties:
        client_ref:
          description: 'Idempotency reference, unique per client: the same body under it answers the same
            decision, another body is refused with 409.'
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        uas_serial:
          description: (1) Serial number of the UA or of its add-on (ANSI/CTA-2063-A where the class requires
            it).
          type: string
          minLength: 1
          maxLength: 64
        mode:
          description: (2) Mode of operation.
          enum:
          - VLOS
          - BVLOS
        flight_type:
          description: '(3) Type of flight: a special operation per SERA Art. 4, or normal.'
          enum:
          - normal
          - special_operation
        priority:
          description: '(3) F3548 priority; when given it must equal the derived one: 0 for normal, the policy''s
            special_operation_priority for special_operation.'
          type: integer
          minimum: 0
        category:
          description: (4) Category of the operation.
          enum:
          - open
          - specific
          - certified
        subcategory:
          description: (4) Open subcategory.
          enum:
          - A1
          - A2
          - A3
        class_label:
          description: (4) Class label of the UA.
          enum:
          - C0
          - C1
          - C2
          - C3
          - C4
          - C5
          - C6
        type_certificate:
          description: (4) Type certificate (certified category).
          type: string
          minLength: 1
          maxLength: 64
        privately_built:
          description: (4) The UA is privately built (Art. 1(3) with mtom_kg).
          type: boolean
        mtom_kg:
          description: (4) Declared maximum take-off mass in kilograms.
          type: number
          exclusiveMinimum: 0
          maximum: 25000
        volumes:
          description: '(5) The 4D trajectory: F3548 Volume4D, every one with both times and both altitudes.'
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/IntentVolume4D'
        identification_technology:
          description: (6) Identification technology.
          enum:
          - network
          - direct
          - both
        connectivity_methods:
          description: (7) Connectivity methods.
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9_-]{1,32}$
        endurance_s:
          description: (8) Endurance in seconds; it must cover the window of the volumes.
          type: integer
          minimum: 1
          maximum: 172800
        loss_of_c2_procedure:
          description: (9) Procedure on loss of the command and control link.
          type: string
          minLength: 1
          maxLength: 256
        operator_reg:
          description: (10) Operator registration number, public part only.
          type: string
          minLength: 1
          maxLength: 64
        ua_registration:
          description: (10) UA registration number when applicable (required in the certified category).
          type: string
          minLength: 1
          maxLength: 64
        pilot_ref:
          description: Remote pilot identifier for the registry check.
          type: string
          minLength: 1
          maxLength: 32
        takeoff:
          $ref: '#/components/schemas/IntentPoint'
        landing:
          $ref: '#/components/schemas/IntentPoint'
        contingency:
          description: Contingency measures (Art. 6(8)).
          type: object
          additionalProperties: false
          required:
          - procedure
          properties:
            procedure:
              type: string
              minLength: 1
              maxLength: 512
            landing_sites:
              type: array
              maxItems: 16
              items:
                $ref: '#/components/schemas/IntentPoint'
        emergency_contact_ref:
          description: Reference to the emergency contact (never the contact itself).
          type: string
          minLength: 1
          maxLength: 128
        authorisation_ref:
          description: 'A specific-category authorisation from the authority: a zone requiring an authorisation
            becomes a condition instead of pending_authority.'
          type: string
          minLength: 1
          maxLength: 128
    IntentPoint:
      type: object
      additionalProperties: false
      required:
      - lat
      - lng
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    IntentTime:
      type: object
      additionalProperties: false
      required:
      - value
      - format
      properties:
        value:
          type: string
          format: date-time
        format:
          const: RFC3339
    IntentAltitude:
      type: object
      additionalProperties: false
      required:
      - value
      - reference
      - units
      properties:
        value:
          type: number
          minimum: -8000
          maximum: 100000
        reference:
          const: W84
        units:
          const: M
    IntentVolume4D:
      type: object
      additionalProperties: false
      required:
      - volume
      - time_start
      - time_end
      properties:
        volume:
          type: object
          additionalProperties: false
          required:
          - altitude_lower
          - altitude_upper
          properties:
            outline_polygon:
              type: object
              additionalProperties: false
              required:
              - vertices
              properties:
                vertices:
                  type: array
                  minItems: 3
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/IntentPoint'
            outline_circle:
              type: object
              additionalProperties: false
              required:
              - center
              - radius
              properties:
                center:
                  $ref: '#/components/schemas/IntentPoint'
                radius:
                  type: object
                  additionalProperties: false
                  required:
                  - value
                  - units
                  properties:
                    value:
                      type: number
                      exclusiveMinimum: 0
                    units:
                      const: M
            altitude_lower:
              $ref: '#/components/schemas/IntentAltitude'
            altitude_upper:
              $ref: '#/components/schemas/IntentAltitude'
          oneOf:
          - required:
            - outline_polygon
          - required:
            - outline_circle
        time_start:
          $ref: '#/components/schemas/IntentTime'
        time_end:
          $ref: '#/components/schemas/IntentTime'
    IntentDecision:
      description: intent/decision/v1 (schemas/intent/decision/v1/schema.json, the source of truth).
      type: object
      additionalProperties: false
      required:
      - intent_id
      - version
      - client_ref
      - decision
      - state
      - dss_state
      - authorisation_number
      - exempt_art_1_3
      - in_uspace_airspace
      - uspace_airspace_ids
      - priority
      - deviation_thresholds
      - alternative
      - conflicts
      - conditions
      - volumes_amsl
      - valid_from
      - valid_to
      - cis_version_checked
      - cis_age_s
      - registry_checked_at
      - policy_version
      - weather_checked_ref
      - change_reason
      - decided_at
      - updated_at
      properties:
        intent_id:
          description: UUID, also the DSS entity id.
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        version:
          type: integer
          minimum: 1
        client_ref:
          type: string
        decision:
          enum:
          - authorised
          - accepted_voluntary
          - rejected
          - pending_validation
          - pending_authority
          - pending_dss
        state:
          enum:
          - pending_validation
          - pending_dss
          - pending_authority
          - accepted
          - activated
          - nonconforming
          - contingent
          - ended
          - rejected
          - withdrawn
        dss_state:
          description: F3548 state of the intent, null when it is not one the DSS holds.
          enum:
          - Accepted
          - Activated
          - Nonconforming
          - Contingent
          - null
        authorisation_number:
          description: <USSP code>-<operator registration public part>-<ULID> (spec 03 §6); null unless authorised.
          type:
          - string
          - 'null'
          pattern: ^[A-Z0-9-]{1,16}-[A-Za-z0-9-]{1,64}-[0-7][0-9A-HJKMNP-TV-Z]{25}$
        exempt_art_1_3:
          type: boolean
        in_uspace_airspace:
          type: boolean
        uspace_airspace_ids:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 0
        deviation_thresholds:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - h_m
            - v_m
            - t_s
            properties:
              h_m:
                type: number
                exclusiveMinimum: 0
              v_m:
                type: number
                exclusiveMinimum: 0
              t_s:
                type: number
                exclusiveMinimum: 0
        alternative:
          description: Art. 10(4) proposal; none in v1.
          type: 'null'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/IntentConflict'
        conditions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - detail
            properties:
              code:
                type: string
                pattern: ^[a-z][a-z0-9_]*$
              ref:
                type: string
              detail:
                type: string
        volumes_amsl:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - lower_amsl_m
            - upper_amsl_m
            - undulation_m
            - lower_w84_m
            - upper_w84_m
            properties:
              lower_amsl_m:
                type: number
              upper_amsl_m:
                type: number
              undulation_m:
                type: number
              lower_w84_m:
                type: number
              upper_w84_m:
                type: number
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        cis_version_checked:
          description: The CIS versions the decision rests on, one label per ED-318 dataset; null when the
            CIS was not consulted.
          type:
          - string
          - 'null'
        cis_age_s:
          type:
          - number
          - 'null'
          minimum: 0
        registry_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        policy_version:
          type: integer
          minimum: 0
        weather_checked_ref:
          description: Art. 10(3); null until weather (WP-16).
          type:
          - string
          - 'null'
        change_reason:
          type:
          - string
          - 'null'
        decided_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntentConflict:
      type: object
      additionalProperties: false
      required:
      - kind
      - reason
      - effect
      - item
      - volume
      - overlap
      - detail
      properties:
        kind:
          enum:
          - annex_iv
          - registry
          - cis
          - airspace
          - zone
          - restriction
          - intent
          - policy
          - dss
        reason:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        effect:
          enum:
          - rejects
          - holds
          - flags_other
        ref:
          type: string
        item:
          description: The Annex IV item number, null when the conflict is not about one.
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10
        volume:
          description: Index of our volume.
          type:
          - integer
          - 'null'
          minimum: 0
        overlap:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - h_m
            - v_m
            - t_s
            properties:
              h_m:
                description: Horizontal separation, 0 when the outlines meet; null when not judged.
                type:
                - number
                - 'null'
              v_m:
                description: Vertical overlap in AMSL; null when a limit is not AMSL.
                type:
                - number
                - 'null'
              t_s:
                description: Common time in seconds.
                type:
                - number
                - 'null'
        detail:
          type: string
    IntentPatch:
      type: object
      additionalProperties: false
      required:
      - action
      description: activate (confirmed in the response, Art. 10(5)), modify (new volumes re-decided as a new
        version, Art. 6(6)) or end.
      properties:
        action:
          enum:
          - activate
          - modify
          - end
        volumes:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/IntentVolume4D'
          description: Required for modify, refused otherwise.
        change_reason:
          type: string
          minLength: 1
          maxLength: 256
    IntentList:
      type: object
      required:
      - intents
      properties:
        intents:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/IntentDecision'
    TelemetryFrame:
      description: telemetry/v1 (schemas/telemetry/v1/schema.json, the source of truth).
      type: object
      additionalProperties: false
      required: [ts, serial, seq, position, alt_wgs84_m, height_m, height_ref, speed_ms, track_deg, vspeed_ms, status, emergency,
        accuracy_h, accuracy_v, timestamp_accuracy_s]
      properties:
        ts: {type: string, format: date-time, description: "The client's clock, RFC 3339 in UTC with Z."}
        serial: {type: string, minLength: 1, maxLength: 64}
        seq: {type: integer, format: int64, minimum: 0}
        epoch: {type: string, minLength: 1, maxLength: 64, description: "The client's run of its seq counter: a new one whenever seq starts again."}
        backlog: {type: boolean}
        end: {type: boolean}
        intent_id: {type: [string, "null"], format: uuid}
        position:
          $ref: "#/components/schemas/TelemetryPosition"
        alt_wgs84_m: {type: [number, "null"], format: double}
        alt_pressure_m: {type: [number, "null"], format: double}
        height_m: {type: [number, "null"], format: double}
        height_ref: {type: [string, "null"], enum: [TakeoffLocation, GroundLevel, null]}
        speed_ms: {type: [number, "null"], format: double, minimum: 0}
        track_deg: {type: [number, "null"], format: double, minimum: 0, exclusiveMaximum: 360}
        vspeed_ms: {type: [number, "null"], format: double}
        status: {type: string, enum: [Undeclared, Ground, Airborne, Emergency, RemoteIDSystemFailure]}
        emergency: {type: boolean}
        operator_position:
          oneOf:
          - $ref: "#/components/schemas/TelemetryOperatorPosition"
          - type: "null"
        accuracy_h: {type: string, enum: [HAUnknown, HA10NMPlus, HA10NM, HA4NM, HA2NM, HA1NM, HA05NM, HA03NM, HA01NM, HA005NM, HA30m,
            HA10m, HA3m, HA1m]}
        accuracy_v: {type: string, enum: [VAUnknown, VA150mPlus, VA150m, VA45m, VA25m, VA10m, VA3m, VA1m]}
        timestamp_accuracy_s: {type: [number, "null"], format: double, minimum: 0}
    TelemetryPosition:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: {type: number, format: double, minimum: -90, maximum: 90}
        lng: {type: number, format: double, minimum: -180, maximum: 180}
    TelemetryOperatorPosition:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat: {type: number, format: double, minimum: -90, maximum: 90}
        lng: {type: number, format: double, minimum: -180, maximum: 180}
        alt_wgs84_m: {type: [number, "null"], format: double}
    TelemetryBatch:
      type: object
      additionalProperties: false
      required: [frames]
      properties:
        sent_at:
          type: string
          format: date-time
          description: |
            The client's clock when it sent the batch (RFC 3339 in UTC with
            Z). With it every sample is placed at receipt - (sent_at - ts),
            so the client's clock error cancels and a drained backlog keeps
            its own times (T-02); without it the batch rule places the
            samples against the newest one.
        frames:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: "#/components/schemas/TelemetryFrame"
    TelemetryOutcome:
      description: One sample that was not accepted, by its index in the request.
      type: object
      required: [index, outcome]
      properties:
        index: {type: integer, minimum: 0}
        serial: {type: string}
        seq: {type: integer, format: int64}
        outcome:
          type: string
          description: |
            duplicate (taken before: acknowledged), duplicate_pending (taken
            before and still on its way: send it again later),
            refused_invalid, refused_unbound, refused_bindings_unavailable,
            refused_source_disabled, refused_capacity,
            rejected_out_of_order, rejected_too_old, refused_intent_state,
            refused_no_authorisation, refused_batch_span, dropped_rate,
            dropped_queue_full or not_acknowledged (send again).
        detail: {type: string}
    TelemetryBatchResult:
      type: object
      additionalProperties: false
      required: [accepted, refused, dropped, duplicate, not_acknowledged, outcomes]
      properties:
        accepted: {type: integer, minimum: 0, description: "Published or durably queued (B-05)."}
        refused: {type: integer, minimum: 0}
        dropped: {type: integer, minimum: 0}
        duplicate: {type: integer, minimum: 0}
        not_acknowledged: {type: integer, minimum: 0}
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryOutcome"
