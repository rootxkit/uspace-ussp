openapi: 3.1.0
info:
  title: uspace-ussp national USSP API
  version: 0.1.0
  description: |
    The national API of a U-space Service Provider of the Georgian
    U-space system-of-systems (Reg. (EU) 2021/664 Art. 7-13, 15). This
    file is the published contract: an endpoint that is not in it does
    not exist. The standard interfaces (ASTM F3411-22a, ASTM F3548-21)
    are served from the pinned standard files, not from this one.

    Every error is application/problem+json in the shape of the Problem
    schema (reconciliation M28).

    Skeleton (WP-0): health and readiness, the security schemes and the
    tags. Every later work package adds its paths under its tag. WP-4:
    the CIS change-notification receiver.
  license:
    name: Apache-2.0
servers:
  - url: "https://{host}"
    description: A USSP deployment; the host is configuration, never code.
    variables:
      host:
        default: localhost
        description: The public host of the deployment.
tags:
  - name: health
    description: Liveness and readiness of one process instance.
  - name: intents
    description: Flight authorisation and operational intents (Art. 10).
  - name: geo
    description: Geo-awareness from the CIS (Art. 9).
  - name: telemetry
    description: Operator telemetry in (Art. 8(2)).
  - name: traffic
    description: Traffic information and its stream (Art. 11).
  - name: alerts
    description: Conformance and proximity alerts and their acknowledgement (Art. 13).
  - name: registry
    description: Registry validation through the authority (F8).
  - name: weather
    description: Weather information (Art. 12, optional).
  - name: records
    description: Flight records and daily bundles for the authority (Art. 15(1)(g)).
  - name: authority
    description: The optional national push of network identification to the authority.
  - name: cis
    description: CIS change notifications from the CISP or the ANSP.
  - name: oauth
    description: This USSP's token issuer for operator machine clients.
  - name: accounts
    description: Operator and staff accounts, clients and sessions.
  - name: admin
    description: The USSP console (staff).

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      description: 200 while the process runs. Says nothing about dependencies.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      description: |
        Runs every dependency check of the process and reports each with
        its state, since when, how long ago it was last seen up, and why
        it is not up. 503 while a required dependency is down or has not
        been checked; 200 otherwise, with every dependency that is not up
        listed in degraded. A check that did not run is "unknown", never
        "up".
      security: []
      responses:
        "200":
          description: Ready; degraded lists what is not up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; a required dependency is down or unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"

  /v1/cis/notifications:
    post:
      operationId: receiveCISNotification
      tags: [cis]
      summary: Receive a CIS change notification (F3 push)
      description: |
        The receiver of every subscriber in the ecosystem (M1): the CISP
        POSTs here the callback it registered, and the ANSP posts here
        on its degraded direct path while the CISP is down (M5). The body
        is a compact JWS (application/jose) whose payload is {iss, aud,
        sub, iat, jti, body}: iss one of USSP_CIS_NOTIFY_ISSUERS (each
        verified against its JWKS), aud this host (M19), sub the
        subscription (the restriction id from the ANSP), jti the
        delivery id, iat at most 5 minutes old, and body the
        cis/change/v1 record of the CISP's pinned schema. There is no
        bearer: the signature authenticates the sender.

        A delivery id seen before is acknowledged 204 and not acted on
        (it is remembered in the database on every replica). The
        reasons subscription_test and republished, and any reason this
        USSP does not know, are acknowledged 204 without a pull (M16).
        Every other reason is logged and triggers a pull of the dataset:
        from pull_url when its host is the issuer's configured base host
        (and the issuer is the CISP), otherwise from the configured CISP
        base URL, the mismatch counted (the SSRF guard). The answer does
        not wait for the pull.
      security: []
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              type: string
              description: A compact JWS (three base64url parts separated by dots).
              maxLength: 262144
      responses:
        "204":
          description: Accepted, acknowledged or a replay; nothing to return.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /oauth/token:
    post:
      operationId: requestToken
      tags: [oauth]
      summary: Client credentials grant for operator machine clients
      description: |
        RFC 6749 §4.4 client credentials at this USSP's own issuer (D9).
        The client authenticates with HTTP Basic (`client_secret_basic`)
        or with `client_id` and `client_secret` in the body
        (`client_secret_post`), never both; the secret is checked with
        argon2id in constant time, and during a rotation the previous
        secret is accepted until its overlap ends
        (`policy.client_secret_overlap_s`). Parameters in the query
        string are refused. `scope` names operator scopes (`ussp.intents`,
        `ussp.telemetry`, `ussp.traffic`, `ussp.geo`); an unknown scope is
        refused; the token grants the requested scopes that the client
        holds (all of them when `scope` is absent). `audience`, when
        given, must be this USSP's host: `aud` is always this USSP's host
        (M18). The TTL is `policy.operator_token_ttl_s` (at most 3600 s).
        Issuance is rate-limited per client and per client address (429
        with `Retry-After`). Every issuance and refusal is an `events`
        row. Errors carry the RFC 6749 §5.2 `error` beside the problem
        members.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: An operator machine token (cross-plan Appendix A).
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "429":
          description: The client's or the address's issuance budget is spent.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/OAuthProblem"
        "503":
          $ref: "#/components/responses/OAuthError"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [oauth]
      summary: The issuer's public keys
      description: |
        The RS256 keys of this USSP's issuer (`use: sig`, `kid` = the RFC
        7638 SHA-256 thumbprint): the current key and, during a rotation,
        the previous one (`USSP_ISSUER_PREVIOUS_KEY_FILE`). Operator
        tokens and session tokens are signed by the current key.
      security: []
      responses:
        "200":
          description: The JWKS.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "503":
          description: No issuer key is configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/login:
    post:
      operationId: login
      tags: [accounts]
      summary: Start a portal or console session
      description: |
        Checks a username and password (argon2id) in the realm `portal`
        (operator users) or `console` (staff); a staff `admin` also sends
        a TOTP code. An unknown user, a wrong password and a wrong code
        are one answer. Ten consecutive failures for one username lock it
        for 15 minutes (the lock is in the database and holds across
        replicas; 429 with `Retry-After`); attempts are also limited per
        client address. On success the answer carries the session JWT
        (`iss` = this issuer, `aud` = this host, `sub` = the account id,
        `scope = "session"`, `roles`, `realm`, `jti` = the session id,
        `exp` at most 12 h, idle end after 30 min) and sets the cookies
        `uspace_session` and `uspace_csrf` (`HttpOnly; Secure;
        SameSite=Strict`). A request authenticated by the cookie sends the
        `uspace_csrf` value as `X-CSRF-Token` on every method that is not
        GET, HEAD or OPTIONS. Every attempt is an `events` row.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The session.
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          description: The username is locked or the address's budget is spent.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/logout:
    post:
      operationId: logout
      tags: [accounts]
      summary: End the caller's session
      description: Revokes the session (its `jti`) and clears both cookies.
      security:
        - session: []
      responses:
        "204":
          description: The session is ended.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/me:
    get:
      operationId: getMe
      tags: [accounts]
      summary: The caller's account and session
      security:
        - session: []
      responses:
        "200":
          description: The account behind the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators:
    post:
      operationId: registerOperator
      tags: [accounts]
      summary: Self-registration of a UAS operator
      description: |
        Creates the USSP's customer record of an operator registered with
        the authority, and its first portal user with the role
        `operator_admin`. The registration number is checked with the
        authority's registry (F8): the operator is `active` once the
        registry says `valid`, `pending_validation` while it says
        `unknown` or cannot be asked, and refused when it says anything
        else. No client may be created and no token issued before the
        operator is `active`. Rate-limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorRegistration"
      responses:
        "201":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
    get:
      operationId: getOperator
      tags: [accounts]
      summary: The caller's operator
      description: Portal session of an `operator_admin` of this operator.
      security:
        - session: []
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOperator
      tags: [accounts]
      summary: Change the operator's record
      description: |
        Changes the display name and the contact email. An operator still
        `pending_validation` is checked with the registry again.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorUpdate"
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
    post:
      operationId: createClient
      tags: [accounts]
      summary: Create a machine client of the operator
      description: |
        A client-credentials client with operator scopes, for an `active`
        operator. The secret is in this answer only; it is stored as an
        argon2id hash. The creation is an `events` row, which is the
        operator's notification for now (06 T3).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRequest"
      responses:
        "201":
          description: The client and its secret, shown once.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSecret"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients/{client_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
      - $ref: "#/components/parameters/ClientID"
    post:
      operationId: rotateClientSecret
      tags: [accounts]
      summary: Rotate a client's secret
      description: |
        A new secret, shown once. The previous one keeps working until
        `previous_valid_until` (`policy.client_secret_overlap_s` from
        now) and never after.
      security:
        - session: []
      responses:
        "200":
          description: The new secret.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSecret"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients/{client_id}/serials:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
      - $ref: "#/components/parameters/ClientID"
    post:
      operationId: bindSerial
      tags: [accounts]
      summary: Bind a UAS serial number to a client
      description: |
        A client sends telemetry only for its bound serials (06 T3). The
        serial is validated by uspace-core `serial.ValidateForClass` with
        `class_label` and compared by `serial.FoldKey`; a serial bound to
        another client is refused (409). The binding is projected to KV `client_bindings`
        in the same transaction; when the projection cannot take it,
        nothing changes (503).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialBindingRequest"
      responses:
        "201":
          description: The binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialBinding"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/accounts/operators/{operator_id}/clients/{client_id}/serials/{serial}:
    parameters:
      - $ref: "#/components/parameters/OperatorID"
      - $ref: "#/components/parameters/ClientID"
      - name: serial
        in: path
        required: true
        schema: {type: string, maxLength: 64}
    delete:
      operationId: unbindSerial
      tags: [accounts]
      summary: Unbind a serial from a client
      security:
        - session: []
      responses:
        "204":
          description: The serial is no longer bound to the client.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 machine token issued by this USSP (POST /oauth/token,
        client credentials) to an operator client; aud is this host.
    ecosystemToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 machine token of an allow-listed ecosystem issuer (the
        authority's token service; the lab issuer in the lab) presented
        by the authority, the ANSP or a peer; aud is this host (M18).
    session:
      type: apiKey
      in: cookie
      name: uspace_session
      description: |
        Portal or console session: a JWT with scope "session", roles and
        realm, in the uspace_session cookie; state-changing requests also
        send the uspace_csrf cookie's value as X-CSRF-Token (M20, M21).

  parameters:
    OperatorID:
      name: operator_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClientID:
      name: client_id
      in: path
      required: true
      schema: {type: string, maxLength: 64}

  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    OAuthError:
      description: A refused token request (RFC 6749 §5.2 inside a problem).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OAuthProblem"

  schemas:
    Problem:
      type: object
      description: |
        The ecosystem-wide error body (RFC 9457), the shape of
        uspace-lab schemas/common/problem/v1, mirrored here until that
        schema is published (reconciliation M28).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          pattern: "^https://schemas\\.uspace\\.ge/problems/[a-z][a-z0-9_]*$"
          description: https://schemas.uspace.ge/problems/<slug>, the slug being the counter or refusal name.
          examples: ["https://schemas.uspace.ge/problems/not_found"]
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: The request path.
        errors:
          type: array
          description: Field problems, at most 100; truncated says when more existed.
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldProblem"
        truncated:
          type: boolean
    FieldProblem:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: The JSON path or parameter name at fault.
        reason:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      required: [status, checked_at, dependencies, degraded]
      properties:
        status:
          type: string
          enum: [ready, degraded, not_ready]
          description: not_ready while a required dependency is down or unknown; degraded while any dependency is not up.
        checked_at:
          type: string
          format: date-time
        dependencies:
          type: object
          description: Every dependency of the process, by name (postgres, timescaledb, nats).
          additionalProperties:
            $ref: "#/components/schemas/Dependency"
        degraded:
          type: array
          description: The names of the dependencies that are not up, sorted.
          items:
            type: string
    Dependency:
      type: object
      required: [state, required, since]
      properties:
        state:
          type: string
          enum: [up, degraded, down, unknown]
        required:
          type: boolean
          description: Whether the process is not ready while this dependency is down or unknown.
        since:
          type: string
          format: date-time
          description: When the dependency entered its current state.
        age_s:
          type: number
          format: double
          minimum: 0
          description: Seconds since the dependency was last seen up; 0 while it is up, absent when it never was.
        detail:
          type: string
          description: Why the dependency is not up; absent while it is.

    OAuthProblem:
      description: |
        A problem (M28) that also carries the RFC 6749 §5.2 members, so an
        OAuth2 client library reads `error` and a uspace client reads the
        problem.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [invalid_request, invalid_client, invalid_scope, invalid_target, unauthorized_client, unsupported_grant_type, temporarily_unavailable]
            error_description:
              type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          maxLength: 64
        client_secret:
          type: string
          maxLength: 256
        scope:
          type: string
          description: Space-separated operator scopes.
        audience:
          type: string
          description: When given, this USSP's host (M18).
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string}
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          maximum: 3600
          description: Seconds until exp.
        scope:
          type: string
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true

    Realm:
      type: string
      enum: [portal, console]
      description: portal for operator users, console for staff (M20).
    LoginRequest:
      type: object
      required: [realm, username, password]
      properties:
        realm:
          $ref: "#/components/schemas/Realm"
        username:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
        totp_code:
          type: string
          description: Six digits; required for a staff admin.
          maxLength: 16
    Session:
      type: object
      required: [token, csrf_token, account_id, realm, roles, expires_at, idle_expires_at]
      properties:
        token:
          type: string
          description: The session JWT, also set as the uspace_session cookie; the BFF carries it as a bearer.
        csrf_token:
          type: string
          description: The uspace_csrf value, sent as X-CSRF-Token with a cookie-authenticated request.
        account_id:
          type: string
        realm:
          $ref: "#/components/schemas/Realm"
        roles:
          type: array
          items: {type: string}
        operator_id:
          type: string
          description: The operator of a portal account.
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
    Me:
      type: object
      required: [account_id, username, realm, roles, session_expires_at]
      properties:
        account_id: {type: string}
        username: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        roles:
          type: array
          items: {type: string}
        operator_id: {type: string}
        session_expires_at:
          type: string
          format: date-time

    OperatorStatus:
      type: string
      enum: [pending_validation, active, refused]
    OperatorRegistration:
      type: object
      required: [registration_number, display_name, contact_email, admin_username, admin_password]
      properties:
        registration_number:
          type: string
          maxLength: 32
          description: The operator registration number the authority issued.
        display_name:
          type: string
          maxLength: 200
        contact_email:
          type: string
          maxLength: 254
        admin_username:
          type: string
          maxLength: 64
        admin_password:
          type: string
          maxLength: 1024
    OperatorUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 200
        contact_email:
          type: string
          maxLength: 254
    Operator:
      type: object
      required: [id, registration_number, display_name, contact_email, status, created_at]
      properties:
        id: {type: string}
        registration_number: {type: string}
        display_name: {type: string}
        contact_email: {type: string}
        status:
          $ref: "#/components/schemas/OperatorStatus"
        validation_status:
          type: string
          description: The registry's last answer (valid, unknown, or the refusal).
        validated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    OperatorScope:
      type: string
      enum: [ussp.intents, ussp.telemetry, ussp.traffic, ussp.geo]
    ClientRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/OperatorScope"
    ClientSecret:
      type: object
      required: [client_id, client_secret, scopes, status]
      properties:
        client_id: {type: string}
        client_secret:
          type: string
          description: Shown once; never stored in clear and never retrievable again.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/OperatorScope"
        status: {type: string}
        previous_valid_until:
          type: string
          format: date-time
          description: Set by a rotation; the previous secret works until then.
    SerialBindingRequest:
      type: object
      required: [serial]
      properties:
        serial:
          type: string
          maxLength: 64
          description: The UAS serial number (ANSI/CTA-2063-A).
        class_label:
          type: string
          enum: [C0, C1, C2, C3, C4, C5, C6]
          description: |
            The aircraft's class (2019/945). C1, C2, C3, C5 and C6 need a
            valid CTA-2063-A serial; C0, C4 and an unlabelled aircraft (no
            class_label) only a serial that is not empty (LESSONS G-06).
    SerialBinding:
      type: object
      required: [client_id, serial, serial_fold, bound_at]
      properties:
        client_id: {type: string}
        serial: {type: string}
        serial_fold:
          type: string
          description: uspace-core serial.FoldKey of the serial.
        bound_at:
          type: string
          format: date-time
