# oapi-codegen configuration for internal/national/gen: the net/http
# server interface (Go 1.22 routing) and the models, from
# api/openapi.yaml. No strict server: handlers write their own bodies
# (cookies, RFC 6749 errors) through internal/httpx. Run through
# `make generate`; never edit the generated file.
package: gen
generate:
  std-http-server: true
  strict-server: false
  models: true
  embedded-spec: false
output-options:
  skip-prune: true
