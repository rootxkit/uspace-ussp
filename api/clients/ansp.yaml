  schemas:
    ULID:
      type: string
      description: Crockford base32, 26 characters (04 §2).
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    AdapterSlug:
      type: string
      description: An adapter instance slug.
      pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
      maxLength: 64
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC with Z, millisecond precision (02 §1).
    Role:
      type: string
      description: A console role (01 §4).
      enum: [watch_supervisor, viewer, admin]
    ChangedBy:
      type: string
      description: |
        Who made a restriction change: the console role of the person, or
        system for the ticker's scheduled activation at starts_at and its
        expiry at ends_at (never a name).
      enum: [watch_supervisor, viewer, admin, system]

    Problem:
      type: object
      description: |
        The ecosystem's one error body (RFC 9457, M28), the shape of
        uspace-lab schemas/common/problem/v1 (pinned under
        schemas/common/problem/v1/). errors is capped at 100 with
        truncated set when more existed.
      required: [type, title, status, errors]
      properties:
        type:
          type: string
          description: https://schemas.uspace.ge/problems/<slug>, the slug the counter or refusal name.
          pattern: "^https://schemas\\.uspace\\.ge/problems/[a-z_]+$"
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, "null"]
        instance:
          type: [string, "null"]
          description: The request path.
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldProblem"
        truncated:
          type: boolean
    FieldProblem:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: The JSON path (as core.FieldError writes it), or the parameter or header name.
        reason:
          type: string
          minLength: 1

    VerticalRef:
      type: string
      description: |
        The vertical reference of a restriction limit: AMSL or WGS84
        (ellipsoid). AGL is refused for a dynamic restriction in this
        release (D3, §15 gap 3) with the reason "AGL is not supported for
        a dynamic restriction in this release".
      enum: [AMSL, WGS84]
    ZoneType:
      type: string
      description: The ED-318 zone type of a restriction (D4); the default is the policy's default_zone_type.
      enum: [PROHIBITED, REQ_AUTHORIZATION]
    RestrictionState:
      type: string
      description: planned, active, ended or cancelled (02 F2, ATS.TR.237(b)).
      enum: [planned, active, ended, cancelled]
    LngLat:
      type: array
      description: A GeoJSON position [lng, lat] in WGS84 degrees (SRID 4326).
      minItems: 2
      maxItems: 2
      items:
        type: number
    GeoJSONPolygon:
      type: object
      description: A GeoJSON Polygon (RFC 7946) in WGS84 (SRID 4326), positions [lng, lat], exterior ring first, rings closed.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: array
            minItems: 4
            maxItems: 1000
            items:
              $ref: "#/components/schemas/LngLat"
    GeoJSONPoint:
      type: object
      description: A GeoJSON Point (RFC 7946) in WGS84 (SRID 4326), [lng, lat]; the centre of a circle of radius_m.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          $ref: "#/components/schemas/LngLat"
    RestrictionGeometry:
      description: The area of a restriction, a Polygon, or a Point with radius_m (a circle).
      oneOf:
        - $ref: "#/components/schemas/GeoJSONPolygon"
        - $ref: "#/components/schemas/GeoJSONPoint"
    RestrictionArea:
      type: object
      description: The area, limits and window of a restriction (or of a request for one).
      required: [geometry, lower_m, lower_ref, upper_m, upper_ref, starts_at, ends_at, reason_text]
      properties:
        uspace_airspace_id:
          type: string
          description: The ED-318 identifier of the current USPACE feature of the CIS the restriction lies in (M9).
          minLength: 1
          maxLength: 7
        geometry:
          $ref: "#/components/schemas/RestrictionGeometry"
        radius_m:
          type: [number, "null"]
          description: The circle's radius in metres; required with a Point, absent or null with a Polygon.
          exclusiveMinimum: 0
        lower_m:
          type: number
          description: The lower limit in metres above lower_ref.
        lower_ref:
          $ref: "#/components/schemas/VerticalRef"
        upper_m:
          type: number
          description: The upper limit in metres above upper_ref; above lower_m.
        upper_ref:
          $ref: "#/components/schemas/VerticalRef"
        starts_at:
          $ref: "#/components/schemas/Timestamp"
        ends_at:
          $ref: "#/components/schemas/Timestamp"
        reason_text:
          type: string
          description: Why, as the supervisor states it (the N4 record).
          minLength: 1
          maxLength: 500
    RestrictionCreate:
      description: |
        A restriction to plan. A window longer than F3548
        CstrMaxDurationHours is refused 400 chain_required with the
        re-issues it would make in errors[] (chain[i]); sent again with
        confirm_chain true, the chain is planned as linked restrictions
        (supersedes_id) and the answer is the first.
      allOf:
        - $ref: "#/components/schemas/RestrictionArea"
        - type: object
          required: [uspace_airspace_id]
          properties:
            zone_type:
              $ref: "#/components/schemas/ZoneType"
            confirm_chain:
              type: boolean
              description: Plan a window longer than CstrMaxDurationHours as the chain of linked re-issues it was refused with.
    Restriction:
      description: |
        A restriction as the client sees it (docs/PLAN.md §5.1): its
        area, limits and window, its state and versions, who did what
        when, its current ED-318 feature, its F3548 constraint reference
        and its deliveries summary, with the CIS version it was placed
        against and the age of that projection.
      allOf:
        - $ref: "#/components/schemas/RestrictionArea"
        - type: object
          required: [id, ansp_ref, identifier, uspace_airspace_id, zone_type, state, ansp_version, created_by, created_at, dss_constraint_id, feature, deliveries, cis_version, cis_age_s]
          properties:
            id:
              $ref: "#/components/schemas/ULID"
            ansp_ref:
              type: string
              description: The ANSP reference; with ansp_version the idempotency key towards the CISP and the DSS (D5, M4).
            identifier:
              type: string
              description: The ED-318 identifier, DAR plus 4 base-36 characters (D4).
              pattern: "^DAR[0-9A-Z]{4}$"
            zone_type:
              $ref: "#/components/schemas/ZoneType"
            state:
              $ref: "#/components/schemas/RestrictionState"
            ansp_version:
              type: integer
              format: int64
              minimum: 1
              description: Monotonic per restriction, bumped on every change (M4).
            created_by:
              $ref: "#/components/schemas/ChangedBy"
            activated_by:
              $ref: "#/components/schemas/ChangedBy"
            ended_by:
              $ref: "#/components/schemas/ChangedBy"
            cancelled_by:
              $ref: "#/components/schemas/ChangedBy"
            created_at:
              $ref: "#/components/schemas/Timestamp"
            activated_at:
              type: [string, "null"]
              format: date-time
            activate_at:
              type: [string, "null"]
              format: date-time
              description: |
                While a planned restriction waits to be activated at its
                starts_at (an activation asked for before then): the
                instant the ticker activates it, on the database's clock.
            ended_at_actual:
              type: [string, "null"]
              format: date-time
            request_id:
              type: [string, "null"]
              description: The restriction request it came from (F11).
            published_version:
              type: [integer, "null"]
              format: int64
              description: The ansp_version the CISP confirmed.
            supersedes_id:
              type: [string, "null"]
              description: The restriction this re-issue continues (longer than CstrMaxDurationHours).
            dss_constraint_id:
              type: string
              format: uuid
              description: The F3548 entity id, minted here.
            dss_version:
              type: [integer, "null"]
              format: int32
            feature:
              $ref: "#/components/schemas/Ed318Feature"
            constraint_reference:
              description: The F3548 reference as the DSS last accepted it (its ovn included; this system is the manager); null before the first DSS write.
              oneOf:
                - $ref: "#/components/schemas/ConstraintReference"
                - type: "null"
            dss:
              $ref: "#/components/schemas/DssStatus"
            deliveries:
              $ref: "#/components/schemas/DeliveriesSummary"
            cis_version:
              type: [string, "null"]
              description: The CIS version of the projection; null before the first pull.
            cis_age_s:
              type: [number, "null"]
              minimum: 0
              description: Age of the CIS projection in seconds; null before the first pull.
    RestrictionList:
      type: object
      required: [restrictions, cis_version, cis_age_s]
      properties:
        restrictions:
          type: array
          items:
            $ref: "#/components/schemas/Restriction"
        truncated:
          type: boolean
        cis_version:
          type: [string, "null"]
        cis_age_s:
          type: [number, "null"]
          minimum: 0
    DeliveryChannel:
      type: object
      description: The outbox state of one channel (D5).
      required: [state, attempts]
      properties:
        state:
          type: string
          enum: [none, queued, sent, failed, abandoned]
        attempts:
          type: integer
          minimum: 0
        last_attempt_at:
          $ref: "#/components/schemas/Timestamp"
        last_status_code:
          type: integer
        next_retry_at:
          $ref: "#/components/schemas/Timestamp"
    DeliveriesSummary:
      type: object
      description: |
        The deliveries of the current version: the CISP publication (the
        regulatory channel), the DSS write, the subscriber notifications
        and the degraded direct path (02 F2, D6).
      required: [cisp, dss, uss_notify, direct_degraded]
      properties:
        cisp:
          $ref: "#/components/schemas/DeliveryChannel"
        dss:
          $ref: "#/components/schemas/DeliveryChannel"
        uss_notify:
          $ref: "#/components/schemas/DeliveryChannel"
        direct_degraded:
          $ref: "#/components/schemas/DeliveryChannel"
    RestrictionVersion:
      type: object
      required: [restriction_id, version, state, feature, changed_by, changed_at, change_reason]
      properties:
        restriction_id:
          $ref: "#/components/schemas/ULID"
        version:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/RestrictionState"
        feature:
          $ref: "#/components/schemas/Ed318Feature"
        constraint:
          description: The F3548 Constraint as written to the DSS for this version, when it was.
          oneOf:
            - $ref: "#/components/schemas/Constraint"
            - type: "null"
        changed_by:
          $ref: "#/components/schemas/ChangedBy"
        changed_at:
          $ref: "#/components/schemas/Timestamp"
        change_reason:
          type: string
    RestrictionVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/RestrictionVersion"
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ExtendRequest:
      type: object
      required: [ends_at, reason]
      properties:
        ends_at:
          $ref: "#/components/schemas/Timestamp"
        reason:
          type: string
          minLength: 1
          maxLength: 500

    Ed318Text:
      type: object
      description: ED-318 textShortType.
      required: [lang]
      properties:
        text:
          type: string
          maxLength: 200
        lang:
          type: string
          maxLength: 5
    Ed318Feature:
      type: object
      description: |
        The ED-318 Feature of a restriction as published to the CISP: a
        GeoJSON Feature whose properties are a UASZone, with reason
        [DAR], variant COMMON, identifier DAR plus 4 base-36 characters
        and the window in limitedApplicability (02 F2, D4). Member names
        mirror uspace-core/ed318 (model.go), which reads and writes them;
        this schema names the members a client relies on and leaves the
        rest open. From uspace-core/ed318 doc.go: UNVERIFIED: the names
        of a zone's vertical limits (the geometry's layer object with
        upper, upperReference, lower, lowerReference and uom, as the
        ED-318 JSON schema and uas_standards show them); UNVERIFIED: an
        absent uom means metres; UNVERIFIED: the unit of a circle's
        radius (always metres, owner decision on uspace-core PR #16).
        The EUROCAE ED-318 text is not available to the project (spec 09
        §3).
      required: [type, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
        geometry:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [Polygon, Point, GeometryCollection]
            coordinates:
              type: array
              items: {}
            extent:
              type: object
              properties:
                subType:
                  type: string
                radius:
                  type: number
            layer:
              type: object
              properties:
                upper:
                  type: number
                upperReference:
                  type: string
                  enum: [AGL, AMSL, WGS84]
                lower:
                  type: number
                lowerReference:
                  type: string
                  enum: [AGL, AMSL, WGS84]
                uom:
                  type: string
                  enum: [m, ft]
        properties:
          type: object
          required: [identifier, country, type, variant]
          properties:
            identifier:
              type: string
              maxLength: 7
            country:
              type: string
              pattern: "^[A-Z]{3}$"
            name:
              type: array
              items:
                $ref: "#/components/schemas/Ed318Text"
            type:
              type: string
              enum: [COMMON, CUSTOMIZED, PROHIBITED, REQ_AUTHORIZATION, CONDITIONAL, NO_RESTRICTION]
            variant:
              type: string
            reason:
              type: array
              items:
                type: string
            message:
              type: array
              items:
                $ref: "#/components/schemas/Ed318Text"
            extendedProperties:
              type: object
            limitedApplicability:
              type: array
              items:
                type: object
                properties:
                  startDateTime:
                    type: string
                    format: date-time
                  endDateTime:
                    type: string
                    format: date-time
            zoneAuthority:
              type: array
              items:
                type: object
                required: [purpose]
                properties:
                  name:
                    type: array
                    items:
