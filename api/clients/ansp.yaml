    EnvelopeHeader:
      type: object
      description: |
        The 04 §2 envelope fields of every frame and every catalogued
        message, as uspace-lab schemas/common/envelope/v1 defines them
        (pinned under schemas/common/envelope/v1/); schema and body are
        added by each message.
      required: [msg_id, producer, rx_ts, captured_at, time_source, backlog]
      properties:
        msg_id:
          $ref: "#/components/schemas/ULID"
        producer:
          type: string
          pattern: "^(authority|cisp|ussp|ansp|lab)(/[a-z][a-z0-9]*(-[a-z][a-z0-9]*)*|-[0-9]+/[a-z][a-z0-9]*(-[a-z][a-z0-9]*)*-[0-9]+)$"
        ts:
          type: [string, "null"]
          format: date-time
          description: Capture time on the source's clock; null when the record carried none.
        rx_ts:
          $ref: "#/components/schemas/Timestamp"
        captured_at:
          $ref: "#/components/schemas/Timestamp"
        time_source:
          type: string
          enum: [source_clock, broadcast, receiver, provider, system]
        backlog:
          type: boolean
    MannedTrack:
      type: object
      description: |
        The body of track/manned/v1 (04 §3.1, schemas/track/manned/v1.json
        owned here): one manned aircraft as handed to U-space under
        ATS.OR.127(a). alt_pressure_m is pressure altitude (ISA 1013.25
        hPa), never AMSL; alt_wgs84_m is geometric height above the
        ellipsoid when known. state is live, or stale (no sample within
        stale_after_s) or source_disabled (its adapter was switched off)
        as the aircraft ages out, never dropped silently.
      required: [icao24, position, alt_pressure_m, alt_wgs84_m, gs_ms, track_deg, vrate_ms, source_class, trust, source, source_instance, state]
      properties:
        icao24:
          type: string
          description: ICAO 24-bit address, lower-case hex.
          pattern: "^[0-9a-f]{6}$"
        callsign:
          type: [string, "null"]
          maxLength: 8
        position:
          type: object
          description: WGS84 decimal degrees.
          required: [lat, lng]
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
        alt_pressure_m:
          type: [number, "null"]
        alt_wgs84_m:
          type: [number, "null"]
        gs_ms:
          type: [number, "null"]
          minimum: 0
        track_deg:
          type: [number, "null"]
          minimum: 0
          exclusiveMaximum: 360
        vrate_ms:
          type: [number, "null"]
        emergency:
          type: [boolean, "null"]
        spi:
          type: [boolean, "null"]
        squawk:
          type: [string, "null"]
          pattern: "^[0-7]{4}$"
        source_class:
          $ref: "#/components/schemas/SourceClass"
        quality:
          type: object
          description: NIC/NACp or the adapter's quality block as received.
        trust:
          type: string
          enum: [surveillance]
        source:
          type: string
          enum: [ansp_feed]
        source_instance:
          $ref: "#/components/schemas/AdapterSlug"
        state:
          type: string
          enum: [live, stale, source_disabled]
        relevant:
          type: boolean
          description: Inside a U-space volume plus the policy margin at capture.
        policy_version:
          type: string
        age_s:
          type: number
          minimum: 0
          description: Seconds since captured_at when manned-feed wrote the frame (B-13); absent on the adapter's internal subject.
    MannedTrackMessage:
      description: A track/manned/v1 frame or NATS message (04 §2 envelope with a MannedTrack body).
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [schema, body]
          properties:
            schema:
              type: string
              enum: [track/manned/v1]
            body:
              $ref: "#/components/schemas/MannedTrack"
    RestrictionStateBody:
      type: object
      description: |
        The body of restriction/state/v1 (04 §3.4, schemas/restriction/state/v1.json
        owned here): a restriction's state change, with the deliveries of
        its current version when the change is a delivery outcome.
      required: [restriction_id, ansp_ref, state, starts_at, ends_at, ansp_version, feature]
      properties:
        restriction_id:
          $ref: "#/components/schemas/ULID"
        ansp_ref:
          type: string
        state:
          $ref: "#/components/schemas/RestrictionState"
        starts_at:
          $ref: "#/components/schemas/Timestamp"
        ends_at:
          $ref: "#/components/schemas/Timestamp"
        ansp_version:
          type: integer
          format: int64
          minimum: 1
        feature:
          $ref: "#/components/schemas/Ed318Feature"
        deliveries:
          $ref: "#/components/schemas/DeliveriesSummary"
        published:
          type: boolean
          description: On a delivery outcome, whether the CISP holds the current version (WP-8).
        alarm:
          $ref: "#/components/schemas/DeliveryAlarm"
        dss:
          $ref: "#/components/schemas/DssStatus"
    DssStatus:
      type: object
      description: |
        A restriction's standing in the DSS (WP-9, 02 F2, 02 F6): none
        (never written: planned or cancelled), pending since T while a
        DSS write of it is queued (a DSS outage never holds the CISP
        publication, D6), written, deleted, or failed since T (the DSS
        refused it; a delivery alarm says why). ansp_version is the
        version the DSS last accepted a put of, dss_version the DSS's
        version of the reference.
      required: [state]
      properties:
        state:
          type: string
          enum: [none, pending, written, deleted, failed]
        since:
          $ref: "#/components/schemas/Timestamp"
        ansp_version:
          type: integer
          format: int64
          minimum: 1
        dss_version:
          type: integer
          format: int64
          minimum: 0
    DeliveryAlarm:
      type: object
      description: |
        An alarm of the outbox (WP-8, 02 F2 failure rule): the alarm member
        of a restriction/state/v1 body and an item of GET
        /v1/delivery-alarms. state is open, acknowledged (an open
        cisp_not_published or uss_notify_late a person has seen) or
        cleared; duration_s is cleared_at minus since. uss_notify_late
        (WP-9) is a subscriber notification the DSS named not delivered
        within CstrPublishedNotificationLatencySeconds of the DSS's
        answer; it clears when the notification is delivered, superseded
        or given up. occurrence_undelivered (WP-10) is an occurrence report
        not delivered to the authority 60 h after its reporter became aware
        (12 h before the 72 h of 376/2014 Art. 4(8)); a person's
        acknowledgement leaves it open until the delivery is sent. The
        text never says "lost" (C-12).
      required: [id, kind, state, since, raised_at, detail]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        kind:
          type: string
          enum: [cisp_not_published, delivery_failed, delivery_abandoned, uss_notify_late, occurrence_undelivered]
        state:
          type: string
          enum: [open, acknowledged, cleared]
        restriction_id:
          $ref: "#/components/schemas/ULID"
        ansp_version:
          type: integer
          format: int64
          minimum: 1
        delivery_id:
          $ref: "#/components/schemas/ULID"
        since:
          $ref: "#/components/schemas/Timestamp"
        raised_at:
          $ref: "#/components/schemas/Timestamp"
        detail:
          type: string
          maxLength: 1024
        cleared_at:
          $ref: "#/components/schemas/Timestamp"
        clear_reason:
          type: string
          description: published, restriction_not_active or acknowledged; for uss_notify_late delivered, superseded, delivery_failed or delivery_abandoned; for occurrence_undelivered delivered.
        duration_s:
          type: number
          minimum: 0
        acknowledged_by:
          $ref: "#/components/schemas/Role"
        acknowledged_at:
          $ref: "#/components/schemas/Timestamp"
        ack_reason:
          type: string
          maxLength: 1000
    DeliveryAlarmList:
      type: object
      required: [alarms]
      properties:
        alarms:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAlarm"
        truncated:
          type: boolean
    AlarmAcknowledgeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    RestrictionStateMessage:
      description: A restriction/state/v1 frame or NATS message.
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [schema, body]
          properties:
            schema:
              type: string
              enum: [restriction/state/v1]
            body:
              $ref: "#/components/schemas/RestrictionStateBody"
    CoordinationNoticeMessage:
      description: |
        A coordination/notice/v1 frame of the console stream and of
        coord.v1: the body is the inbox item (CoordinationNotice), not the
        USSP's coordination/annex_v/v1 request body, which it carries as
        payload (docs/PLAN.md section 15 row 24).
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [schema, body]
          properties:
            schema:
              type: string
              enum: [coordination/notice/v1]
            body:
              $ref: "#/components/schemas/CoordinationNotice"
    SourceStatusBody:
      type: object
      description: The body of source/status/v1 (uspace-lab schemas/common, pinned under schemas/common/source/status/v1/).
      required: [source, source_instance, state, since, age_s, disabled_by, counters]
      properties:
        source:
          type: string
          enum: [operator_ws, network_rid, direct_rid, ansp_feed, adsb_rx, sitl]
        source_instance:
          type: [string, "null"]
        state:
          type: string
          enum: [live, stale, disabled, down, unknown]
        since:
          $ref: "#/components/schemas/Timestamp"
        age_s:
          type: [number, "null"]
          minimum: 0
        disabled_by:
          type: [string, "null"]
          enum: [type, instance, default_deny, null]
        disabled_by_who:
          type: [string, "null"]
        counters:
          type: object
          required: [accepted, refused]
          properties:
            accepted:
              type: integer
              minimum: 0
            refused:
              type: integer
              minimum: 0
          additionalProperties:
            type: integer
            minimum: 0
    AdapterState:
      type: object
      description: This system's extra of console/status/v1 and of the snapshot, one per adapter.
      required: [id, state, enabled]
      properties:
        id:
          $ref: "#/components/schemas/AdapterSlug"
        state:
          type: string
          enum: [live, stale, disabled, down, unknown]
        enabled:
          type: boolean
        last_frame_at:
          type: [string, "null"]
          format: date-time
        age_s:
          type: [number, "null"]
          minimum: 0
    ConsoleStatus:
      type: object
      description: |
        The body of console/status/v1 (uspace-lab schemas/common, pinned
        under schemas/common/console/status/v1/), with this system's
        extras adapters[], cis_version, cis_age_s and nats (M29).
      required: [connection_id, server_ts, policy_version, stale_after_s, live_max_age_s, dropped_frames, degraded, sources]
      properties:
        connection_id:
          type: string
          minLength: 1
        server_ts:
          $ref: "#/components/schemas/Timestamp"
        policy_version:
          type: string
          minLength: 1
        stale_after_s:
          type: number
          exclusiveMinimum: 0
        live_max_age_s:
          type: number
          exclusiveMinimum: 0
        dropped_frames:
          type: integer
          minimum: 0
        degraded:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatusBody"
        adapters:
          type: array
          items:
            $ref: "#/components/schemas/AdapterState"
        cis_version:
          type: string
          minLength: 1
        cis_age_s:
          type: number
          minimum: 0
        nats:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
    ConsoleStatusMessage:
      description: A console/status/v1 frame.
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [schema, body]
          properties:
            schema:
              type: string
              enum: [console/status/v1]
            body:
              $ref: "#/components/schemas/ConsoleStatus"
    ConsoleSnapshot:
      type: object
      description: |
        The body of console/snapshot/v1 (uspace-lab schemas/common, pinned
        under schemas/common/console/snapshot/v1/): tracks and alerts are
        always empty here (this system carries no UAS), manned holds the
        track/manned/v1 messages; restrictions and notices are this
        system's extras for its console streams.
      required: [tracks, alerts, manned, zones_version]
      properties:
        tracks:
          type: array
          maxItems: 0
          items:
            type: object
        alerts:
          type: array
          maxItems: 0
          items:
            type: object
        manned:
          type: array
          items:
            $ref: "#/components/schemas/MannedTrackMessage"
        zones_version:
          type: [string, "null"]
        restrictions:
          type: array
          items:
            $ref: "#/components/schemas/RestrictionStateMessage"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/CoordinationNoticeMessage"
    ConsoleSnapshotMessage:
      description: A console/snapshot/v1 frame.
      allOf:
        - $ref: "#/components/schemas/EnvelopeHeader"
        - type: object
          required: [schema, body]
          properties:
            schema:
              type: string
              enum: [console/snapshot/v1]
            body:
              $ref: "#/components/schemas/ConsoleSnapshot"
    ConsoleSubscribeFrame:
      type: object
      description: |
        The one client-to-server frame, console/subscribe/v1 (uspace-lab
        schemas/common, pinned under schemas/common/console/subscribe/v1/):
        sent on open and whenever the viewport changes; the server
        answers with a console/snapshot/v1. Named by x-client-frame on
        each WebSocket operation.
      required: [schema, body]
      properties:
        schema:
          type: string
          enum: [console/subscribe/v1]
        msg_id:
          $ref: "#/components/schemas/ULID"
        body:
          type: object
          required: [bbox, layers]
          properties:
            bbox:
              type: array
              description: "[west, south, east, north] in WGS84 degrees; west > east crosses the antimeridian."
              minItems: 4
              maxItems: 4
              items:
                type: number
            layers:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [tracks, manned, alerts, zones]
    MannedSnapshot:
      description: |
        The bootstrap of the manned picture: the console/snapshot/v1 body
        plus what is degraded, every adapter's state, the CIS version the
        relevance filter used and its age, and the policy_version.
      allOf:
        - $ref: "#/components/schemas/ConsoleSnapshot"
        - type: object
          required: [degraded, adapters, cis_version, cis_age_s, policy_version]
          properties:
            degraded:
              type: array
              uniqueItems: true
              items:
                type: string
                pattern: "^[a-z][a-z0-9_]*$"
            adapters:
              type: array
              items:
                $ref: "#/components/schemas/AdapterState"
            cis_version:
              type: [string, "null"]
            cis_age_s:
              type: [number, "null"]
              minimum: 0
            policy_version:
              type: string
    MannedStreamFrame:
      description: One server frame of GET /v1/manned-traffic/stream, dispatched on schema.
      oneOf:
        - $ref: "#/components/schemas/MannedTrackMessage"
        - $ref: "#/components/schemas/ConsoleStatusMessage"
        - $ref: "#/components/schemas/ConsoleSnapshotMessage"
      discriminator:
        propertyName: schema
        mapping:
          track/manned/v1: "#/components/schemas/MannedTrackMessage"
          console/status/v1: "#/components/schemas/ConsoleStatusMessage"
          console/snapshot/v1: "#/components/schemas/ConsoleSnapshotMessage"
    RestrictionStreamFrame:
      description: One server frame of GET /v1/restrictions/stream, dispatched on schema.
      oneOf:
        - $ref: "#/components/schemas/RestrictionStateMessage"
        - $ref: "#/components/schemas/ConsoleStatusMessage"
        - $ref: "#/components/schemas/ConsoleSnapshotMessage"
      discriminator:
        propertyName: schema
        mapping:
          restriction/state/v1: "#/components/schemas/RestrictionStateMessage"
          console/status/v1: "#/components/schemas/ConsoleStatusMessage"
          console/snapshot/v1: "#/components/schemas/ConsoleSnapshotMessage"
    CoordinationStreamFrame:
      description: One server frame of GET /v1/coordination/stream, dispatched on schema.
      oneOf:
        - $ref: "#/components/schemas/CoordinationNoticeMessage"
        - $ref: "#/components/schemas/ConsoleStatusMessage"
        - $ref: "#/components/schemas/ConsoleSnapshotMessage"
      discriminator:
        propertyName: schema
        mapping:
          coordination/notice/v1: "#/components/schemas/CoordinationNoticeMessage"
          console/status/v1: "#/components/schemas/ConsoleStatusMessage"
          console/snapshot/v1: "#/components/schemas/ConsoleSnapshotMessage"

paths:
  /v1/restrictions:
    post:
      operationId: createRestriction
      tags: [restrictions]
      summary: Plan a restriction
      x-process: api
      x-spec: 02 §3 ansp, 02 F2, 01 N1
      x-auth: session:watch_supervisor
      description: |
        Plans a dynamic restriction (state planned) inside a designated
        U-space airspace (2021/665 ATS.TR.237(a); 2021/664 Art. 4). The
        restriction must intersect a current USPACE feature of the CIS
        projection and name it in uspace_airspace_id (M9); with a stale
        projection the answer is 503 cis_stale. The window and the area
        are checked against the F3548 constraint limits of uspace-core
        (CstrMaxDurationHours, CstrMaxPlanningHorizonDays, CstrMaxAreaKm2,
        CstrMaxVertices). Vertical limits are in AMSL or WGS84; AGL is
        refused with "lower_ref: AGL is not supported for a dynamic
        restriction in this release" (D3). Idempotency-Key is the
        client's reference: a repeat with the same key and body answers
        200 with the restriction first created; with another body, 409.
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestrictionCreate"
            example:
              uspace_airspace_id: GEOTU01
              zone_type: PROHIBITED
              geometry:
                type: Polygon
                coordinates: [[[44.78, 41.70], [44.82, 41.70], [44.82, 41.73], [44.78, 41.73], [44.78, 41.70]]]
              lower_m: 0
              lower_ref: AMSL
              upper_m: 1200
              upper_ref: AMSL
              starts_at: "2026-10-02T12:00:00.000Z"
              ends_at: "2026-10-02T16:00:00.000Z"
              reason_text: Search and rescue operation (synthetic example)
      responses:
        "201":
          description: Planned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restriction"
              example: *RestrictionPlanned
        "200":
          description: A repeat of an earlier request with the same Idempotency-Key and body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restriction"
              example: *RestrictionPlanned
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listRestrictions
      tags: [restrictions]
      summary: List restrictions
      x-process: api
      x-spec: 02 §3 ansp
      x-auth: token:ansp.coordination or session
      description: |
        The restrictions with their states and delivery status
        (ATS.TR.237(b)), newest first, filtered by state, by the instant
        at which they apply and by a bounding box. Answers carry the CIS
        version the restrictions were placed against and its age.
      security:
        - consoleSession: []
        - ecosystemToken: [ansp.coordination]
      parameters:
        - name: state
          in: query
          required: false
          description: Only restrictions in this state.
          schema:
            $ref: "#/components/schemas/RestrictionState"
          example: active
        - name: at
          in: query
          required: false
          description: Only restrictions whose window contains this instant.
          schema:
            type: string
            format: date-time
          example: "2026-10-02T13:00:00.000Z"
        - $ref: "#/components/parameters/BBox"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The restrictions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionList"
              example:
                restrictions:
                  - *RestrictionActive
                cis_version: "42"
                cis_age_s: 12.5
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/restrictions/stream:
    get:
      operationId: streamRestrictions
      tags: [restrictions]
      summary: Restriction state changes for the console (WebSocket)
      x-process: api
      x-spec: 02 §3 ansp (console), 04 §3.4
      x-auth: session
      x-websocket: true
      description: |
        A WebSocket upgrade for the dispatcher console. The browser
        authenticates with the uspace_session cookie on a same-origin
        upgrade whose Origin is on ANSP_WS_ALLOWED_ORIGINS (M22); a
        machine client sends a bearer. There is no ticket. Frames: a
        console/snapshot/v1 on connect and on every console/subscribe/v1
        the client sends, restriction/state/v1 for every state change
        and delivery outcome (ATS.TR.237(b)), and console/status/v1 on
        connect and every 2 s. A session that ends while connected is
        closed with code 4401 (re-login). A plain GET is 426.
      security:
        - consoleSession: []
        - sessionCookie: []
      x-client-frame: "#/components/schemas/ConsoleSubscribeFrame"
      responses:
        "101":
          description: Switched to the WebSocket protocol; every server message is one RestrictionStreamFrame.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionStreamFrame"
              example: *RestrictionStateFrame
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/restrictions/{id}:
    get:
      operationId: getRestriction
      tags: [restrictions]
      summary: One restriction
      x-process: api
      x-spec: 02 §3 ansp
      x-auth: token:ansp.coordination or session
      description: |
        The restriction, its current ED-318 feature, its F3548 constraint
        reference and its deliveries summary (ATS.TR.237(b)). This is
        also the pull_url of a degraded direct delivery (02 F2 failure
        rule, M5).
      security:
        - consoleSession: []
        - ecosystemToken: [ansp.coordination]
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
      responses:
        "200":
          description: The restriction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restriction"
              example: *RestrictionActive
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/restrictions/{id}/versions:
    get:
      operationId: listRestrictionVersions
      tags: [restrictions]
      summary: Every version of a restriction
      x-process: api
      x-spec: 01 N4, 02 §3 ansp
      x-auth: session
      description: |
        Every version as published, oldest first: who changed it, when
        and why, until when (Annex V(1), the N4 record of every
        reconfiguration).
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionVersionList"
              example:
                versions:
                  - *RestrictionVersion
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/restrictions/{id}/versions/{version}:
    get:
      operationId: getRestrictionVersion
      tags: [restrictions]
      summary: One version of a restriction
      x-process: api
      x-spec: 01 N4, 02 §3 ansp
      x-auth: session
      description: The version as published (Annex V(1)).
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionVersion"
              example: *RestrictionVersion
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/restrictions/{id}/activate:
    post:
      operationId: activateRestriction
      tags: [restrictions]
      summary: Activate a planned restriction
      x-process: api
      x-spec: ATS.TR.237(b) activation
      x-auth: session:watch_supervisor
      description: |
        planned → active, at once or at starts_at when that is in the
        future (2021/665 ATS.TR.237(b): activation). Starts the outbox:
        the CISP publication and the DSS constraint are written in
        parallel (D6), each idempotent on (ansp_ref, ansp_version).
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
            example:
              reason: Rescue helicopter on scene
      responses:
        "200":
          description: Active (or scheduled to activate at starts_at).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restriction"
              example: *RestrictionActive
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/restrictions/{id}/extend:
    post:
      operationId: extendRestriction
      tags: [restrictions]
      summary: Extend a restriction
      x-process: api
      x-spec: ATS.TR.237(b) temporary limitation
      x-auth: session:watch_supervisor
      description: |
        A new ends_at (2021/665 ATS.TR.237(b): temporary limitation).
        Within CstrMaxDurationHours of starts_at the restriction gets a
        new ansp_version; beyond it a re-issue is created and linked by
        supersedes_id, and the answer is that re-issue.
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendRequest"
            example:
              ends_at: "2026-10-02T18:00:00.000Z"
              reason: Operation continues
      responses:
        "200":
          description: Extended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restriction"
              example: *RestrictionActive
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/restrictions/{id}/end:
    post:
      operationId: endRestriction
      tags: [restrictions]
      summary: End an active restriction now
      x-process: api
      x-spec: ATS.TR.237(b) deactivation
      x-auth: session:watch_supervisor
      description: "active → ended now (2021/665 ATS.TR.237(b): deactivation)."
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
            example:
              reason: Rescue completed
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restriction"
              example: *RestrictionEnded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/restrictions/{id}/cancel:
    post:
