openapi: 3.1.0
info:
  title: uspace-ansp national API
  version: 1.0.0
  description: |
    The U-space interface of the air navigation service provider in the
    Georgian U-space system-of-systems (Reg. (EU) 2021/664, 2021/665):
    dynamic airspace reconfiguration (ATS.TR.237), the manned traffic
    information service (ATS.OR.127), the Annex V coordination inbox
    (Art. 13(2)) and the accounts of the dispatcher console.

    This file is the contract (CLAUDE.md rule 7): an endpoint that is
    not in it does not exist; the server interface, the models and the
    Go client in api/gen are generated from it and committed, and CI
    fails on a stale generation. Changes within /v1 are additive only
    (spec 00 §7, 02 §1): new optional fields, new operations, new enum
    values announced one minor ahead; a breaking change is a /v2 served
    in parallel. Inbound bodies leave additionalProperties open: unknown
    members are ignored, never refused (02 §1).

    Conventions (02 §1): every time is RFC 3339 UTC with Z and
    millisecond precision; every geometry is GeoJSON in WGS84 (SRID
    4326) with positions [lng, lat]; every distance is in metres and
    every altitude is a number in metres with its reference in a _ref
    member (AMSL or WGS84; AGL is refused for a dynamic restriction in
    this release, D3). Every error is application/problem+json in the
    one body of the ecosystem (Problem, M28), and every 429 and 503
    carries Retry-After.

    Each operation carries x-process (the process that serves it: api,
    manned-feed, or each for the health endpoints every process serves),
    x-spec (the spec section) and x-auth, the access rule the server
    enforces before any handler runs (internal/auth ParseAccess):
    public; jws:cisp (a compact JWS body verified by the handler);
    session (any console role); session:<role>[|<role>] (a console
    session with one of those roles); token:<scope>[+<scope>] (an
    ecosystem token granting every scope), with +mtls when the client
    certificate is bound (ANSP_MTLS_MODE); alternatives joined by " or ".
    Operations marked x-websocket are WebSocket upgrades: the GET is the
    handshake, 101 its success, and the 101 content is the schema of
    every frame the server sends (the 04 §2 envelope with a body named
    by schema, M29).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: restrictions
    description: Dynamic airspace reconfiguration (ATS.TR.237, 02 F2).
  - name: restriction-requests
    description: Restriction requests from the authority (02 F11).
  - name: coordination
    description: The Annex V inbox of USSP notices (02 F13, Art. 13(2)).
  - name: manned-traffic
    description: The manned traffic information service (ATS.OR.127, 02 F4).
  - name: adapters
    description: The surveillance adapters.
  - name: sources
    description: Source switches (04 §3.6, U-15).
  - name: policy
    description: The thresholds row (INV-03).
  - name: occurrences
    description: Occurrence reports of ANSP staff (376/2014 Art. 4(8)).
  - name: audit
    description: The append-only audit log (01 N4).
  - name: auth
    description: Console sign-in, accounts and the signing keys (06 §3).
  - name: uss
    description: The F3548 USS endpoint of the constraint manager.
  - name: cis
    description: CIS change notifications (02 F3 push).
  - name: health
    description: Liveness, readiness and metrics of each process.

components:
  securitySchemes:
    ecosystemToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An ecosystem RS256 token from the authority's token service (or
        the lab issuer), verified by uspace-core/auth: iss on
        ANSP_TOKEN_ISSUERS, aud a host of ANSP_AUDIENCES (M18), exp with
        30 s skew, the scopes the operation names.
    consoleSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A console session issued by this system at POST /v1/auth/mfa
        (scope session, roles [role], realm console, aud this system's
        host; M20), forwarded by the BFF as a bearer.
    sessionCookie:
      type: apiKey
      in: cookie
      name: uspace_session
      description: |
        The same session in the uspace_session cookie, accepted only on a
        same-origin WebSocket upgrade whose Origin is on
        ANSP_WS_ALLOWED_ORIGINS (M22).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: The client's reference of the request; a repeat answers the first result.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
      example: console-7f3a9c
    RestrictionID:
      name: id
      in: path
      required: true
      description: The restriction id (ULID).
      schema:
        $ref: "#/components/schemas/ULID"
      example: 01K6P0A1B2C3D4E5F6G7H8J9KM
    Version:
      name: version
      in: path
      required: true
      description: The ansp_version.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 2
    RequestID:
      name: id
      in: path
      required: true
      description: The restriction request id (ULID).
      schema:
        $ref: "#/components/schemas/ULID"
      example: 01K6P2M3N4P5Q6R7S8T9V0W1X2
    AckID:
      name: ack_id
      in: path
      required: true
      description: The ack_id of the receipt.
      schema:
        $ref: "#/components/schemas/ULID"
      example: 01K6P3Q8Y2D6W4Z1V7R5T9X3MB
    AlarmID:
      name: id
      in: path
      required: true
      description: The id of the delivery alarm.
      schema:
        $ref: "#/components/schemas/ULID"
      example: 01K6P0A9QZ3V1H8M2T6R4W5X7C
    NoticeID:
      name: id
      in: path
      required: true
      description: The ack_id of the notice.
      schema:
        $ref: "#/components/schemas/ULID"
      example: 01K6P3Q8Y2D6W4Z1V7R5T9X3MB
    AdapterID:
      name: id
      in: path
      required: true
      description: The adapter instance slug.
      schema:
        $ref: "#/components/schemas/AdapterSlug"
      example: adsb-tbs
    SourceType:
      name: type
      in: path
      required: true
      description: The source type; this system has one, manned.
      schema:
        type: string
        enum: [manned]
      example: manned
    SourceInstance:
      name: instance
      in: path
      required: true
      description: An adapter id, or * for the type as a whole.
      schema:
        type: string
        pattern: "^(\\*|[a-z][a-z0-9]*(-[a-z0-9]+)*)$"
        maxLength: 64
      example: adsb-tbs
    UserID:
      name: id
      in: path
      required: true
      description: The account id (ULID).
      schema:
        $ref: "#/components/schemas/ULID"
      example: 01K6NZ8Q2W3E4R5T6Y7V8W9X0Z
    BBox:
      name: bbox
      in: query
      required: false
      description: |
        A bounding box west,south,east,north in WGS84 degrees (RFC 7946
        §5 order, [lng, lat]); west > east crosses the antimeridian.
      schema:
        type: string
        maxLength: 96
        pattern: "^-?[0-9]+(\\.[0-9]+)?(,-?[0-9]+(\\.[0-9]+)?){3}$"
      example: "44.60,41.60,45.00,41.90"
    Limit:
      name: limit
      in: query
      required: false
      description: At most this many items (default 100); truncated says when more existed.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      example: 100

  responses:
    BadRequest:
      description: The request is not valid; errors names every field at fault.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/invalid_request
            title: Bad Request
            status: 400
            detail: the request is not valid
            instance: /v1/restrictions
            errors:
              - field: lower_ref
                reason: AGL is not supported for a dynamic restriction in this release
    Unauthorized:
      description: No credential, or one that is refused; type names core's counter (rejected_audience, rejected_expired, ...).
      headers:
        WWW-Authenticate:
          description: Bearer, with error="invalid_token" for a refused token.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/unauthenticated
            title: Unauthorized
            status: 401
            detail: no bearer token
            instance: /v1/restrictions
            errors:
              - field: Authorization
                reason: no bearer token
    Forbidden:
      description: The caller lacks a scope or a role, or its certificate binding is refused.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/forbidden
            title: Forbidden
            status: 403
            detail: the token does not grant a scope this operation requires
            instance: /v1/coordination/notices
            errors:
              - field: scope
                reason: missing ansp.coordination
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/not_found
            title: Not Found
            status: 404
            detail: no restriction has this id
            instance: /v1/restrictions/01K6P0A1B2C3D4E5F6G7H8J9KM
            errors: []
    Conflict:
      description: The resource is not in a state that allows this, or the key was used with another body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/conflict
            title: Conflict
            status: 409
            detail: the restriction is active; only a planned restriction can be cancelled
            instance: /v1/restrictions/01K6P0A1B2C3D4E5F6G7H8J9KM/cancel
            errors:
              - field: state
                reason: is active
    TooLarge:
      description: The body is larger than the operation accepts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/body_too_large
            title: Request Entity Too Large
            status: 413
            detail: the body is larger than 1048576 bytes
            instance: /v1/coordination/notices
            errors:
              - field: body
                reason: larger than 1048576 bytes
    UnsupportedMediaType:
      description: The body is not of the media type the operation takes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/unsupported_media_type
            title: Unsupported Media Type
            status: 415
            detail: the body must be application/jose
            instance: /v1/cis/notifications
            errors:
              - field: Content-Type
                reason: must be application/jose
    UpgradeRequired:
      description: A plain GET on a WebSocket endpoint.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/upgrade_required
            title: Upgrade Required
            status: 426
            detail: this endpoint is a WebSocket upgrade
            instance: /v1/manned-traffic/stream
            errors:
              - field: Upgrade
                reason: must be websocket
    RateLimited:
      description: Too many requests; come back after Retry-After seconds.
      headers:
        Retry-After:
          description: Seconds to wait, at least 1.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/rate_limited
            title: Too Many Requests
            status: 429
            detail: too many requests; retry later
            instance: /v1/auth/login
            errors: []
    Internal:
      description: The request could not be completed; no detail of the cause is given.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/internal
            title: Internal Server Error
            status: 500
            detail: the request could not be completed
            instance: /.well-known/jwks.json
            errors: []
    Unavailable:
      description: |
        A dependency cannot answer now (the database, NATS KV, the CIS
        projection: cis_stale, the session store); nothing was changed.
        Come back after Retry-After seconds.
      headers:
        Retry-After:
          description: Seconds to wait, at least 1.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.uspace.ge/problems/cis_stale
            title: Service Unavailable
            status: 503
            detail: the CIS projection is older than cis_stale_bound_s
            instance: /v1/restrictions
            errors:
              - field: cis_age_s
                reason: 412 s is older than 300 s

