  /v1/coordination/notices:
    post:
      operationId: submitCoordinationNotice
      tags: [coordination]
      summary: Submit an Annex V notice
      x-process: api
      x-spec: 02 F13, 04 §3.5 coordination/annex_v/v1, Art. 13(2)
      x-auth: token:ansp.coordination+mtls
      description: |
        Intake of the Annex V data a USSP sends the ANSP: intents
        touching controlled U-space airspace, non-conformance notices
        (2021/664 Art. 13(2)), contingent and ended notices. The body is
        this system's own schema coordination/annex_v/v1
        (schemas/coordination/annex_v/v1.json, M14); the USSP consumes
        it from this repository. The token's sub must be a USSP on the
        CIS USSP list, else 403 and an audit row; the client certificate
        is bound per ANSP_MTLS_MODE (M25). The answer is a receipt
        (202 with ack_id, M2): a person's acknowledgement follows on
        GET /v1/coordination/notices/{ack_id}. A repeat with the same
        notice_ref and the same body from the same sender answers the
        same receipt with 200 (nothing is stored twice); the same
        notice_ref with another body is refused 409 notice_ref_reused, so
        a second notice is never answered with the first one's receipt.
        With no CIS USSP list projected the notice is accepted and flagged
        sender_unverified (never refused for lack of this system's data).
        The restrictions the notice's volumes intersect are recorded
        with it (restriction_ids). A notice carries at most 1000 volumes
        in all (over its intents); more is refused 400 before anything is
        read or stored.
      security:
        - ecosystemToken: [ansp.coordination]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnexVNotice"
            example: *AnnexVNonconformance
      responses:
        "202":
          description: Received; the receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeReceipt"
              example:
                ack_id: 01K6P3Q8Y2D6W4Z1V7R5T9X3MB
                state: received
                received_at: "2026-10-02T12:31:02.118Z"
        "200":
          description: A repeat of a notice received before; its first receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeReceipt"
              example:
                ack_id: 01K6P3Q8Y2D6W4Z1V7R5T9X3MB
                state: received
                received_at: "2026-10-02T12:31:02.118Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

