  /v1/cis/notifications:
    post:
      operationId: receiveCisNotification
      tags: [cis]
      summary: Receive a CIS change notification (F3 push)
      x-process: api
      x-spec: 02 F3
      x-auth: jws:cisp
      description: |
        The receiver of the CISP's change notifications (02 F3, M1): a
        compact JWS (application/jose) signed by an issuer on
        ANSP_CIS_NOTIFY_ISSUERS (the CISP; JWKS URL from configuration),
        verified with uspace-core's auth.VerifyCompact. The payload is
        {iss, aud, sub, iat, jti, body}: aud the host of this system's
        registered callback_url, sub the subscription id, jti the
        delivery id (replay window 5 min, remembered in the database),
        body the CISP's cis/change/v1 (Change in api/clients/cisp.yaml).
        There is no bearer: the signature authenticates the sender.
        The reasons subscription_test and republished, any reason this
        system does not know, and a delivery id seen before are
        acknowledged 204 without a pull (M16); any other reason answers
        202 and triggers a pull of the named dataset. pull_url is
        honoured only when its host equals the issuer's configured base
        host.
      security: []
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              type: string
              description: A compact JWS, three base64url parts separated by dots.
              maxLength: 262144
              pattern: "^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
            example: aGVhZGVy.cGF5bG9hZA.c2lnbmF0dXJl
      responses:
        "202":
          description: Accepted; a pull of the dataset is triggered.
        "204":
          description: Acknowledged without a pull (a test, a republication, an unknown reason or a replay).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"

