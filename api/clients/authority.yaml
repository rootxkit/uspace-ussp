            mode: {type: string, enum: [live, at]}
            as_of: {type: string, format: date-time}
            window_from: {type: string, format: date-time}
            window_to: {type: string, format: date-time}
            aircraft:
              type: array
              items:
                $ref: "#/components/schemas/PoliceAircraft"
            truncated: {type: boolean, description: More than POLICE_MAX_AIRCRAFT aircraft; narrow the box.}
            sources:
              $ref: "#/components/schemas/PolicePictureSources"
