    EvidencePackKind:
      type: string
      enum: [oversight, legal]
    EvidencePackInput:
      type: object
      required: [kind, from, to, purpose]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/EvidencePackKind"}
        from: {type: string, format: date-time, description: Inclusive start of the window.}
        to: {type: string, format: date-time, description: Exclusive end of the window.}
        purpose: {type: string, minLength: 1, maxLength: 200}
        case_ref: {type: string, minLength: 1, maxLength: 200, description: Required for a legal pack.}
    EvidencePackSummary:
      type: object
      required: [pack_id, kind, from, to, content_hash, size_bytes, created_by, created_at]
      properties:
        pack_id: {type: string}
        kind: {$ref: "#/components/schemas/EvidencePackKind"}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        content_hash: {type: string, description: "sha256:<64 hex> of the archive."}
        size_bytes: {type: integer, format: int64}
        signature_kid: {type: [string, "null"]}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    EvidencePack:
      type: object
      required: [pack_id, incident_id, kind, from, to, content_hash, size_bytes, seal_statement, manifest, purpose, created_by,
                 created_at]
      properties:
        pack_id: {type: string}
        incident_id: {type: string}
        kind: {$ref: "#/components/schemas/EvidencePackKind"}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        content_hash: {type: string, description: "sha256:<64 hex> of the archive."}
        size_bytes: {type: integer, format: int64}
        signature: {type: [string, "null"], description: "Detached JWS (RFC 7797, b64 false) of the publication key over the seal statement's canonical bytes (seal_statement serialised as stored)."}
        signature_kid: {type: [string, "null"]}
        seal_statement:
          type: object
          description: What the signature covers (pack_id, incident_id, kind, window, content_hash, created_at).
          additionalProperties: true
        manifest:
          type: object
          description: What the archive holds, section by section, with what was observed, what was inferred and what was unavailable and why (docs/runbooks/incidents.md). No personal data.
          additionalProperties: true
        purpose: {type: string}
        case_ref: {type: [string, "null"]}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    EvidencePackVerification:
      type: object
      required: [pack_id, content_hash, hash_matches, signature, verified_at]
      properties:
        pack_id: {type: string}
        content_hash: {type: string}
        recomputed_hash: {type: [string, "null"], description: Null when the stored archive could not be read or opened.}
        hash_matches: {type: boolean}
        problem: {type: [string, "null"], description: What was wrong, when something was.}
        signature:
          type: string
          enum: [verified, invalid, unsigned, unverifiable]
          description: unverifiable when the signing key is not held by this system any more.
        signature_detail: {type: [string, "null"]}
        verified_at: {type: string, format: date-time}
    OccurrenceCategory:
      type: string
      description: The 376/2014 Art. 4(1) class of the report (spec 04 §3.3; the UAS classes of 2015/1018 are unverified, Q9).
      enum: [airprox, nonconformance_in_prohibited, lost_link_in_uspace, emergency, other]
    OccurrenceChannel:
      type: string
      description: mandatory (376 Art. 4) or voluntary (Art. 5); an operator's report (2019/947 Art. 19(2)) is mandatory.
      enum: [mandatory, voluntary]
    OccurrenceState:
      type: string
      enum: [received, classified, analysed, closed]
    OccurrenceReporterInput:
      type: object
      description: |
        Who reports. `org` is informational: the authority records the
        token's `sub`. `person_ref` is the reporter's opaque reference
        in the sender's system, sent in clear over TLS (M13) and sealed
        at rest here; it is shown to incident officers only and never
        exported (376 Art. 16).
      properties:
        org: {type: string, maxLength: 160}
        person_ref: {type: string, maxLength: 128}
    OccurrenceAircraftInput:
      type: object
      description: One UAS of the report. An operator registration's secret part is dropped, never stored.
      properties:
        serial: {type: string, maxLength: 128}
        operator_reg: {type: string, maxLength: 128}
        flight_id: {type: string, maxLength: 128}
        authorisation_number: {type: string, maxLength: 128}
    OccurrenceManned:
      type: object
      description: One manned aircraft of the report.
      properties:
        icao24: {type: string, pattern: "^[0-9a-f]{6}$"}
        callsign: {type: string, maxLength: 128}
    OccurrenceSeparation:
      type: object
      description: The minimum separation observed, in metres (horizontal, vertical) and when.
      properties:
        h_m: {type: number, format: double, minimum: 0}
        v_m: {type: number, format: double, minimum: 0}
        at: {type: string, format: date-time}
    OccurrenceReport:
      type: object
      description: |
        `occurrence/v1` (spec 04 §3.3), the request body of POST
        /v1/occurrences; schemas/occurrence/v1.json is the same shape
        with examples. Members this version does not know are ignored
        (02 §1).
      required: [schema, report_ref, channel, occurred_at, became_aware_at, category]
      properties:
        schema: {type: string, enum: [occurrence/v1]}
        report_ref: {type: string, minLength: 1, maxLength: 128, description: "The sender's reference: with the sender, the idempotency key."}
        channel: {$ref: "#/components/schemas/OccurrenceChannel"}
        occurred_at: {type: string, format: date-time}
        became_aware_at: {type: string, format: date-time, description: When the reporter became aware; the 72 h of 376 Art. 4(7)-(8) run from it.}
        category: {$ref: "#/components/schemas/OccurrenceCategory"}
        reporter: {$ref: "#/components/schemas/OccurrenceReporterInput"}
        aircraft:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/OccurrenceAircraftInput"}
        manned:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/OccurrenceManned"}
        intent_refs:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 64}
        min_separation: {$ref: "#/components/schemas/OccurrenceSeparation"}
        narrative: {type: string, maxLength: 20000, description: At most 20000 bytes of UTF-8.}
        evidence_urls:
          type: array
          maxItems: 20
          items: {type: string, format: uri, maxLength: 2048}
        reported_at: {type: string, format: date-time, description: When the sender recorded the report.}
    OccurrenceReceipt:
      type: object
      description: The acknowledgement of a report. It holds no reporter identity.
      required: [occurrence_id, report_ref, received_at, within_72h, state, replayed]
      properties:
        occurrence_id: {type: string, description: The authority's id of the report (ULID).}
        report_ref: {type: string}
        received_at: {type: string, format: date-time, description: The authority's database clock at intake.}
        within_72h: {type: boolean, description: "Received within the reporting deadline after became_aware_at; false: late, accepted and flagged."}
        state: {$ref: "#/components/schemas/OccurrenceState"}
        replayed: {type: boolean, description: True when this answers a report received before.}
    OccurrenceAircraft:
      type: object
      properties:
        serial: {type: string}
        operator_reg: {type: string, description: The registration number's public part.}
        flight_id: {type: string}
        authorisation_number: {type: string}
    OccurrenceSummary:
      type: object
      description: A report without its reporter's identity.
      required: [occurrence_id, channel, origin, category, occurred_at, became_aware_at, received_at, within_72h, state,
                 has_reporter_person, updated_at]
      properties:
        occurrence_id: {type: string}
        channel: {$ref: "#/components/schemas/OccurrenceChannel"}
        origin: {type: string, enum: [client, operator], description: "client: a USSP or the ANSP through its token; operator: an operator's report (2019/947 Art. 19(2))."}
        category: {$ref: "#/components/schemas/OccurrenceCategory"}
        occurred_at: {type: string, format: date-time}
        became_aware_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        reported_at: {type: [string, "null"], format: date-time}
        within_72h: {type: boolean}
        state: {$ref: "#/components/schemas/OccurrenceState"}
        risk_classification: {type: [string, "null"]}
        has_reporter_person: {type: boolean, description: Whether a reporter person reference is held (readable by incident officers only).}
        closed_at: {type: [string, "null"], format: date-time}
        updated_at: {type: string, format: date-time}
    OccurrencePage:
      type: object
      required: [occurrences]
      properties:
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/OccurrenceSummary"
        next_cursor:
          type: string
          description: Pass as cursor for the next page; absent on the last page.
    Occurrence:
      type: object
      description: A report without its reporter's identity (GET .../reporter has it, for incident officers only).
      required: [occurrence_id, channel, origin, category, occurred_at, became_aware_at, received_at, within_72h,
                 report_deadline_s, state, has_reporter_person, aircraft, manned, intent_refs, narrative, evidence_urls,
                 analysis, follow_up, updated_at]
      properties:
        occurrence_id: {type: string}
        channel: {$ref: "#/components/schemas/OccurrenceChannel"}
        origin: {type: string, enum: [client, operator]}
        category: {$ref: "#/components/schemas/OccurrenceCategory"}
        occurred_at: {type: string, format: date-time}
        became_aware_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        reported_at: {type: [string, "null"], format: date-time}
        within_72h: {type: boolean}
        report_deadline_s: {type: integer, description: The reporting deadline in force at intake.}
        state: {$ref: "#/components/schemas/OccurrenceState"}
        risk_classification: {type: [string, "null"]}
        classified_at: {type: [string, "null"], format: date-time}
        classified_by: {type: [string, "null"]}
        has_reporter_person: {type: boolean}
        aircraft:
          type: array
          items: {$ref: "#/components/schemas/OccurrenceAircraft"}
        manned:
          type: array
          items: {$ref: "#/components/schemas/OccurrenceManned"}
        intent_refs:
          type: array
          items: {type: string}
        min_separation:
          oneOf:
            - {$ref: "#/components/schemas/OccurrenceSeparation"}
            - {type: "null"}
        narrative: {type: string}
        evidence_urls:
          type: array
          items: {type: string}
        analysis: {type: string}
        follow_up: {type: string}
        closed_at: {type: [string, "null"], format: date-time}
        updated_at: {type: string, format: date-time}
        updated_by: {type: [string, "null"]}
    OccurrenceReporter:
      type: object
      description: The reporter of an occurrence, for incident officers only (376 Art. 16).
      required: [occurrence_id, reporter_org, report_ref]
      properties:
        occurrence_id: {type: string}
        reporter_org: {type: string, description: "The sender's client id, or operator:<registration public part>."}
        report_ref: {type: string}
        person_ref: {type: [string, "null"], description: "The reporter's reference in the sender's system; null when none was sent."}
    OccurrenceClassification:
      type: object
      required: [risk_classification]
      additionalProperties: false
      properties:
        risk_classification: {type: string, minLength: 1, maxLength: 64}
    OccurrenceAnalysisPatch:
      type: object
      additionalProperties: false
      properties:
        analysis: {type: string, maxLength: 20000}
        follow_up: {type: string, maxLength: 20000}
        state: {type: string, enum: [analysed, closed]}
    OccurrenceExportInput:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: {type: string, format: date-time, description: Received at or after.}
        to: {type: string, format: date-time, description: Received before.}
        format: {type: string, minLength: 1, maxLength: 64, description: "Default eccairs-compatible-draft (OCCURRENCES_EXPORT_FORMAT)."}
    OccurrenceExport:
      type: object
      required: [export_id, format, created_at, record_count, size_bytes, content_hash, content]
      properties:
        export_id: {type: string}
        format: {type: string}
        created_at: {type: string, format: date-time}
        record_count: {type: integer}
        size_bytes: {type: integer, format: int64}
        content_hash: {type: string, description: "sha256:<64 hex> of the UTF-8 bytes of content."}
        content: {type: string, description: The de-identified document exactly as sealed (JSON text for eccairs-compatible-draft).}
    ViolationReviewInput:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: {type: string, enum: [reviewed, dismissed, escalated]}
        note: {type: string, maxLength: 4000}
    DPViewInput:
      type: object
      required: [label, bbox]
      properties:
        label: {type: string, minLength: 1, maxLength: 200, description: What the area is (an airport, a city).}
        bbox:
          type: array
          description: "[west, south, east, north] in WGS84 degrees; west < east (never across the antimeridian)."
          minItems: 4
          maxItems: 4
          items: {type: number, format: double}
    DPView:
      type: object
      required: [id, label, bbox, created_by, created_at]
      properties:
        id: {type: integer, format: int64}
        label: {type: string}
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: number, format: double}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    DPViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items: {$ref: "#/components/schemas/DPView"}
    DPProvider:
      type: object
      required: [uss_id, state, isas, tiles, flights, slow, provider_unknown, status_age_s]
      properties:
        uss_id: {type: string, description: "The ISA owner (its client id at the DSS); the source instance of its tracks."}
        uss_base_url: {type: string}
        state: {type: string, enum: [live, stale, down, disabled, unknown]}
        since: {type: string, format: date-time}
        age_s: {type: number, format: double, description: Seconds since its last successful poll.}
        isas: {type: integer}
        tiles: {type: integer}
        flights: {type: integer}
        p95_s: {type: number, format: double}
        p99_s: {type: number, format: double}
        slow: {type: boolean}
        unavailable_since: {type: string, format: date-time}
        provider_unknown: {type: boolean, description: It matches no operating certificate; still polled and shown.}
        disabled_by: {type: string}
        disabled_by_who: {type: string}
        dss: {type: string, enum: [ok, dss_unavailable, dss_unconfigured]}
        counters:
          type: object
          additionalProperties: {type: integer, format: int64}
        status_age_s: {type: number, format: double, description: Age of dp-poller's last status of it.}
    DPProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: {$ref: "#/components/schemas/DPProvider"}
    DPAvailabilityInput:
      type: object
      required: [availability, reason]
      properties:
        availability: {type: string, enum: [Unknown, Normal, Down], description: "F3548 UssAvailabilityState."}
        reason: {type: string, minLength: 1, maxLength: 500}
    DPAvailabilityResult:
      type: object
      required: [uss_id, availability, version]
      properties:
        uss_id: {type: string}
        availability: {type: string, enum: [Unknown, Normal, Down]}
        version: {type: string, description: The DSS's version of the USS's availability.}
    CertificateID:
      type: string
      pattern: "^[0-9a-f]{32}$"
    CertificateHolder:
      type: string
      enum: [ussp, cisp]
    CertificateStatus:
      type: string
      enum: [issued, operating, ceased, suspended, limited, revoked, lapsed]
      description: |
        Derived from the operating status, the limitation, the
        suspension and the end: revoked or lapsed, else suspended, else
        ceased, else limited, else operating, else issued.
    CertificateService:
      type: string
      enum: [network_identification, geo_awareness, flight_authorisation, traffic_information, weather, conformance_monitoring, common_information]
      description: |
        The Annex VI U-space services of a USSP (the names of the CISP's
        cis/ussp_list/v1), or the common information service of the
        CISP (Annex V), its one service.
    CertificateInput:
      type: object
      required: [holder, holder_name, code, services, valid_until, auth_method]
      properties:
        holder: {$ref: "#/components/schemas/CertificateHolder"}
        holder_name: {type: string, minLength: 1, maxLength: 200}
        holder_address: {type: string, maxLength: 500, description: "The organisation's registered address."}
        holder_email: {type: string, maxLength: 254, description: "The organisation's published contact (the USSP list's contact.email); no person."}
        holder_phone: {type: string, maxLength: 50}
        holder_url: {type: string, maxLength: 2048}
        code: {type: string, minLength: 1, maxLength: 8, pattern: "^[A-Z0-9]{1,8}$", description: "The holder's code (M8); unique, never changed."}
        base_url: {type: string, maxLength: 2048, description: "The national API base URL (https); required of a USSP."}
        services:
          type: array
          minItems: 1
          maxItems: 7
          items: {$ref: "#/components/schemas/CertificateService"}
        conditions: {type: string, maxLength: 4000}
        limitations:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 1000}
        terms_url: {type: string, maxLength: 2048, description: "The holder's terms and conditions (Art. 5(3), https); required of a USSP."}
        valid_from: {type: string, format: date-time, description: "The issue time; default the database's now."}
        valid_until: {type: string, format: date-time}
        auth_method: {type: string, enum: [client_secret_post, private_key_jwt]}
        jwks:
          type: object
          additionalProperties: true
          description: The holder's public key set (private_key_jwt only).
    CertificatePatch:
      type: object
      properties:
        holder_name: {type: string, minLength: 1, maxLength: 200}
        holder_address: {type: string, maxLength: 500}
        holder_email: {type: string, maxLength: 254}
        holder_phone: {type: string, maxLength: 50}
        holder_url: {type: string, maxLength: 2048}
        base_url: {type: string, maxLength: 2048}
        conditions: {type: string, maxLength: 4000}
        limitations:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 1000}
        terms_url: {type: string, maxLength: 2048}
        valid_until: {type: string, format: date-time}
    CertificateReason:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CertificateLimit:
      type: object
      required: [reason, limitations]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        limitations:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string, minLength: 1, maxLength: 1000}
    Certificate:
      type: object
      required: [id, holder, holder_name, holder_address, holder_email, holder_phone, holder_url, code, client_id, base_url,
                 services, conditions, limitations, terms_url, issued_at, valid_until, status, operations, limited, suspended,
                 status_reason, status_changed_at, status_changed_by, lapse_unused_after_months, lapse_ceased_after_months,
                 created_at, created_by, updated_at, updated_by]
      properties:
        id: {$ref: "#/components/schemas/CertificateID"}
        holder: {$ref: "#/components/schemas/CertificateHolder"}
        holder_name: {type: string}
        holder_address: {type: string}
        holder_email: {type: string}
        holder_phone: {type: string}
        holder_url: {type: string}
        code: {type: string}
        client_id: {type: string}
        base_url: {type: string}
        services:
          type: array
          items: {$ref: "#/components/schemas/CertificateService"}
        conditions: {type: string}
        limitations:
          type: array
          items: {type: string}
        terms_url: {type: string}
        issued_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        status: {$ref: "#/components/schemas/CertificateStatus"}
        operations: {type: string, enum: [not_started, operating, ceased]}
        operations_started_at: {type: string, format: date-time}
        operations_ceased_at: {type: string, format: date-time}
        limited: {type: boolean}
        suspended: {type: boolean}
        ended_at: {type: string, format: date-time}
        status_reason: {type: string}
        status_changed_at: {type: string, format: date-time}
        status_changed_by: {type: string}
        lapse_unused_after_months: {type: integer, description: "Art. 16(2): lapses when not used within this many months of issue."}
        lapse_ceased_after_months: {type: integer, description: "Art. 16(2): lapses when ceased for this many months."}
        lapses_at: {type: string, format: date-time, description: "When the lapse job will lapse it unless it starts or restarts; absent while operating."}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    CertificateList:
      type: object
      required: [certificates]
      properties:
        certificates:
          type: array
          items: {$ref: "#/components/schemas/Certificate"}
    CertificateClient:
      type: object
      required: [client_id, status, scopes, audiences, auth_method]
      properties:
        client_id: {type: string}
        status: {type: string, enum: [active, suspended, revoked]}
        scopes:
          type: array
          items: {type: string}
        audiences:
          type: array
          items: {type: string}
        auth_method: {type: string, enum: [client_secret_post, private_key_jwt]}
    CertificateIssued:
      type: object
      required: [certificate, client]
      properties:
        certificate: {$ref: "#/components/schemas/Certificate"}
        client: {$ref: "#/components/schemas/CertificateClient"}
        client_secret: {type: string, description: "client_secret_post only: shown once, handed over out of band."}
    ListPublication:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [queued, not_needed, pending]
          description: |
            queued: the list is in the F1 outbox; not_needed: the change
            does not touch the list; pending: it could not be queued now
            and the repair job will (reason says why).
        reason: {type: string}
        publication_id: {type: integer, format: int64}
    CertificateChange:
      type: object
      required: [certificate, list_publication]
      properties:
        certificate: {$ref: "#/components/schemas/Certificate"}
        client_status: {type: string, enum: [active, suspended, revoked]}
        tokens_valid_until:
          type: string
          format: date-time
          description: |
            The client was suspended or revoked: tokens issued before
            stay valid until this time (the token TTL), and no new one
            is issued.
        list_publication: {$ref: "#/components/schemas/ListPublication"}
    CertificateStatusNotice:
      type: object
      required: [state, at]
      properties:
        state: {type: string, enum: [started, ceased, restarted]}
        at: {type: string, format: date-time}
        reference: {type: string, minLength: 1, maxLength: 200}
    CertificateNotice:
      type: object
      required: [id, state, at, source, recorded_by, received_at]
      properties:
        id: {type: integer, format: int64}
        state: {type: string, enum: [started, ceased, restarted]}
        at: {type: string, format: date-time}
        reference: {type: string}
        source: {type: string, enum: [machine, manual]}
        recorded_by: {type: string}
        received_at: {type: string, format: date-time}
    CertificateNoticeResult:
      type: object
      required: [notice, certificate, replayed, list_publication]
      properties:
        notice: {$ref: "#/components/schemas/CertificateNotice"}
        certificate: {$ref: "#/components/schemas/Certificate"}
        replayed: {type: boolean, description: The same notice had been recorded; nothing changed.}
        list_publication: {$ref: "#/components/schemas/ListPublication"}
    CertificateDetail:
      type: object
      required: [certificate, notices]
      properties:
        certificate: {$ref: "#/components/schemas/Certificate"}
        client_status: {type: string, enum: [active, suspended, revoked]}
        notices:
          type: array
          items: {$ref: "#/components/schemas/CertificateNotice"}
    CertificateRegisterEntry:
      type: object
      required: [certificate_id, holder, holder_name, code, services, status, valid_from, valid_until, limitations]
      properties:
        certificate_id: {$ref: "#/components/schemas/CertificateID"}
        holder: {$ref: "#/components/schemas/CertificateHolder"}
        holder_name: {type: string}
        code: {type: string}
        services:
          type: array
          items: {$ref: "#/components/schemas/CertificateService"}
        status: {$ref: "#/components/schemas/CertificateStatus"}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        limitations:
          type: array
          items: {type: string}
    CertificateRegister:
      type: object
      required: [generated_at, certificates]
      properties:
        generated_at: {type: string, format: date-time}
        certificates:
          type: array
          items: {$ref: "#/components/schemas/CertificateRegisterEntry"}
    USSPListPublication:
      type: object
      required: [publication_id, ussps, wanted]
      properties:
        publication_id: {type: integer, format: int64}
        ussps: {type: integer, description: USSPs on the list.}
        wanted: {type: integer, format: int64, description: The list version the change counter stood at.}
    # WP-19: the police realm's answers and the DPO report. Personal
    # data appears in PoliceOperatorIdentity only, which a police answer
