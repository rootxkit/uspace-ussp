      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/RegistryValidity"}
    RegistryChange:
      type: object
      required: [seq, entity_type, entity_id, public_key, status, at]
      properties:
        seq: {type: integer, format: int64}
        entity_type: {type: string, enum: [operator, uas, pilot]}
        entity_id: {type: string}
        public_key: {type: string, description: "The registration number, the serial or the pilot id."}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        at: {type: string, format: date-time}
    RegistryChangePage:
      type: object
      required: [changes, next_since]
      properties:
        changes:
          type: array
          items: {$ref: "#/components/schemas/RegistryChange"}
        next_since: {type: integer, format: int64, description: Pass as since for the next page.}
    # WP-7: Remote ID receivers, observations and raw frames.
    RIDReceiverOwner:
      type: string
      enum: [authority, third_party]
    RIDReceiverStatus:
      type: string
      enum: [enabled, disabled]
    RIDReportingField:
      type: string
      enum: [transmitter, payload_hex, rssi_dbm, rx_ts, receiver_position]
    RIDReceiverConfig:
      type: object
      description: |
        What the receiver is told to do (GET .../config). Absent members
        take the defaults of the ingest's configuration
        (RID_DEFAULT_* variables), so a default is never a literal
        here (INV-03).
      properties:
        batch_interval_ms: {type: integer, minimum: 100, maximum: 1000, description: How often the receiver posts a batch; at most one second of reception per batch.}
        backlog_cap: {type: integer, minimum: 1, maximum: 10000000, description: Observations the receiver buffers while the ingest is unreachable, replayed with backlog true and the original rx_ts.}
        heartbeat_interval_s: {type: integer, minimum: 1, maximum: 300}
        position_tolerance_m: {type: number, format: double, exclusiveMinimum: 0, maximum: 100000, description: Distance from the pinned position beyond which a heartbeat's reported position is counted as a deviation (T2).}
        reporting_fields:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {$ref: "#/components/schemas/RIDReportingField"}
    RIDPosition:
      type: object
      required: [lat_deg, lon_deg]
      properties:
        lat_deg: {type: number, format: double, minimum: -90, maximum: 90}
        lon_deg: {type: number, format: double, minimum: -180, maximum: 180}
        alt_hae_m: {type: [number, "null"], format: double, minimum: -1000, maximum: 10000, description: Height above the WGS-84 ellipsoid, as the receiver's GNSS reports it.}
    RIDReceiverInput:
      type: object
      required: [id, label, lat_deg, lon_deg, owner]
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Slug; the receiver id of every batch and status.}
        label: {type: string, minLength: 1, maxLength: 200, description: The receiver's display label (rid_receivers.name).}
        lat_deg: {type: number, format: double, minimum: -90, maximum: 90, description: Pinned position.}
        lon_deg: {type: number, format: double, minimum: -180, maximum: 180}
        owner: {$ref: "#/components/schemas/RIDReceiverOwner"}
        owner_name: {type: string, maxLength: 200}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
    RIDReceiverPatch:
      type: object
      description: Members present are changed; lat_deg and lon_deg come together.
      properties:
        label: {type: string, minLength: 1, maxLength: 200, description: The receiver's display label (rid_receivers.name).}
        lat_deg: {type: number, format: double, minimum: -90, maximum: 90}
        lon_deg: {type: number, format: double, minimum: -180, maximum: 180}
        owner: {$ref: "#/components/schemas/RIDReceiverOwner"}
        owner_name: {type: string, maxLength: 200}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
    RIDReceiver:
      type: object
      required: [id, label, lat_deg, lon_deg, owner, status, key_generation, position_deviations, config, version, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        label: {type: string}
        lat_deg: {type: number, format: double}
        lon_deg: {type: number, format: double}
        owner: {$ref: "#/components/schemas/RIDReceiverOwner"}
        owner_name: {type: string}
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        disabled_by: {type: string, description: Who disabled it, as the audit log names them.}
        disabled_reason: {type: string}
        disabled_at: {type: string, format: date-time}
        key_generation: {type: integer}
        previous_key_valid_until: {type: string, format: date-time, description: The previous generation's keys are accepted until then.}
        last_seen_at: {type: string, format: date-time, description: The last heartbeat, on api's clock; absent when never heard.}
        last_position: {$ref: "#/components/schemas/RIDPosition"}
        position_deviation_m: {type: number, format: double, description: Distance of the last reported position from the pinned one.}
        position_deviations: {type: integer, format: int64, description: Heartbeats whose position was beyond the tolerance.}
        firmware: {type: string}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    RIDReceiverList:
      type: object
      required: [receivers]
      properties:
        receivers:
          type: array
          items: {$ref: "#/components/schemas/RIDReceiver"}
        next_after: {type: string, description: Pass as after for the next page; absent on the last page.}
    RIDReceiverCredentials:
      type: object
      description: Shown once. Neither value can be read back; a lost key is replaced by a rotation.
      required: [generation, bearer_key, hmac_secret_hex, signature_header]
      properties:
        generation: {type: integer}
        bearer_key: {type: string, description: "Authorization: Bearer <bearer_key> on every receiver request."}
        hmac_secret_hex: {type: string, pattern: "^[0-9a-f]{64}$", description: The 32-byte HMAC-SHA256 secret, hex.}
        signature_header: {type: string, enum: [X-Report-Signature]}
    RIDReceiverCreated:
      type: object
      required: [receiver, credentials]
      properties:
        receiver: {$ref: "#/components/schemas/RIDReceiver"}
        credentials: {$ref: "#/components/schemas/RIDReceiverCredentials"}
    RIDReceiverStatusInput:
      type: object
      required: [status, reason]
      properties:
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        reason: {type: string, minLength: 1, maxLength: 500}
    RIDKeyRotationInput:
      type: object
      properties:
        grace_s: {type: integer, minimum: 0, maximum: 604800, description: How long the previous keys keep working; default RID_KEY_ROTATION_GRACE_S.}
    RIDIngestLimits:
      type: object
      required: [max_batch_bytes, max_observations, max_payload_bytes, max_skew_s, nonce_window_s]
      properties:
        max_batch_bytes: {type: integer}
        max_observations: {type: integer}
        max_payload_bytes: {type: integer}
        max_skew_s: {type: integer}
        nonce_window_s: {type: integer, description: A nonce is refused if seen again from this receiver within this window (twice max_skew_s).}
    RIDReceiverConfigView:
      type: object
      required: [receiver_id, status, config, limits, signature_header, server_time_ms]
      properties:
        receiver_id: {type: string}
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
        limits: {$ref: "#/components/schemas/RIDIngestLimits"}
        signature_header: {type: string, enum: [X-Report-Signature]}
        server_time_ms: {type: integer, format: int64, description: The authority's clock, so a receiver can see its own skew.}
    RIDHeartbeat:
      type: object
      required: [receiver_id, sent_at_ms, nonce]
      properties:
        receiver_id: {type: string}
        sent_at_ms: {type: integer, format: int64, description: Epoch milliseconds on the receiver's clock.}
        nonce: {type: string, minLength: 1, maxLength: 256}
        position: {$ref: "#/components/schemas/RIDPosition"}
        firmware: {type: string, maxLength: 100}
        queue_depth: {type: integer, minimum: 0, description: Observations the receiver holds unsent.}
    RIDHeartbeatAck:
      type: object
      required: [receiver_id, status, last_seen_at, server_time_ms]
      properties:
        receiver_id: {type: string}
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        last_seen_at: {type: string, format: date-time}
        position_deviation_m: {type: number, format: double}
        position_tolerance_m: {type: number, format: double}
        server_time_ms: {type: integer, format: int64}
    RIDObservation:
      type: object
      description: One frame as the receiver heard it (schemas/rid/observation/v1.json).
      required: [transmitter, payload_hex]
      properties:
        transmitter: {type: string, pattern: "^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$", description: The BT or Wi-Fi MAC address the frame came from.}
        payload_hex: {type: string, minLength: 2, maxLength: 1024, pattern: "^([0-9A-Fa-f]{2})+$", description: The ODID message or message pack, as received.}
        rssi_dbm: {type: [number, "null"], format: double, minimum: -200, maximum: 50}
        rx_ts: {type: [string, "null"], format: date-time, description: "Reception time on the receiver's clock, RFC 3339 UTC; null when unknown (placed at arrival, T-12)."}
        receiver_position: {$ref: "#/components/schemas/RIDPosition"}
    RIDObservationBatch:
      type: object
      description: rid/observation/v1, the exact bytes signed.
      required: [receiver_id, sent_at_ms, nonce, observations]
      properties:
        receiver_id: {type: string}
        sent_at_ms: {type: integer, format: int64}
        nonce: {type: string, minLength: 1, maxLength: 256}
        backlog: {type: boolean, default: false, description: True when the batch replays observations buffered while the ingest was unreachable (T-04).}
        observations:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/RIDObservation"}
    RIDObservationAck:
      type: object
      required: [batch_id, accepted, duplicates]
      properties:
        batch_id: {type: string, description: "<receiver_id>:<nonce>"}
        accepted: {type: integer, description: Observations written to the work queue.}
        duplicates: {type: integer, description: Observations already accepted within the dedupe window, not queued again.}
    RIDFrame:
      type: object
      required: [frame_id, ingest_ts, receiver_id, transmitter, payload_hex, payload_sha256_hex, backlog, sent_at_ms, nonce]
      properties:
        frame_id: {type: string}
        ingest_ts: {type: string, format: date-time}
        receiver_ts: {type: string, format: date-time, description: "The receiver's clock (rid_observations.receiver_ts; rx_ts in the batch). Not comparable with another clock."}
        receiver_id: {type: string}
        transmitter: {type: string}
        msg_type: {type: integer}
        payload_hex: {type: string}
        payload_sha256_hex: {type: string}
        rssi_dbm: {type: number, format: double}
        backlog: {type: boolean}
        receiver_position: {$ref: "#/components/schemas/RIDPosition"}
        sent_at_ms: {type: integer, format: int64}
        nonce: {type: string}
    RIDFramePage:
      type: object
      required: [frames, truncated]
      properties:
        frames:
          type: array
          items: {$ref: "#/components/schemas/RIDFrame"}
        truncated: {type: boolean, description: The window holds more frames than were returned.}
    CellOwnership:
      type: object
      required: [version, assignments, updated_by, updated_at]
      properties:
        version: {type: integer, format: int64, minimum: 1, description: Rises by one with every change.}
        assignments:
          type: object
          description: cell3 name (`c3:<lat_idx>:<lon_idx>`, uspace-core geodesy/cell) -> detect worker id.
          additionalProperties: {type: string}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    CellOwnershipInput:
      type: object
      required: [assignments, reason]
      properties:
        assignments:
          type: object
          description: cell3 name -> detect worker id (`^[a-z0-9][a-z0-9_-]{0,62}$`); the whole map, replacing the stored one.
          maxProperties: 64800
          additionalProperties: {type: string, maxLength: 63}
        reason: {type: string, minLength: 1, maxLength: 500}
    SourceType:
      type: string
      description: The adapter type (04 §2 `source`), one per adapter process.
      enum: [direct_rid, network_rid, ansp_feed]
    SourceSwitchInput:
      type: object
      required: [enabled, reason]
      properties:
        enabled: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500}
    SourceControl:
      type: object
      required: [source_type, enabled, reason, actor, changed_at, version]
      properties:
        source_type: {$ref: "#/components/schemas/SourceType"}
        instance_id: {type: string, description: Absent for the switch of the whole type.}
        enabled: {type: boolean}
        reason: {type: string}
        actor: {type: string, description: Who switched it, as the audit log names them.}
        changed_at: {type: string, format: date-time}
        version: {type: integer, format: int64}
    SourceSwitchResult:
      type: object
      required: [control, changed, epoch, version]
      properties:
        control: {$ref: "#/components/schemas/SourceControl"}
        changed: {type: boolean, description: False when the switch already held this state; nothing was written.}
        epoch: {type: string}
        version: {type: integer, format: int64, description: The version of the whole state after the switch.}
    SourceView:
      type: object
      required: [source_type, switch, health]
      properties:
        source_type: {$ref: "#/components/schemas/SourceType"}
        instance_id: {type: string}
        switch: {type: string, enum: [enabled, disabled]}
        disabled_by: {type: string, enum: [type, instance, default_deny]}
        disabled_by_who: {type: string}
        disabled_reason: {type: string}
        health: {type: string, enum: [healthy, stale, lagging, never_heard]}
        age_s: {type: number, format: double, description: Seconds since the adapter last heard the source.}
        lag_s: {type: number, format: double}
        status_age_s: {type: number, format: double, description: Seconds since the adapter's last status reached api.}
        counters:
          type: object
          additionalProperties: {type: integer, format: int64}
    SourceOverview:
      type: object
      required: [epoch, version, default_deny, controls, sources]
      properties:
        epoch: {type: string}
        version: {type: integer, format: int64}
        default_deny: {type: boolean}
        controls:
          type: array
          items: {$ref: "#/components/schemas/SourceControl"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/SourceView"}
