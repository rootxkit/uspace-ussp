openapi: 3.1.0
info:
  title: uspace-authority national API
  version: 0.1.0
  description: |
    The competent authority's system of the Georgian U-space rebuild.
    This file is the contract: the only source of handlers and types
    (`api/gen/`), and an endpoint that is not in it does not exist
    (spec `00 §7`). Paths are versioned under `/v1`; changes within a
    version are additive only.

    Every error is `application/problem+json` in the shape of the
    `Problem` schema (the lab's `schemas/common/problem/v1`, decision
    M28).

    Every operation carries `security` (an empty list only for the
    health paths) and the vendor extension `x-audit`, which names the
    `events` row the operation writes:

    - `x-audit: none` the operation writes no `events` row (health and
      public reads only);
    - `x-audit: {event_type: <name>, entity_type: <name>, purpose:
      required | optional | none}` the operation writes one `events`
      row of that type, inside the same transaction as its effect;
      `purpose: required` means the request is refused without a
      `purpose` (every PII read, CLAUDE.md rule 6).

    An operation for machines carries `x-scope: <scope>` instead of
    `x-roles`: it admits an ecosystem token granting that scope and
    never a console session (WP-2 table B). An operation with neither
    `x-roles`, `x-scope` nor `x-session` is refused (fail closed).
    The Remote ID receiver operations carry `x-receiver: true` instead:
    the receiver's bearer key and the HMAC of the body authenticate
    them (WP-7), and they are served outside the generated server.
    The CIS change-notification receiver carries `x-cis-delivery: true`:
    the compact JWS of its body is its credential (WP-6), and it is
    served outside the generated server too. The operations dp-poller
    serves carry `x-dp: true` (WP-14): it verifies their bearer token
    itself, and they are served outside the generated server.

    Work packages add their path groups below under a `# WP-k` comment
    and regenerate `api/gen/` with `scripts/generate.sh`.
servers:
  - url: /
tags:
  - name: health
    description: Liveness, readiness and metrics of one process instance (admin port).
  - name: policy
    description: The versioned authority policy (INV-03); thresholds are data.
  - name: audit
    description: The append-only audit log with its monthly hash chain.
  - name: retention
    description: Retention periods, legal holds and the archive (WP-27); the periods are the spec's defaults pending GCAA.
  - name: tokens
    description: |
      The ecosystem OAuth2 token service (WP-2): client credentials,
      the JWKS and the issuer metadata. The JWT contract and the scope
      catalogue are the normative tables A and B of
      `docs/WORKPACKAGES/WP-2.md`, restated in
      `docs/runbooks/token-service.md`.
  - name: oauth-admin
    description: The token service's client registry and signing keys (admin).
  - name: auth
    description: Console sign-in, TOTP and sessions (WP-2).
  - name: users
    description: Console accounts (admin).
  - name: registry
    description: |
      The registry of UAS operators, UAS and remote pilots (WP-3,
      2019/947 Art. 14). Records carry no personal data; personal data
      has its own purpose-logged operations.
  - name: registry-f8
    description: Status-only validity lookups and the change feed for USSPs (F8, scope registry.validate).
  - name: registry-portal
    description: |
      The public registration portal (WP-20, plan Q-A11, Q-A17):
      applications verified by an e-mailed link, the registrars' review
      and approval (the number issued through the registry), and an
      operator's occurrence-report link. Off unless configured.
  - name: rid-receivers
    description: |
      The Remote ID receiver registry (WP-7, spec 02 F9): keys shown
      once, audited switches, and the receiver's own config and
      heartbeat endpoints.
  - name: rid-ingest
    description: Signed observation batches from receivers, served by rid-ingest (WP-7).
  - name: rid-frames
    description: Raw Remote ID frames as stored, purpose-logged (WP-7, LESSONS R-15).
  - name: sources
    description: "Source control (WP-10, U-15): switches by type and instance, audited, and every source's health."
  - name: cells
    description: The partition cells' ownership map (WP-10, spec 05 §3); cells never cross an external interface.
  - name: zones
    description: |
      Geo-zones (WP-5, spec 01 A2): ED-318 UASZone versions authored,
      approved and published; ED-318 and ED-269 import; export at an
      instant.
  - name: uspace
    description: U-space airspace designations (WP-5, spec 01 A3), published as ED-318 USPACE zones (admin).
  - name: cisp
    description: |
      The CISP client (WP-6, spec 02 F1, F3): the state of the signed
      publication outbox and of the CIS subscriber, and the change
      notification receiver every subscriber implements (M1).

  - name: violations
    description: |
      Violations found from the authority's own evidence (WP-12, spec 01
      A7, 2019/947 Art. 18(k)): raised and cleared by detect, persisted
      with their evidence excerpt, and reviewed by inspectors.

  - name: incidents
    description: |
      Incidents and evidence packs (WP-17, spec 01 A10, 02 F10): the
      authority's own case files, opened from escalated violations, its
      own observations and notices, and hash-sealed evidence packs
      whose creation and every download are audited with the purpose.
  - name: occurrences
    description: |
      Occurrence reports under Reg. (EU) 376/2014 (WP-18, spec 01 A8):
      intake from USSPs and the ANSP, independent handling by incident
      officers (classification, analysis), the reporter's identity for
      them only, and the de-identified export; segregated from
      violations and incidents (376 Art. 15-16).
  - name: certificates
    description: |
      USSP and CISP certificates (WP-16, spec 01 A5, 02 F1 and F7):
      issue with the holder's client, suspension, limitation,
      revocation and reinstatement, the holder's operating-status
      notices, the Art. 16(2) lapse job, the public register (Art.
      18(a)) and the USSP list published to the CISP.
  - name: dp
    description: |
      The ASTM F3411-22a Display Provider (WP-14, spec 02 F7):
      oversight areas, the Service Providers seen and their state, USS
      availability arbitration (F3548), the ISA change notification a
      Service Provider posts, and the conformance observation hook
      (Q-A7).
  - name: police
    description: |
      The police realm (WP-19, spec 02 F10): purpose-logged aircraft,
      operator and serial queries and legal evidence exports, for police
      accounts of an agency signed in with MFA from its allow-listed
      addresses. Occurrence reports are never reachable here.
  - name: picture
    description: |
      The console picture (WP-13, served by picture-ws, not api): the
      WebSocket of the common console frame (M29) and two reads of the
      same state. A session of the console or the police realm is
      required, checked against the sessions table through api.

paths:
  # WP-0: health paths, served by every process on its admin port.
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      description: 200 while the process runs. Says nothing about dependencies.
      security: []
      x-audit: none
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      description: |
        200 when every readiness check the process registered passes,
        503 otherwise. Every check is listed with its state, so a
        process that registered no check says so with an empty map
        rather than claiming a dependency is healthy.
      security: []
      x-audit: none
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one readiness check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      operationId: getMetrics
      tags: [health]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition, on the admin port only (loopback or
        the private network, never routed by Caddy). Served by the
        Prometheus handler, not by a generated handler
        (`api/oapi-codegen.yaml` excludes this operation).
      security: []
      x-audit: none
      responses:
        "200":
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string

  # WP-1: the authority policy and the audit log. Every operation below
  # names the console roles allowed in `x-roles`; until WP-2 lands the
  # role check is a placeholder that refuses every request without a
  # session (401 unauthenticated).
  /v1/policy:
    get:
      operationId: getPolicy
      tags: [policy]
      summary: The active policy
      description: The one active policy version and its thresholds.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The active policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPolicy
      tags: [policy]
      summary: Create a new policy version
      description: |
        Validates every threshold (finite and positive, E-15; a refusal
        names each field) and stores it as the next version, inactive.
        Activation is a separate, audited step.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: policy_created, entity_type: authority_policy, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyInput"
      responses:
        "201":
          description: The new version, inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Problem"
  /v1/policy/{version}/activate:
    post:
      operationId: activatePolicy
      tags: [policy]
      summary: Activate a policy version
      description: |
        Makes `version` the one active policy and publishes it to the
        processes that follow it. Only a version newer than the active
        one can be activated (followers apply only a higher version); a
        rollback is a new version with the old values (409 otherwise).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: policy_activated, entity_type: authority_policy, purpose: none}
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The policy now active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Problem"
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Audit events, newest first
      description: |
        Every filter is optional; pages are cut by `before_id` (the
        `next_before_id` of the previous page). Reading the log is itself
        recorded as an `audit_events_viewed` event.
      security:
        - sessionCookie: []
      x-roles: [admin, auditor]
      x-audit: {event_type: audit_events_viewed, entity_type: events, purpose: optional}
      parameters:
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: entity_id, in: query, schema: {type: string}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: event_type, in: query, schema: {type: string}}
        - {name: from, in: query, description: Inclusive lower bound of ts., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive upper bound of ts., schema: {type: string, format: date-time}}
        - {name: before_id, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: purpose, in: query, description: Why the log is read; recorded on the view event., schema: {type: string}}
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        default:
          $ref: "#/components/responses/Problem"

  /v1/audit/dpo-report:
    get:
      operationId: getDPOReport
      tags: [audit]
      summary: The month's personal-data views and exports, for the data protection officer
      description: |
        WP-19 (spec 06 §5, accountability). Every police query, export
        and download of the month (police_queries: user, agency,
        purpose, case reference, what was asked, how many results,
        whether personal data was released) and every events row of a
        personal-data read of the month (the audit catalogue's PII view
        types: registry personal data, raw frames, evidence packs built
        and downloaded, occurrence reporters), with the actor, the
        purpose, the entity and, for a police read, the case reference.
        `month` is a UTC calendar month (YYYY-MM). At most
        `DPO_REPORT_MAX_ROWS` rows per list, `truncated` beyond. The read
        is itself a `dpo_report_viewed` events row.
      security:
        - sessionCookie: []
      x-roles: [admin, auditor]
      x-audit: {event_type: dpo_report_viewed, entity_type: events, purpose: none}
      parameters:
        - {name: month, in: query, required: true, schema: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$"}}
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DPOReport"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-2: console sign-in (password, then TOTP) and sessions. A session
  # is table A's session JWT (M20), presented as a bearer by the web BFF
  # from the uspace_session cookie (docs/runbooks/session-contract.md).
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: First sign-in step (password)
      description: |
        Checks the password and returns a short, single-use MFA
        challenge. An unknown user, a disabled user and a wrong password
        get the same answer after the same argon2id work (no user
        enumeration). An account without confirmed TOTP gets its
        enrolment secret here, after the password. Rate-limited per
        client address and per username (429 with `Retry-After`).
        Every attempt is an events row (`login_password_accepted` or
        `login_refused`).
      security: []
      x-audit: {event_type: login_password_accepted, entity_type: user, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The MFA challenge.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/mfa:
    post:
      operationId: verifyMFA
      tags: [auth]
      summary: Second sign-in step (TOTP or a recovery code)
      description: |
        Exchanges the challenge and a TOTP code (or one recovery code)
        for a session. A code is accepted once; a challenge allows a
        bounded number of attempts and is used once. The first success
        after enrolment confirms it and returns the recovery codes,
        once. Every failure is an `mfa_refused` event; the session is a
        `session_started` event.
      security: []
      x-audit: {event_type: session_started, entity_type: session, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFARequest"
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIssued"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: The session of the caller
      description: >-
        The caller's session, checked against its sessions row. A read
        is the console's activity and moves the idle expiry, unless
        `activity=false`: a check-only read (picture-ws re-checks every
        open stream with it) leaves `last_seen_at` as it was, so an idle
        console still ends at the idle timeout.
      security:
        - sessionCookie: []
      x-session: any
      x-audit: none
      parameters:
        - name: activity
          in: query
          description: false checks the session without counting the request as activity.
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session of the caller
      security:
        - sessionCookie: []
      x-session: any
      x-audit: {event_type: logout, entity_type: session, purpose: none}
      responses:
        "204":
          description: The session is revoked.
        default:
          $ref: "#/components/responses/Problem"
  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Console accounts
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: Every account, by username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      tags: [users]
      summary: Create an account
      description: |
        The account signs in with the password given here and enrols
        TOTP at its first sign-in.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_created, entity_type: user, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    get:
      operationId: getUser
      tags: [users]
      summary: One account
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/roles:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    put:
      operationId: setUserRoles
      tags: [users]
      summary: Replace the roles of an account
      description: Revokes the sessions of the account, so the new roles apply at the next sign-in. The last active admin cannot lose the role (409).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_roles_changed, entity_type: user, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesInput"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/disable:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: disableUser
      tags: [users]
      summary: Disable an account
      description: Revokes its sessions; it can no longer sign in. The last active admin cannot be disabled (409).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_disabled, entity_type: user, purpose: none}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/enable:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: enableUser
      tags: [users]
      summary: Enable a disabled account
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_enabled, entity_type: user, purpose: none}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/mfa/reset:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: resetUserMFA
      tags: [users]
      summary: Reset the TOTP of an account
      description: Deletes the TOTP secret and the recovery codes and revokes the sessions; the account enrols again at its next sign-in.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_mfa_reset, entity_type: user, purpose: none}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/mfa/unlock:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: unlockUserMFA
      tags: [users]
      summary: Clear the MFA lock of an account
      description: |
        Wrong TOTP or recovery codes count against the account across
        challenges and addresses (NIST SP 800-63B 5.2.2): from
        `MFA_LOCKOUT_AFTER` failures the account is locked for a time
        that doubles with each failure, and at `MFA_HARD_LOCK_AFTER`
        (at most 100) until an admin calls this. A success clears the
        count.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_mfa_unlocked, entity_type: user, purpose: none}
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
  /v1/users/{user_id}/sessions/revoke:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: revokeUserSessions
      tags: [users]
      summary: Revoke every session of an account
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: session_revoked, entity_type: session, purpose: none}
      responses:
        "200":
          description: How many sessions were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revoked"
        default:
          $ref: "#/components/responses/Problem"

  /v1/users/{user_id}/police-access:
    parameters:
      - {name: user_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    put:
      operationId: setUserPoliceAccess
      tags: [users]
      summary: Replace the agency and the IP allow-list of a police account
      description: |
        WP-19. Police realm accounts only (409 for a console account).
        Revokes the account's sessions, so the new allow-list applies at
        once; every police query checks the address again.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: user_police_access_changed, entity_type: user, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoliceAccessInput"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  # WP-2: the ecosystem token service. /oauth/token and /.well-known/*
  # are public (the client authenticates in the body); /v1/oauth/* is
  # for admins. Every issuance and every refusal is an events row
  # (token_issued, token_refused; 06 §3).
  /oauth/token:
    post:
      operationId: requestToken
      tags: [tokens]
      summary: Client credentials grant
      description: |
        RFC 6749 §4.4 client credentials. The client authenticates with
        `client_secret_post` (`client_id`, `client_secret`) or
        `private_key_jwt` (RFC 7523: `client_assertion_type` =
        `urn:ietf:params:oauth:client-assertion-type:jwt-bearer`,
        `client_assertion` an RS256 JWT with `iss` = `sub` = the client
        id, `aud` = this issuer or its token endpoint, `exp` at most
        5 min ahead and a `jti` used once). Parameters in the query
        string are refused. `scope` names catalogue scopes (WP-2 table
        B), a subset of the client's. `audience`, or one RFC 8707
        `resource`, names the target: a host or the target's base URL,
        reduced to its host, which becomes `aud` (M18). For national
        scopes the host must be on the client's audience list; for
        `utm.*` and `rid.*` any host is accepted. One audience per
        token. Errors carry RFC 6749 `error` and `error_description`
        beside the problem members. Issuance is rate-limited per
        client (429 with `Retry-After`). Every refusal is a
        `token_refused` event.
      security: []
      x-audit: {event_type: token_issued, entity_type: oauth_client, purpose: none}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: An ecosystem machine token (table A).
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Pragma:
              schema: {type: string, enum: [no-cache]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "429":
          description: The client's issuance budget is spent.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/OAuthProblem"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags: [tokens]
      summary: The issuer's public keys
      description: |
        Every RS256 key a verifier may meet (`use: sig`, distinguished by
        `kid`): the active token-signing key, retired token-signing keys
        until their retirement plus the JWKS cache TTL (24 h), and this
        system's publication-signing key of the detached
        `X-JWS-Signature` (M26). Cacheable for 300 s.
      security: []
      x-audit: none
      responses:
        "200":
          description: The JWKS.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/openid-configuration:
    get:
      operationId: getIssuerMetadata
      tags: [tokens]
      summary: Issuer metadata
      description: |
        The issuer, its JWKS URL and token endpoint, the grant type and
        the client authentication methods. This is an OAuth2 issuer, not
        an OpenID provider: there is no authorisation endpoint.
      security: []
      x-audit: none
      responses:
        "200":
          description: The metadata.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerMetadata"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/clients:
    get:
      operationId: listOAuthClients
      tags: [oauth-admin]
      summary: Registered clients
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: Every client, by client id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOAuthClient
      tags: [oauth-admin]
      summary: Register a client
      description: |
        One client per calling system (M24). Scopes must be grantable
        to this client (in the catalogue, not reserved, not of a USSP's
        issuer, `dp.observe` for `lab-01` only); audiences are hosts.
        For `client_secret_post` the secret is generated here and
        returned once; only its argon2id hash is kept. For
        `private_key_jwt` the client's public JWKS is given (RSA keys of
        at least 2048 bits, no private members).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: oauth_client_created, entity_type: oauth_client, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientInput"
      responses:
        "201":
          description: The client, and its secret once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientCreated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/clients/{client_id}:
    parameters:
      - {name: client_id, in: path, required: true, schema: {type: string, maxLength: 64}}
    get:
      operationId: getOAuthClient
      tags: [oauth-admin]
      summary: One client
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOAuthClient
      tags: [oauth-admin]
      summary: Change a client's status, scopes, audiences or note
      description: |
        A suspended or revoked client gets no new token; tokens already
        issued expire within their TTL (at most 1 h).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: oauth_client_updated, entity_type: oauth_client, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientPatch"
      responses:
        "200":
          description: The client as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/keys:
    get:
      operationId: listSigningKeys
      tags: [oauth-admin]
      summary: Signing keys and their state
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: Every registered key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeyList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/keys/{kid}/compromised:
    parameters:
      - {name: kid, in: path, required: true, schema: {type: string, maxLength: 128}}
    post:
      operationId: compromiseSigningKey
      tags: [oauth-admin]
      summary: Drop a compromised key now
      description: |
        The emergency retirement: the key leaves the JWKS at once (no
        24 h overlap), never signs again and is never a rotation
        candidate. An active token key is replaced by the next
        candidate; without one this issuer stops issuing until a key is
        added. One admin suffices; the act is a `signing_key_compromised`
        event with the reason. Other replicas follow within
        `KEY_REFRESH_S`; verifiers drop the key when their JWKS cache
        refreshes.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: signing_key_compromised, entity_type: signing_key, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 1000}
      responses:
        "200":
          description: The key as marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKey"
        default:
          $ref: "#/components/responses/Problem"
  /v1/oauth/keys/rotate:
    post:
      operationId: rotateSigningKey
      tags: [oauth-admin]
      summary: Activate the next token-signing key
      description: |
        The next key is the first key of `SIGNING_KEY_FILES` never
        activated. With the two-person rule (`KEY_ROTATION_TWO_PERSON`,
        default on) the first admin's call records the request (202)
        and a second admin's call within `KEY_ROTATION_CONFIRM_S`
        (600 s) activates it (200); the same admin twice is refused
        (409). The previous key is retired and stays in the JWKS for
        `KEY_RETIRE_GRACE_S` (24 h).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: signing_key_activated, entity_type: signing_key, purpose: none}
      responses:
        "200":
          description: The next key is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyRotation"
        "202":
          description: Requested; a second admin must confirm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyRotation"
        default:
          $ref: "#/components/responses/Problem"

  # WP-3: the registry of operators, UAS and remote pilots (2019/947
  # Art. 14), its F8 validity lookups and change feed for USSPs.
  # Registry records carry no personal data: an operator's or a pilot's
  # personal data is served only by the `personal-data` operations, to
  # the registrar and inspector roles, with a `purpose`, each read an
  # events row (`registry_pii_viewed`). A viewer, a USSP and the public
  # never reach them (CLAUDE.md rule 6). Every change writes the
  # registry projection the resolvers read inside the same change; a
  # failed projection write rolls the change back and answers 503
  # `projection_unavailable` (LESSONS G-08).
  /v1/registry/operators:
    get:
      operationId: listRegistryOperators
      tags: [registry]
      summary: UAS operators, in id order
      description: |
        `number` looks an operator up by registration number, compared
        on its public part with ASCII letters upper-cased
        (uspace-core `regnum.CompareKey`, G-04). No personal data.
      security:
        - sessionCookie: []
      x-roles: [registrar, inspector, viewer]
      x-audit: none
      parameters:
        - {name: number, in: query, schema: {type: string, maxLength: 64}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/RegistryStatus"}}
        - {name: after, in: query, description: The next_after of the previous page., schema: {type: string, maxLength: 32}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: One page of operators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryOperatorList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRegistryOperator
      tags: [registry]
      summary: Register a UAS operator
      description: |
        The 2019/947 Art. 14(2) field set. The registration number is
        validated by uspace-core `regnum` against the active policy's
        `registration_number_pattern`; a number with a hyphen is refused
        (only the public part is registered). The secret part, when the
        authority issues one, is stored as a keyed hash only. Personal
        data is sealed and never echoed. 409 when the number is
        registered already.
      security:
        - sessionCookie: []
      x-roles: [registrar]
      x-audit: {event_type: operator_registered, entity_type: operator, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryOperatorInput"
      responses:
        "201":
          description: The registered operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryOperator"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/registry/operators/{operator_id}:
    parameters:
      - {name: operator_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    get:
      operationId: getRegistryOperator
      tags: [registry]
      summary: One UAS operator, without personal data
      security:
        - sessionCookie: []
      x-roles: [registrar, inspector, viewer]
      x-audit: none
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryOperator"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRegistryOperator
      tags: [registry]
      summary: Change an operator's details
      description: |
        Contact and personal details, authorisations and the end of
        validity. The type, the registration number and the status are
        not changed here (a correction is a revocation and a new
        registration; the status has its own operation).
      security:
        - sessionCookie: []
      x-roles: [registrar]
      x-audit: {event_type: operator_updated, entity_type: operator, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryOperatorPatch"
      responses:
        "200":
          description: The operator after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryOperator"
        default:
          $ref: "#/components/responses/Problem"
  /v1/registry/operators/{operator_id}/status:
    parameters:
      - {name: operator_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: setRegistryOperatorStatus
      tags: [registry]
      summary: Suspend, reinstate or revoke an operator
      description: |
        The allowed transitions: active to suspended or revoked,
        suspended to active or revoked, expired to active (a renewal,
        once `valid_until` is in the future) or revoked; revoked is
        final; expired is set by the expiry job only. A suspension or a
        revocation needs a reason. Each change is an events row and an
        entry of the F8 change feed.
      security:
        - sessionCookie: []
      x-roles: [registrar]
      x-audit: {event_type: registry_status_changed, entity_type: operator, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryStatusInput"
      responses:
        "200":
          description: The operator after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryOperator"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/registry/operators/{operator_id}/personal-data:
    parameters:
      - {name: operator_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    get:
      operationId: getRegistryOperatorPersonalData
      tags: [registry]
      summary: An operator's personal data (purpose required, audited)
      description: |
        Refused without `purpose`. Every read is a `registry_pii_viewed`
        event with the purpose, written before the data is returned.
      security:
        - sessionCookie: []
      x-roles: [registrar, inspector]
      x-audit: {event_type: registry_pii_viewed, entity_type: operator, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200":
          description: The personal data.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryOperatorPersonalData"
        default:
          $ref: "#/components/responses/Problem"
  /v1/registry/uas:
    get:
      operationId: listRegistryUAS
      tags: [registry]
      summary: UAS, in id order
      description: |
        `serial` looks an aircraft up by serial: the ASCII-folded key
        (uspace-core `serial.FoldKey`, G-05, G-12), which the registry
        keeps unique.
      security:
        - sessionCookie: []
      x-roles: [registrar, inspector, viewer]
      x-audit: none
      parameters:
        - {name: serial, in: query, schema: {type: string, maxLength: 64}}
        - {name: operator_id, in: query, schema: {type: string, maxLength: 32}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/RegistryStatus"}}
        - {name: after, in: query, schema: {type: string, maxLength: 32}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: One page of aircraft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryUASList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRegistryUAS
      tags: [registry]
      summary: Register a UAS
      description: |
        The serial is kept as given, trimmed (G-05), and validated for
        its class by uspace-core `serial.ValidateForClass` (C1, C2, C3,
        C5 and C6 need an ANSI/CTA-2063-A serial, G-06). 409 when the
        serial is registered already, or when another aircraft's serial
        differs from it only by case (a lookup of either would be
        ambiguous).
      security:
        - sessionCookie: []
      x-roles: [registrar]
      x-audit: {event_type: uas_registered, entity_type: uas, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryUASInput"
      responses:
        "201":
          description: The registered aircraft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryUAS"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/registry/uas/{uas_id}:
    parameters:
      - {name: uas_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    get:
      operationId: getRegistryUAS
      tags: [registry]
      summary: One UAS
      security:
        - sessionCookie: []
      x-roles: [registrar, inspector, viewer]
      x-audit: none
      responses:
        "200":
          description: The aircraft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryUAS"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRegistryUAS
      tags: [registry]
      summary: Change an aircraft's details
      description: The serial and the operator are not changed here; a class change re-validates the serial.
      security:
        - sessionCookie: []
      x-roles: [registrar]
      x-audit: {event_type: uas_updated, entity_type: uas, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryUASPatch"
      responses:
        "200":
          description: The aircraft after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryUAS"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/registry/uas/{uas_id}/status:
    parameters:
      - {name: uas_id, in: path, required: true, schema: {type: string, maxLength: 32}}
    post:
      operationId: setRegistryUASStatus
      tags: [registry]
      summary: Suspend, reinstate or revoke a UAS
      description: The transitions of setRegistryOperatorStatus.
      security:
        - sessionCookie: []
      x-roles: [registrar]
      x-audit: {event_type: registry_status_changed, entity_type: uas, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryStatusInput"
      responses:
        "200":
          description: The aircraft after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryUAS"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/registry/pilots:
    get:
      operationId: listRegistryPilots
