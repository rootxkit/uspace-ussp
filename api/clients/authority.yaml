            application/json:
              schema:
                $ref: "#/components/schemas/RegistryChangePage"
        "304":
          description: Nothing changed since the page the ETag names.
          headers:
            ETag:
              schema: {type: string}
        default:
          $ref: "#/components/responses/Problem"

  # WP-7: the Remote ID receiver registry (admin), the two receiver
  # endpoints (config and heartbeat, served by api), the observation
  # ingest (served by rid-ingest) and the raw frames (spec 02 F9, 06 §2
  # T2). A receiver authenticates with its bearer key (receiverKey) and,
  # on every request with a body, an HMAC-SHA256 of the exact body bytes
  # under a separate secret in X-Report-Signature (64 lower-case hex
  # characters); the body carries sent_at_ms (30 s window) and a nonce
  # never repeated within 60 s. The three receiver operations carry
  # `x-receiver: true`: they are excluded from the generated server
  # (api/oapi-codegen.yaml) because the signature covers the raw body,
  # which a generated handler has already decoded, and are served by
  # internal/receivers. A disabled receiver is refused with 503 and
  # Retry-After, never 401 or 403, which receivers treat as fatal
  # (LESSONS B-10). docs/runbooks/receivers.md is the signing contract.
  /v1/rid/receivers:
    get:
      operationId: listRIDReceivers
      tags: [rid-receivers]
      summary: Remote ID receivers, in id order
      description: No key material, ever; the key generation and the end of the previous key's grace only.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      parameters:
        - {name: after, in: query, description: The next_after of the previous page., schema: {type: string, maxLength: 63}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: One page of receivers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRIDReceiver
      tags: [rid-receivers]
      summary: Register a receiver; its keys are shown once
      description: |
        Generates the bearer key (stored as an argon2id hash only) and
        the 32-byte HMAC secret (stored sealed with the PII key) and
        returns both in this response and never again. The key set
        reaches rid-ingest through the KV bucket `rid_receiver_keys`,
        written inside the same transaction: when the bucket cannot
        take it the registration is refused with 503
        `key_store_unavailable` and nothing is recorded. 409 when the
        id exists.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_created, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDReceiverInput"
      responses:
        "201":
          description: The receiver and its credentials, shown once.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverCreated"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    get:
      operationId: getRIDReceiver
      tags: [rid-receivers]
      summary: One receiver, with its last heartbeat and position deviation
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The receiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiver"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRIDReceiver
      tags: [rid-receivers]
      summary: Change a receiver's name, pinned position, owner or configuration
      description: The id, the keys and the status are changed by their own operations.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_updated, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDReceiverPatch"
      responses:
        "200":
          description: The receiver after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiver"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRIDReceiver
      tags: [rid-receivers]
      summary: Delete a receiver and revoke its keys
      description: |
        The row and its key-set entry go; its stored observations stay.
        A later request with its keys is an unknown receiver (401).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_deleted, entity_type: rid_receiver, purpose: none}
      parameters:
        - {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}
      responses:
        "204":
          description: Deleted.
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/status:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    post:
      operationId: setRIDReceiverStatus
      tags: [rid-receivers]
      summary: Disable or enable a receiver
      description: |
        A disabled receiver's observations are refused with 503 and
        Retry-After and counted (B-10); its status says who disabled it
        and why (B-11). A reason is required either way. rid-ingest
        follows the change within a second (KV watch).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_status_changed, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDReceiverStatusInput"
      responses:
        "200":
          description: The receiver after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiver"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/keys/rotate:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    post:
      operationId: rotateRIDReceiverKeys
      tags: [rid-receivers]
      summary: Issue a new bearer key and HMAC secret; shown once
      description: |
        The previous generation keeps working until `grace_s` has
        passed (default RID_KEY_ROTATION_GRACE_S), so a receiver can be
        re-flashed without a gap; a generation older than that is
        revoked at once. `grace_s: 0` revokes the previous keys now (a
        captured receiver).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_keys_rotated, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDKeyRotationInput"
      responses:
        "200":
          description: The new credentials, shown once.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverCreated"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/config:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    get:
      operationId: getRIDReceiverConfig
      tags: [rid-receivers]
      summary: The receiver's own configuration (receiver key)
      description: |
        For the receiver whose bearer key is presented; another
        receiver's id is 401. Served also while the receiver is
        disabled, with its status, so it can say so.
      security:
        - receiverKey: []
      x-receiver: true
      x-audit: none
      responses:
        "200":
          description: The configuration and the limits of the ingest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverConfigView"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/heartbeat:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    post:
      operationId: postRIDReceiverHeartbeat
      tags: [rid-receivers]
      summary: Receiver heartbeat every 10 s (receiver key and body HMAC)
      description: |
        Records when the receiver was last seen (api's clock), the
        position it reports and its firmware. A position farther from
        the pinned one than the receiver's `position_tolerance_m` is
        counted and shown (T2), and its start is an events row. The
        body is signed like an observation batch (X-Report-Signature,
        sent_at_ms, nonce). Accepted also while disabled.
      security:
        - receiverKey: []
      x-receiver: true
      x-audit: {event_type: rid_receiver_position_deviation, entity_type: rid_receiver, purpose: none}
      parameters:
        - {name: X-Report-Signature, in: header, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDHeartbeat"
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDHeartbeatAck"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/observations:
    post:
      operationId: postRIDObservations
      tags: [rid-ingest]
      summary: A signed batch of Remote ID observations (rid-ingest)
      description: |
        Served by rid-ingest. `rid/observation/v1` (schemas/rid/observation/v1.json):
        at most 64 observations and 65536 bytes, about one second of
        reception. 202 only after the batch is written to the JetStream
        work queue (B-05); observations already accepted from this
        receiver within 60 s (same transmitter, rx_ts and payload) are
        counted as duplicates and not queued again. Refusals: 401
        `unauthenticated` (no or unknown bearer key), 401 `signature`
        (unsigned, unknown receiver, wrong signature), 401 `skew`
        (sent_at_ms more than 30 s from the ingest's clock), 409
        `replay` (nonce seen before), 400 `validation`, 413
        `body_too_large`, 503 `source_disabled`, `queue_full` or
        `queue_unavailable` with Retry-After. Never 403.
      security:
        - receiverKey: []
      x-receiver: true
      x-audit: none
      parameters:
        - {name: X-Report-Signature, in: header, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDObservationBatch"
      responses:
        "202":
          description: Written to the work queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDObservationAck"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          description: Disabled, or the queue cannot take the batch now; retry after the given seconds.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/frames:
    get:
      operationId: listRIDFrames
      tags: [rid-frames]
      summary: Raw Remote ID frames in a time window (purpose required, audited)
      description: |
        Read-only from `rid_observations`, by ingest time in [from, to).
        A window longer than 24 h is refused, never thinned (B-13); a
        page holds at most `limit` frames and says `truncated` when the
        window holds more (narrow it, or start the next window at the
        last `ingest_ts`). Every read is an events row with its purpose.
      security:
        - sessionCookie: []
      x-roles: [incident_officer, inspector]
      x-audit: {event_type: rid_frames_viewed, entity_type: rid_observations, purpose: required}
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: transmitter, in: query, schema: {type: string, maxLength: 64}}
        - {name: receiver_id, in: query, schema: {type: string, maxLength: 63}}
        - {name: purpose, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
      responses:
        "200":
          description: The frames, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDFramePage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/frames/{frame_id}:
    parameters:
      - {name: frame_id, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{32}$"}}
    get:
      operationId: getRIDFrame
      tags: [rid-frames]
      summary: Every stored row of one frame id (purpose required, audited)
      security:
        - sessionCookie: []
      x-roles: [incident_officer, inspector]
      x-audit: {event_type: rid_frames_viewed, entity_type: rid_observations, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200":
          description: The rows of the frame.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDFramePage"
        default:
          $ref: "#/components/responses/Problem"

  # WP-10: the cell3 -> detect worker ownership map.
  /v1/cells:
    get:
      operationId: getCellOwnership
      tags: [cells]
      summary: The cell3 -> detect worker ownership map
      description: |
        Read from KV bucket `cells`, where detect workers read it. A
        worker judges the cells the map gives it and refuses to start
        with none unless `CELLS=all` (05 §3). 404 when no map has been
        written yet.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellOwnership"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putCellOwnership
      tags: [cells]
      summary: Replace the ownership map (an operator's rebalance)
      description: |
        Writes the whole map with the next version into KV bucket
        `cells`, inside the transaction of its `events` row: when the
        bucket cannot take it the change is refused with 503
        `cell_store_unavailable` and nothing is recorded. A map past the
        bucket's value bound is refused with 400 naming the bound.
        Workers take a new map at their next start.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: cell_ownership_changed, entity_type: cells, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellOwnershipInput"
      responses:
        "200":
          description: The map as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellOwnership"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-10: source control (U-15).
  /v1/sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: Every switch and every source with its switch and its health
      description: |
        The switches as the database holds them (the state api
        publishes), and every source a switch names or an adapter has
        reported on `src.v1.<type>.<instance>`: enabled or disabled (by
        type, instance or default deny, and by whom), and healthy,
        stale, lagging or never heard (B-11, B-03). `status_age_s` is
        the age of the adapter's last status; past
        `SOURCE_STATUS_STALE_S` the source is stale whatever it said.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The switches and the sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceOverview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sources/{source_type}:
    parameters:
      - {name: source_type, in: path, required: true, schema: {$ref: "#/components/schemas/SourceType"}}
    put:
      operationId: switchSourceType
      tags: [sources]
      summary: Switch a whole source type on or off
      description: |
        A type switched off disables every instance of it, even one
        switched on. In one transaction under the advisory lock
        `source_controls`: the row, its `events` row, then the KV write
        of the whole state (bucket `source_control`, key `state`); when
        the bucket cannot take it the switch is refused with 503
        `source_control_unavailable` and nothing is written (B-09). The
        state is then pushed on `ctl.sources`; adapters refuse a
        disabled source with 503 and Retry-After (B-10). A state past
        the bucket's value bound is refused with 400 naming the bound
        (E-10). A switch to the state already held changes and records
        nothing (`changed: false`).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: source_disabled, entity_type: source, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSwitchInput"
      responses:
        "200":
          description: The switch as stored and the state's version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSwitchResult"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sources/{source_type}/{instance_id}:
    parameters:
      - {name: source_type, in: path, required: true, schema: {$ref: "#/components/schemas/SourceType"}}
      - {name: instance_id, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$"}}
    put:
      operationId: switchSourceInstance
      tags: [sources]
      summary: Switch one instance (a receiver, a USSP, a feed) on or off
      description: |
        As for a type. An instance switched off stays off under a type
        that is on; an instance switched on overrides default deny but
        not a type that is off.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: source_disabled, entity_type: source, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSwitchInput"
      responses:
        "200":
          description: The switch as stored and the state's version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSwitchResult"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: uspace_session
      description: |
        Console session (decision M20): a JWT with `scope = "session"`,
        `roles[]`, `realm` (`console` or `police`), `jti`, `aud` = this
        system's host, set by the web BFF. State-changing requests also
        carry `X-CSRF-Token` matching the `uspace_csrf` cookie (M21).
    ecosystemToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Ecosystem machine token issued by a trusted issuer (RS256,
        `aud` = this system's host, scope from the catalogue in
        `docs/WORKPACKAGES/WP-2.md`), verified by uspace-core `auth`.
        Table B, the whole catalogue: `cis.read`, `cis.publish:zones`,
        `cis.publish:uspace`, `cis.publish:ussp_list`,
        `cis.publish:restrictions`, `cis.publish:ats_data` (reserved,
        never issued), `registry.validate`, `ussp.records`,
        `occurrences.write`, `certificates.status`, `police.query`,
        `ansp.traffic`, `ansp.coordination`, `ansp.requests`,
        `dp.observe` (lab-01 only), `utm.strategic_coordination`,
        `utm.constraint_processing`, `utm.constraint_management`,
        `utm.conformance_monitoring_sa`, `utm.availability_arbitration`,
        `rid.service_provider`, `rid.display_provider`, and at a USSP's
        issuer only `ussp.intents`, `ussp.telemetry`, `ussp.traffic`,
        `ussp.geo`.
    receiverKey:
      type: http
      scheme: bearer
      description: |
        Per-receiver bearer key of a Remote ID receiver, together with
        an HMAC-SHA256 of the exact body bytes under a separate secret
        (WP-7). Not a JWT and not a scope.

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The budget of this client address or account is spent.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OAuthError:
      description: A refused token request (RFC 6749 §5.2 inside a problem).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OAuthProblem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: Check name to its state; an error names the cause.
          additionalProperties:
            $ref: "#/components/schemas/Check"
    Check:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    FieldProblem:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: JSON path or parameter name, as core.FieldError writes it.
        reason:
          type: string
          minLength: 1
    Problem:
      type: object
      description: |
        RFC 9457 problem details with the field-error extension of
        decision M28; the shape of uspace-lab `schemas/common/problem/v1`.
        `errors` is capped at 100 entries; `truncated` is true when it
        was cut.
      required: [type, title, status, errors]
      properties:
        type:
          type: string
          pattern: "^https://schemas\\.uspace\\.ge/problems/[a-z_]+$"
          description: "`https://schemas.uspace.ge/problems/<slug>`, slug = the counter or refusal name."
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldProblem"
        truncated:
          type: boolean
    Severity:
      type: string
      enum: [info, warning, critical]
    PolicyInput:
      type: object
      description: |
        The thresholds of one policy version. Units are in the names;
        every number is finite and positive (E-15). The defaults named
        below are those of version 1, the predecessor's values.
      required:
        - height_limit_agl_m
        - pressure_uncertainty_m
        - zone_conditional_severity
        - mismatch_severity
        - identification_severity
        - spoof_distance_m
        - identity_ttl_s
        - max_gap_s
        - identify_within_s
        - broadcast_tolerance_s
        - max_latency_s
        - live_max_age_s
        - clear_after_s
        - stale_after_s
        - dp_view_diagonal_km
        - dp_poll_hz
        - cis_stale_bound_s
        - height_limit_in_uspace
      properties:
        height_limit_agl_m: {type: number, format: double, description: "Height limit over the ground (default 120)."}
        pressure_uncertainty_m: {type: number, format: double, description: "Pressure-altitude margin (default 250)."}
        zone_conditional_severity: {$ref: "#/components/schemas/Severity"}
        mismatch_severity: {$ref: "#/components/schemas/Severity"}
        identification_severity: {$ref: "#/components/schemas/Severity"}
        spoof_distance_m: {type: number, format: double, description: "Default 300."}
        identity_ttl_s: {type: number, format: double, description: "Default 15."}
        max_gap_s: {type: number, format: double, description: "Default 3."}
        identify_within_s: {type: number, format: double, description: "Default 4."}
        broadcast_tolerance_s: {type: number, format: double, description: "Default 1."}
        max_latency_s: {type: number, format: double, description: "Default 5."}
        live_max_age_s: {type: number, format: double, description: "Default 10."}
        clear_after_s: {type: number, format: double, description: "Default 3."}
        stale_after_s: {type: number, format: double, description: "Default 15."}
        dp_view_diagonal_km: {type: number, format: double, description: "Default 7."}
        dp_poll_hz: {type: number, format: double, description: "Default 1."}
        cis_stale_bound_s: {type: number, format: double, description: "Default 300."}
        height_limit_in_uspace:
          type: string
          enum: [evaluate, skip_when_authorised]
        registration_number_pattern:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            The operator registration-number format the registry
            validates against (uspace-core regnum, G-07; the Georgian
            format is open, spec Q5). Default the EU shape
            `^[A-Z]{3}[A-Za-z0-9]{8,16}$`.
        note:
          type: string
          maxLength: 1000
    Policy:
      allOf:
        - $ref: "#/components/schemas/PolicyInput"
        - type: object
          required: [version, active, created_at, created_by, note, registration_number_pattern]
          properties:
            version:
              type: integer
              format: int64
              description: The policy_version every violation carries.
            active:
              type: boolean
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
            activated_at:
              type: string
              format: date-time
            activated_by:
              type: string
    AuditEvent:
      type: object
      required: [id, ts, actor_type, actor_id, entity_type, event_type, payload, prev_hash, hash]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, client, receiver, system]
        actor_id:
          type: string
        realm:
          type: string
        purpose:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        prev_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    AuditEventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_before_id:
          type: integer
          format: int64
          description: Pass as before_id for the next page; absent on the last page.
    OAuthProblem:
      description: |
        A problem (M28) that also carries the RFC 6749 §5.2 members, so
        an OAuth2 client library reads `error` and a uspace client reads
        the problem. `error` is `invalid_request`, `invalid_client`,
        `invalid_scope`, `invalid_target` (RFC 8707),
        `unauthorized_client`, `unsupported_grant_type` or
        `temporarily_unavailable` (rate limit).
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [invalid_request, invalid_client, invalid_scope, invalid_target, unauthorized_client, unsupported_grant_type, temporarily_unavailable]
            error_description:
              type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: {type: string}
        client_id: {type: string}
        client_secret: {type: string}
        client_assertion_type: {type: string}
        client_assertion: {type: string}
        scope: {type: string, description: "Space-separated catalogue scopes (WP-2 table B)."}
        audience: {type: string, description: "The target's host or base URL; its host becomes aud (M18)."}
        resource:
          type: array
          description: RFC 8707 resource indicator (one), an alternative to audience.
          items: {type: string}
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, description: Seconds until exp (at most 3600).}
        scope: {type: string}
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
    IssuerMetadata:
      type: object
      required: [issuer, jwks_uri, token_endpoint, grant_types_supported, token_endpoint_auth_methods_supported, token_endpoint_auth_signing_alg_values_supported, scopes_supported]
      properties:
        issuer: {type: string}
        jwks_uri: {type: string}
        token_endpoint: {type: string}
        grant_types_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_methods_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
    OAuthClientStatus:
      type: string
      enum: [active, suspended, revoked]
    OAuthAuthMethod:
      type: string
      enum: [client_secret_post, private_key_jwt]
    OAuthClientInput:
      type: object
      required: [client_id, scopes, auth_method]
      properties:
        client_id:
          type: string
          maxLength: 64
          description: "authority-01, cisp-01, ansp-01, ussp-<code>-01 or lab-01 (M24)."
        scopes:
          type: array
          maxItems: 32
          items: {type: string}
        audiences:
          type: array
          maxItems: 32
          description: Hosts this client may name for national scopes.
          items: {type: string}
        auth_method:
          $ref: "#/components/schemas/OAuthAuthMethod"
        jwks:
          $ref: "#/components/schemas/JWKS"
        mtls_subject: {type: string, maxLength: 512}
        certificate_id: {type: string, maxLength: 64}
        note: {type: string, maxLength: 1000}
    OAuthClientPatch:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OAuthClientStatus"
        scopes:
          type: array
          maxItems: 32
          items: {type: string}
        audiences:
          type: array
          maxItems: 32
          items: {type: string}
        note: {type: string, maxLength: 1000}
    OAuthClient:
      type: object
      required: [client_id, system, scopes, audiences, auth_method, status, note, created_at, created_by, updated_at, updated_by]
      properties:
        client_id: {type: string}
        system: {type: string, enum: [authority, cisp, ansp, ussp, lab]}
        scopes:
          type: array
          items: {type: string}
        audiences:
          type: array
          items: {type: string}
        auth_method:
          $ref: "#/components/schemas/OAuthAuthMethod"
        jwks:
          $ref: "#/components/schemas/JWKS"
        mtls_subject: {type: string}
        certificate_id: {type: string}
        status:
          $ref: "#/components/schemas/OAuthClientStatus"
        note: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    OAuthClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClient"
    OAuthClientCreated:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/OAuthClient"
        client_secret:
          type: string
          description: The client_secret_post secret; shown here once and never again.
    SigningKey:
      type: object
      required: [kid, purpose, state, registered_at]
      properties:
        kid: {type: string}
        purpose: {type: string, enum: [token, publication]}
        state:
          type: string
          enum: [candidate, requested, active, retiring, retired, compromised]
          description: "retiring: retired but still in the JWKS; retired: no longer published."
        registered_at: {type: string, format: date-time}
        active_from: {type: string, format: date-time}
        retired_at: {type: string, format: date-time}
        requested_by: {type: string}
        requested_at: {type: string, format: date-time}
        compromised_at: {type: string, format: date-time}
        compromised_by: {type: string}
        compromise_reason: {type: string}
    SigningKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SigningKey"
    KeyRotation:
      type: object
      required: [state, kid, active_kid]
      properties:
        state: {type: string, enum: [requested, activated]}
        kid: {type: string, description: The key requested or activated.}
        active_kid: {type: string, description: The key that signs after this call.}
        previous_kid: {type: string}
        requested_by: {type: string}
        confirm_before: {type: string, format: date-time}
    Role:
      type: string
      enum: [viewer, inspector, registrar, incident_officer, admin, auditor]
    Realm:
      type: string
      enum: [console, police]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 256}
        password: {type: string, maxLength: 1024}
    LoginChallenge:
      type: object
      required: [mfa_token, expires_at]
      properties:
        mfa_token: {type: string, description: Single use; present it to /v1/auth/mfa.}
        expires_at: {type: string, format: date-time}
        enrolment:
          $ref: "#/components/schemas/MFAEnrolment"
    MFAEnrolment:
      type: object
      description: Present only while the account has no confirmed TOTP.
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string, description: Base32 TOTP secret (RFC 6238, SHA-1, 6 digits, 30 s).}
        otpauth_uri: {type: string}
    MFARequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token: {type: string, maxLength: 256}
        code: {type: string, maxLength: 16, description: The current TOTP code.}
        recovery_code: {type: string, maxLength: 64, description: One unused recovery code, instead of a TOTP code.}
    SessionInfo:
      type: object
      required: [sub, roles, realm, jti, expires_at, idle_expires_at]
      properties:
        sub: {type: string, description: The account id.}
        roles:
          type: array
          items: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        jti: {type: string, description: The session id.}
        expires_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
    SessionIssued:
      type: object
      required: [token, token_type, expires_at, idle_timeout_s, session]
      properties:
        token: {type: string, description: "The session JWT (table A): the BFF puts it in the uspace_session cookie."}
        token_type: {type: string, enum: [Bearer]}
        expires_at: {type: string, format: date-time}
        idle_timeout_s: {type: integer}
        session:
          $ref: "#/components/schemas/SessionInfo"
        recovery_codes:
          type: array
          description: Shown once, at the sign-in that confirms enrolment.
          items: {type: string}
    UserInput:
      type: object
      required: [username, password, roles, realm]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, maxLength: 1024}
        display_name: {type: string, maxLength: 200}
        roles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/Role"
        realm:
          $ref: "#/components/schemas/Realm"
    RolesInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/Role"
    User:
      type: object
      required: [id, username, display_name, roles, realm, status, mfa_enrolled, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        roles:
          type: array
          items: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        status: {type: string, enum: [active, disabled]}
        mfa_enrolled: {type: boolean}
        mfa_failures: {type: integer, description: Consecutive wrong MFA codes.}
        mfa_locked_until: {type: string, format: date-time, description: MFA refused until then.}
        mfa_hard_locked: {type: boolean, description: MFA refused until an admin unlocks the account.}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked: {type: integer}
    # WP-3: the registry. Records (RegistryOperator, RegistryUAS,
    # RegistryPilot) and every F8 schema carry no personal data;
    # internal/registry's contract test fails if a personal property
    # name appears in them, and checks that the personal-data schemas
    # do carry them (E-01).
    RegistryStatus:
      type: string
      enum: [active, suspended, revoked, expired]
    RegistryStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, revoked]
          description: expired is set by the expiry job only.
        reason:
          type: string
          maxLength: 500
          description: Required for suspended and revoked.
    RegistrySource:
      type: string
      enum: [portal, uas_gov_ge_import, manual]
    OperatorType:
      type: string
      enum: [natural, legal]
    RegistryOperatorInput:
      type: object
      description: |
        The 2019/947 Art. 14(2) field set. A natural person gives
        full_name and date_of_birth; a legal person legal_name and
        legal_identification_number.
      required: [operator_type, registration_number, postal_address, contact_email, contact_phone, valid_until]
      properties:
        operator_type: {$ref: "#/components/schemas/OperatorType"}
        registration_number: {type: string, maxLength: 64, description: "The public part only, under the policy's registration_number_pattern."}
        secret_part: {type: string, minLength: 3, maxLength: 3, description: "The three secret characters the authority issued; stored as a keyed hash, never returned."}
        full_name: {type: string, maxLength: 200}
        legal_name: {type: string, maxLength: 200}
        date_of_birth: {type: string, format: date}
        legal_identification_number: {type: string, maxLength: 64}
        postal_address: {type: string, maxLength: 500}
        contact_email: {type: string, maxLength: 254}
        contact_phone: {type: string, maxLength: 32}
        insurance_policy_number: {type: string, maxLength: 64}
        competency_confirmation: {type: boolean, description: "The Art. 14(2)(e) statement of a legal person."}
        authorisations:
          type: array
          maxItems: 100
          description: Operational authorisations, LUCs and declarations with their confirmations (Art. 14(2)(f)).
          items: {type: object, additionalProperties: true}
        valid_from: {type: string, format: date-time, description: Default now.}
        valid_until: {type: string, format: date-time}
        source: {$ref: "#/components/schemas/RegistrySource"}
    RegistryOperatorPatch:
      type: object
      properties:
        full_name: {type: string, maxLength: 200}
        legal_name: {type: string, maxLength: 200}
        date_of_birth: {type: string, format: date}
        legal_identification_number: {type: string, maxLength: 64}
        postal_address: {type: string, maxLength: 500}
        contact_email: {type: string, maxLength: 254}
        contact_phone: {type: string, maxLength: 32}
        insurance_policy_number: {type: string, maxLength: 64}
        competency_confirmation: {type: boolean}
        authorisations:
          type: array
          maxItems: 100
          items: {type: object, additionalProperties: true}
        valid_until: {type: string, format: date-time}
    RegistryOperator:
      type: object
      description: An operator without personal data.
      required: [id, operator_type, registration_number, has_secret_part, competency_confirmation, authorisations, status, status_reason, valid_from, valid_until, source, registry_version, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        operator_type: {$ref: "#/components/schemas/OperatorType"}
        registration_number: {type: string, description: The public part as registered.}
        has_secret_part: {type: boolean}
        competency_confirmation: {type: boolean}
        authorisations:
          type: array
          items: {type: object, additionalProperties: true}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        status_reason: {type: string}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        source: {$ref: "#/components/schemas/RegistrySource"}
        registry_version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    RegistryOperatorList:
      type: object
      required: [operators]
      properties:
        operators:
          type: array
          items: {$ref: "#/components/schemas/RegistryOperator"}
        next_after: {type: string, description: Pass as after for the next page; absent on the last page.}
    RegistryOperatorPersonalData:
      type: object
      required: [operator_id, postal_address, contact_email, contact_phone]
      properties:
        operator_id: {type: string}
        full_name: {type: string}
        legal_name: {type: string}
        date_of_birth: {type: string, format: date}
        legal_identification_number: {type: string}
        postal_address: {type: string}
        contact_email: {type: string}
        contact_phone: {type: string}
        insurance_policy_number: {type: string}
    ClassLabel:
