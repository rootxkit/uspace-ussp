      properties:
        operator_id: {type: string}
        operator_type: {type: string}
        full_name: {type: string}
        legal_name: {type: string}
        postal_address: {type: string}
        contact_email: {type: string}
        contact_phone: {type: string}
    PolicePosition:
      type: object
      required: [at, lat_deg, lon_deg, alt_source]
      properties:
        at: {type: string, format: date-time}
        lat_deg: {type: number, format: double}
        lon_deg: {type: number, format: double}
        alt_amsl_m: {type: number, format: double}
        alt_source: {type: string}
        height_m: {type: number, format: double}
        height_ref: {type: string}
        speed_ms: {type: number, format: double}
        track_deg: {type: number, format: double}
    PoliceAircraft:
      type: object
      required: [track_id, identification_status, identification_basis, trust, source, first_seen, last_seen, emergency, positions, positions_truncated]
      properties:
        track_id: {type: string}
        serial: {type: string}
        registration_number: {type: string, description: "The operator registration's public part as identified (the registry's when matched)."}
        identification_status: {type: string, enum: [registered, suspended, unknown_operator, unidentified]}
        identification_reason: {type: string}
        identification_basis: {type: string}
        trust: {type: string}
        source: {type: string}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        emergency: {type: boolean}
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PolicePosition"
        positions_truncated: {type: boolean}
        operator:
          $ref: "#/components/schemas/PoliceOperatorIdentity"
        operator_unresolved: {type: string, description: "Why a personal-data purpose found no identity for this aircraft (not identified, not in the registry, ambiguous)."}
