  # WP-7: the Remote ID receiver registry (admin), the two receiver
  # endpoints (config and heartbeat, served by api), the observation
  # ingest (served by rid-ingest) and the raw frames (spec 02 F9, 06 §2
  # T2). A receiver authenticates with its bearer key (receiverKey) and,
  # on every request with a body, an HMAC-SHA256 of the exact body bytes
  # under a separate secret in X-Report-Signature (64 lower-case hex
  # characters); the body carries sent_at_ms (30 s window) and a nonce
  # never repeated within 60 s. The three receiver operations carry
  # `x-receiver: true`: they are excluded from the generated server
  # (api/oapi-codegen.yaml) because the signature covers the raw body,
  # which a generated handler has already decoded, and are served by
  # internal/receivers. A disabled receiver is refused with 503 and
  # Retry-After, never 401 or 403, which receivers treat as fatal
  # (LESSONS B-10). docs/runbooks/receivers.md is the signing contract.
  /v1/rid/receivers:
    get:
      operationId: listRIDReceivers
      tags: [rid-receivers]
      summary: Remote ID receivers, in id order
      description: No key material, ever; the key generation and the end of the previous key's grace only.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      parameters:
        - {name: after, in: query, description: The next_after of the previous page., schema: {type: string, maxLength: 63}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: One page of receivers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRIDReceiver
      tags: [rid-receivers]
      summary: Register a receiver; its keys are shown once
      description: |
        Generates the bearer key (stored as an argon2id hash only) and
        the 32-byte HMAC secret (stored sealed with the PII key) and
        returns both in this response and never again. The key set
        reaches rid-ingest through the KV bucket `rid_receiver_keys`,
        written inside the same transaction: when the bucket cannot
        take it the registration is refused with 503
        `key_store_unavailable` and nothing is recorded. 409 when the
        id exists.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_created, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDReceiverInput"
      responses:
        "201":
          description: The receiver and its credentials, shown once.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverCreated"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    get:
      operationId: getRIDReceiver
      tags: [rid-receivers]
      summary: One receiver, with its last heartbeat and position deviation
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The receiver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiver"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRIDReceiver
      tags: [rid-receivers]
      summary: Change a receiver's name, pinned position, owner or configuration
      description: The id, the keys and the status are changed by their own operations.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_updated, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDReceiverPatch"
      responses:
        "200":
          description: The receiver after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiver"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRIDReceiver
      tags: [rid-receivers]
      summary: Delete a receiver and revoke its keys
      description: |
        The row and its key-set entry go; its stored observations stay.
        A later request with its keys is an unknown receiver (401).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_deleted, entity_type: rid_receiver, purpose: none}
      parameters:
        - {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}}
      responses:
        "204":
          description: Deleted.
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/status:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    post:
      operationId: setRIDReceiverStatus
      tags: [rid-receivers]
      summary: Disable or enable a receiver
      description: |
        A disabled receiver's observations are refused with 503 and
        Retry-After and counted (B-10); its status says who disabled it
        and why (B-11). A reason is required either way. rid-ingest
        follows the change within a second (KV watch).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_status_changed, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDReceiverStatusInput"
      responses:
        "200":
          description: The receiver after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiver"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/keys/rotate:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    post:
      operationId: rotateRIDReceiverKeys
      tags: [rid-receivers]
      summary: Issue a new bearer key and HMAC secret; shown once
      description: |
        The previous generation keeps working until `grace_s` has
        passed (default RID_KEY_ROTATION_GRACE_S), so a receiver can be
        re-flashed without a gap; a generation older than that is
        revoked at once. `grace_s: 0` revokes the previous keys now (a
        captured receiver).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: rid_receiver_keys_rotated, entity_type: rid_receiver, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDKeyRotationInput"
      responses:
        "200":
          description: The new credentials, shown once.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverCreated"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/config:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    get:
      operationId: getRIDReceiverConfig
      tags: [rid-receivers]
      summary: The receiver's own configuration (receiver key)
      description: |
        For the receiver whose bearer key is presented; another
        receiver's id is 401. Served also while the receiver is
        disabled, with its status, so it can say so.
      security:
        - receiverKey: []
      x-receiver: true
      x-audit: none
      responses:
        "200":
          description: The configuration and the limits of the ingest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDReceiverConfigView"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/receivers/{receiver_id}/heartbeat:
    parameters:
      - {name: receiver_id, in: path, required: true, schema: {type: string, maxLength: 63}}
    post:
      operationId: postRIDReceiverHeartbeat
      tags: [rid-receivers]
      summary: Receiver heartbeat every 10 s (receiver key and body HMAC)
      description: |
        Records when the receiver was last seen (api's clock), the
        position it reports and its firmware. A position farther from
        the pinned one than the receiver's `position_tolerance_m` is
        counted and shown (T2), and its start is an events row. The
        body is signed like an observation batch (X-Report-Signature,
        sent_at_ms, nonce). Accepted also while disabled.
      security:
        - receiverKey: []
      x-receiver: true
      x-audit: {event_type: rid_receiver_position_deviation, entity_type: rid_receiver, purpose: none}
      parameters:
        - {name: X-Report-Signature, in: header, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDHeartbeat"
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDHeartbeatAck"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/observations:
    post:
      operationId: postRIDObservations
      tags: [rid-ingest]
      summary: A signed batch of Remote ID observations (rid-ingest)
      description: |
        Served by rid-ingest. `rid/observation/v1` (schemas/rid/observation/v1.json):
        at most 64 observations and 65536 bytes, about one second of
        reception. 202 only after the batch is written to the JetStream
        work queue (B-05); observations already accepted from this
        receiver within 60 s (same transmitter, rx_ts and payload) are
        counted as duplicates and not queued again. Refusals: 401
        `unauthenticated` (no or unknown bearer key), 401 `signature`
        (unsigned, unknown receiver, wrong signature), 401 `skew`
        (sent_at_ms more than 30 s from the ingest's clock), 409
        `replay` (nonce seen before), 400 `validation`, 400
        `lab_header` (the batch carries `X-Lab-Scenario`, which only the
        lab's simulated receivers set, and this ingest runs with
        `LAB_HEADERS_ALLOWED=false`, the default: spec 06 T11), 413
        `body_too_large`, 503 `source_disabled`, `queue_full` or
        `queue_unavailable` with Retry-After. Never 403.
      security:
        - receiverKey: []
      x-receiver: true
      x-audit: none
      parameters:
        - {name: X-Report-Signature, in: header, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RIDObservationBatch"
      responses:
        "202":
          description: Written to the work queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDObservationAck"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          description: Disabled, or the queue cannot take the batch now; retry after the given seconds.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/frames:
    get:
      operationId: listRIDFrames
      tags: [rid-frames]
      summary: Raw Remote ID frames in a time window (purpose required, audited)
      description: |
        Read-only from `rid_observations`, by ingest time in [from, to).
        A window longer than 24 h is refused, never thinned (B-13); a
        page holds at most `limit` frames and says `truncated` when the
        window holds more (narrow it, or start the next window at the
        last `ingest_ts`). Every read is an events row with its purpose.
      security:
        - sessionCookie: []
      x-roles: [incident_officer, inspector]
      x-audit: {event_type: rid_frames_viewed, entity_type: rid_observations, purpose: required}
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: transmitter, in: query, schema: {type: string, maxLength: 64}}
        - {name: receiver_id, in: query, schema: {type: string, maxLength: 63}}
        - {name: purpose, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 1000}}
      responses:
        "200":
          description: The frames, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDFramePage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/rid/frames/{frame_id}:
    parameters:
      - {name: frame_id, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{32}$"}}
    get:
      operationId: getRIDFrame
      tags: [rid-frames]
      summary: Every stored row of one frame id (purpose required, audited)
      security:
        - sessionCookie: []
      x-roles: [incident_officer, inspector]
      x-audit: {event_type: rid_frames_viewed, entity_type: rid_observations, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200":
          description: The rows of the frame.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RIDFramePage"
        default:
          $ref: "#/components/responses/Problem"

  # WP-10: the cell3 -> detect worker ownership map.
  /v1/cells:
    get:
      operationId: getCellOwnership
      tags: [cells]
      summary: The cell3 -> detect worker ownership map
      description: |
        Read from KV bucket `cells`, where detect workers read it. A
        worker judges the cells the map gives it and refuses to start
        with none unless `CELLS=all` (05 §3). 404 when no map has been
        written yet.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellOwnership"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putCellOwnership
      tags: [cells]
      summary: Replace the ownership map (an operator's rebalance)
      description: |
        Writes the whole map with the next version into KV bucket
        `cells`, inside the transaction of its `events` row: when the
        bucket cannot take it the change is refused with 503
        `cell_store_unavailable` and nothing is recorded. A map past the
        bucket's value bound is refused with 400 naming the bound.
        Workers take a new map at their next start.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: cell_ownership_changed, entity_type: cells, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CellOwnershipInput"
      responses:
        "200":
          description: The map as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CellOwnership"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-10: source control (U-15).
  /v1/sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: Every switch and every source with its switch and its health
      description: |
        The switches as the database holds them (the state api
        publishes), and every source a switch names or an adapter has
        reported on `src.v1.<type>.<instance>`: enabled or disabled (by
        type, instance or default deny, and by whom), and healthy,
        stale, lagging or never heard (B-11, B-03). `status_age_s` is
        the age of the adapter's last status; past
        `SOURCE_STATUS_STALE_S` the source is stale whatever it said.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The switches and the sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceOverview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sources/{source_type}:
    parameters:
      - {name: source_type, in: path, required: true, schema: {$ref: "#/components/schemas/SourceType"}}
    put:
      operationId: switchSourceType
      tags: [sources]
      summary: Switch a whole source type on or off
      description: |
        A type switched off disables every instance of it, even one
        switched on. In one transaction under the advisory lock
        `source_controls`: the row, its `events` row, then the KV write
        of the whole state (bucket `source_control`, key `state`); when
        the bucket cannot take it the switch is refused with 503
        `source_control_unavailable` and nothing is written (B-09). The
        state is then pushed on `ctl.sources`; adapters refuse a
        disabled source with 503 and Retry-After (B-10). A state past
        the bucket's value bound is refused with 400 naming the bound
        (E-10). A switch to the state already held changes and records
        nothing (`changed: false`).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: source_disabled, entity_type: source, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSwitchInput"
      responses:
        "200":
          description: The switch as stored and the state's version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSwitchResult"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sources/{source_type}/{instance_id}:
    parameters:
      - {name: source_type, in: path, required: true, schema: {$ref: "#/components/schemas/SourceType"}}
      - {name: instance_id, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$"}}
    put:
      operationId: switchSourceInstance
      tags: [sources]
      summary: Switch one instance (a receiver, a USSP, a feed) on or off
      description: |
        As for a type. An instance switched off stays off under a type
        that is on; an instance switched on overrides default deny but
        not a type that is off.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: source_disabled, entity_type: source, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSwitchInput"
      responses:
        "200":
          description: The switch as stored and the state's version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSwitchResult"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-5: geo-zones and U-space airspace authoring (spec 01 A2, A3; 02
  # F1; 03 §1 geo_zones, uspace_airspaces). A zone is an ED-318 UASZone
  # feature, validated on every write by uspace-core ed318.Parse and
  # never repaired (06 T9): accepted whole or refused whole with every
  # problem by JSON path. Each write makes a new version (draft); an
  # admin approves it and publishes the dataset, which supersedes older
  # versions, writes the zones projection the hot path judges with (a
  # failed projection write rolls the publication back, 503
  # projection_unavailable) and the F1 outbox row (pending and signed;
  # WP-6 sends it to the CISP). The period of validity is mandatory
  # (947 Art. 15(3)). A WGS84 vertical reference is accepted and named
  # in `extensions`: it is this project's extension, not a published
  # ED-318 reference (LESSONS Z-05).
  /v1/zones:
    get:
      operationId: listZones
      tags: [zones]
      summary: The newest version of every geo-zone, in identifier order
      security:
        - sessionCookie: []
      x-roles: [inspector, admin, viewer]
      x-audit: none
      parameters:
        - {name: state, in: query, schema: {$ref: "#/components/schemas/ZoneState"}}
        - {name: after, in: query, description: The next_after of the previous page., schema: {type: string, maxLength: 7}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: One page of zones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneVersionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createZone
      tags: [zones]
      summary: Author a new geo-zone (version 1, draft)
      description: |
        The feature must be an ED-318 UASZone feature that uspace-core
        ed318.Parse accepts, that ed318.ToZones can judge (rings, limits,
        an applicability it can evaluate), and of any type but USPACE
        (a U-space airspace is authored under /v1/uspace). 409 when the
        identifier is taken in either dataset.
      security:
        - sessionCookie: []
      x-roles: [inspector]
      x-audit: {event_type: zone_drafted, entity_type: zone, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneDraftInput"
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneVersion"
        default:
          $ref: "#/components/responses/Problem"
  /v1/zones/export:
    get:
      operationId: exportZones
      tags: [zones]
      summary: The published geo-zones as an ED-318 FeatureCollection
      description: |
        Per identifier, the newest published version whose period of
        validity holds at the instant (both ends included): `at` when
        given, else the database's now. With `at` the features that do
        not apply at `at` (uspace-core ed318.Applies at the centre of the
        feature's bounding box) are left out and every feature whose
        applicability cannot be evaluated is kept with
        extendedProperties.cis_applicability `unknown`, never dropped.
        `applies_at` annotates without filtering: every feature carries
        extendedProperties.cis_applicability `applies`, `not_applicable`
        or `unknown` at that instant (M17). `at` and `applies_at`
        together are refused 400 filter_conflict. Daylight events are
        resolved by the ground package; until it is wired they cannot
        be (the answer is `unknown`). The collection metadata uses
        ed318.Metadata's names: `issued` (the database's now) and
        `provider` (ZONES_PROVIDER_NAME).
      security:
        - sessionCookie: []
      x-roles: [inspector, admin, viewer]
      x-audit: {event_type: zones_exported, entity_type: zone, purpose: none}
      parameters:
        - {name: at, in: query, description: RFC 3339 instant with an offset., schema: {type: string, format: date-time}}
        - {name: applies_at, in: query, description: RFC 3339 instant with an offset., schema: {type: string, format: date-time}}
      responses:
        "200":
          description: The ED-318 FeatureCollection, exactly as uspace-core ed318.Export writes it.
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/ED318Collection"
        default:
          $ref: "#/components/responses/Problem"
  /v1/zones/import:
    post:
      operationId: importZones
      tags: [zones]
      summary: Import an ED-318 or ED-269 file as drafts, all or nothing
      description: |
        The body is the file's bytes (at most 4 MiB, uspace-core
        ed269.DefaultLimits; a UTF-8 byte order mark is accepted). The
        format is detected by its wrapper: a top-level `type`
        FeatureCollection is ED-318; `features` without it, or
        `UASZoneList`, is ED-269, parsed by ed269.Parse and mapped by
        ed318.FromED269 (what ED-318 cannot hold is refused by name).
        Every zone is validated as a single write is; the file is
        accepted whole (one draft version per zone, in one transaction)
        or refused whole with every problem by JSON path (at most 100,
        `truncated` beyond). The period of validity is `valid_from` and
        `valid_to`, else the ED-318 collection's metadata validFrom and
        validTo; without one the import is refused (947 Art. 15(3)).
      security:
        - sessionCookie: []
      x-roles: [inspector]
      x-audit: {event_type: zones_imported, entity_type: zone, purpose: none}
      parameters:
        - {name: valid_from, in: query, schema: {type: string, format: date-time}}
        - {name: valid_to, in: query, schema: {type: string, format: date-time}}
        - {name: lang, in: query, description: "Language of an ED-269 file's texts (default en-GB).", schema: {type: string, maxLength: 5}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The drafts created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneImportResult"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/zones/import/airspace-gov-ge:
    post:
      operationId: importGovGeZones
      tags: [zones]
      summary: Convert airspace.gov.ge's zone files with a rules file, then import
      description: |
        airspace.gov.ge publishes no feed, no limits and no times (LESSONS
        Z-13): its zones are JavaScript variables in `points.js`
        (`var NAME_points = [[lat, lon], ...];` polygons, `var NAME_point
        = [lat, lon];` circle centres) and the circles' radii are in the
        page's `L.circle(NAME_point, {radius: <m>})` calls. The rules file
        says, per kind of zone (the variable name's last `_` part), the
        restriction, limits, applicability and reasons; a kind without a
        rule refuses the conversion by name. The result is an ED-269
        document imported exactly as /v1/zones/import does.
        docs/runbooks/zones.md documents the rules format. Nothing here
        fetches the site.
      security:
        - sessionCookie: []
      x-roles: [inspector]
      x-audit: {event_type: zones_imported, entity_type: zone, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovGeImportInput"
      responses:
        "201":
          description: The drafts created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneImportResult"
        "413":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/zones/publish:
    post:
      operationId: publishZones
      tags: [zones]
      summary: Publish every approved geo-zone version
      description: |
        In one transaction under the zones advisory lock: every approved
        version becomes published under a new zones version and
        supersedes the identifier's older published versions; the zones
        projection is rewritten in the telemetry database (a failed write
        rolls the publication back, 503 projection_unavailable); the full
        set in force now is exported (ED-318, ed318.Export) into the F1
        outbox row of dataset `zones`, state `pending`, after it passed
        the CISP's dataset checks (ed318.Parse) and was signed with the
        publication key (a detached JWS, WP-6); a payload that fails is
        refused with every problem by path and nothing is published.
        Then zones.v1.changed and KV
        zones_version announce the version. 409 nothing_to_publish when
        no version is approved.
      security:
