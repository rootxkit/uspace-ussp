        model: {type: string, maxLength: 100}
        owner_ref: {type: string, maxLength: 64}
        class_label: {$ref: "#/components/schemas/ClassLabel"}
        mtom_g: {type: integer, minimum: 1, maximum: 10000000}
        rid_capability: {$ref: "#/components/schemas/RIDCapability"}
    RegistryUAS:
