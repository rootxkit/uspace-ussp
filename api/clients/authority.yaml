  # WP-20: the uas.gov.ge import under a rules file, the public status
  # check, the registration applications of the public portal (behind
  # REGISTRY_APPLICATIONS=on; plan Q-A11, Q-A17) and an operator's
  # occurrence report through an e-mailed link (behind
  # REGISTRY_OPERATOR_REPORTS=on). The portal operations have
  # `security: []`: the applicant and the operator hold no account
  # (Q-A17); a link token (X-Application-Token, X-Operator-Token),
  # signed with REGISTRY_PORTAL_KEY_FILE and mailed to the address given,
  # is their credential, checked by internal/regportal. With its flag off
  # every portal operation is 404. docs/runbooks/registry-import.md and
  # docs/runbooks/registry-portal.md are the procedures.
  /v1/registry/import:
    post:
      operationId: importRegistry
      tags: [registry]
      summary: Import a uas.gov.ge export under the rules file, all or nothing
      description: |
        The body is one export file of one `kind` (operators first, then
        uas): CSV (`text/csv`, UTF-8, a header row) or a JSON array of
        flat objects (`application/json`). The rules file
        (`REGISTRY_IMPORT_RULES_FILE`, configuration, never in the
        repository) maps its columns and values onto the registry's
        fields, names its date formats and the registration-number
        pattern its numbers follow. Idempotent on the record's source
        id: a record imported before is updated where it differs and
        left alone where it matches; rows are marked `source =
        uas_gov_ge_import`. All or nothing: with any problem nothing is
        written and the answer is 422 listing every problem by record
        and field (`records[<n>].<field>`, n counting from 1 after the
        header), at most 100 with `truncated`. `dry_run=true` runs the
        same checks inside a transaction that is rolled back and
        answers the report (200, problems listed, nothing written but
        its events row). The file is at most `REGISTRY_IMPORT_MAX_BYTES`
        (413 beyond) and `REGISTRY_IMPORT_MAX_ROWS` records (400 beyond).
        503 `import_not_configured` without a rules file. Every import,
        refused and dry run included, is an events row with the counts.
      security:
        - sessionCookie: []
      x-roles: [registrar]
      x-audit: {event_type: registry_imported, entity_type: registry_import, purpose: none}
      parameters:
        - {name: kind, in: query, required: true, schema: {$ref: "#/components/schemas/RegistryImportKind"}}
        - {name: dry_run, in: query, schema: {type: boolean, default: false}}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryImportJSON"
      responses:
        "200":
          description: The import applied, or the dry run's report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryImportReport"
        "400":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
