      type: object
      required: [registration_number, operator_type, status, valid_from, valid_until]
      properties:
        registration_number: {type: string}
        operator_type: {type: string}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
    PoliceUAS:
      type: object
      required: [serial, status]
      properties:
        serial: {type: string}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        class_label: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        registration_mark: {type: string}
    PoliceOperatorAnswer:
      allOf:
        - $ref: "#/components/schemas/PoliceQueryMeta"
        - type: object
          required: [operator, fleet, fleet_truncated]
          properties:
            operator:
              $ref: "#/components/schemas/PoliceRegistration"
            fleet:
              type: array
              items:
                $ref: "#/components/schemas/PoliceUAS"
            fleet_truncated: {type: boolean}
            identity:
              $ref: "#/components/schemas/PoliceOperatorIdentity"
    PoliceSerialAnswer:
      allOf:
        - $ref: "#/components/schemas/PoliceQueryMeta"
        - type: object
          required: [uas, operator]
          properties:
            uas:
              $ref: "#/components/schemas/PoliceUAS"
            operator:
              $ref: "#/components/schemas/PoliceRegistration"
            identity:
              $ref: "#/components/schemas/PoliceOperatorIdentity"
    PoliceExportInput:
      type: object
      required: [purpose, case_ref, from, to]
      description: Exactly one of incident_id and query.
      properties:
        purpose: {type: string, maxLength: 64}
        case_ref: {type: string, minLength: 1, maxLength: 100}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        incident_id: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}
        query:
          type: object
          required: [bbox]
          properties:
            bbox: {type: string, maxLength: 128, description: "min_lon,min_lat,max_lon,max_lat (WGS84 degrees)."}
    PoliceExport:
      allOf:
        - $ref: "#/components/schemas/PoliceQueryMeta"
        - type: object
          required: [pack_id, incident_id, incident_opened, from, to, content_hash, size_bytes, created_at, download]
          properties:
            pack_id: {type: string}
            incident_id: {type: string}
            incident_opened: {type: boolean, description: True when the export opened an incident (opened_from police_request).}
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            content_hash: {type: string}
            size_bytes: {type: integer, format: int64}
            signature: {type: [string, "null"]}
            signature_kid: {type: [string, "null"]}
            created_at: {type: string, format: date-time}
            download: {type: string, description: The path of the download operation.}
    DPOPoliceQuery:
      type: object
      required: [id, at, user_id, agency, kind, purpose, case_ref, query, result_count, pii, remote_ip]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        user_id: {type: string}
        agency: {type: string}
        kind: {type: string, enum: [aircraft, operator, serial, export, download]}
        purpose: {type: string}
        case_ref: {type: string}
        query:
          type: object
          additionalProperties: true
        result_count: {type: integer}
        pii: {type: boolean}
        remote_ip: {type: string}
    DPOPIIView:
      type: object
      required: [event_id, ts, event_type, actor_type, actor_id, entity_type]
      properties:
        event_id: {type: integer, format: int64}
        ts: {type: string, format: date-time}
        event_type: {type: string}
        actor_type: {type: string}
        actor_id: {type: string}
        realm: {type: [string, "null"]}
        purpose: {type: [string, "null"]}
        entity_type: {type: string}
        entity_id: {type: [string, "null"]}
        case_ref: {type: string}
        agency: {type: string}
        police_query_id: {type: string}
    DPOReport:
      type: object
      required: [month, from, to, police_queries, pii_views, truncated, totals]
      properties:
        month: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        police_queries:
          type: array
          items:
            $ref: "#/components/schemas/DPOPoliceQuery"
        pii_views:
          type: array
          items:
            $ref: "#/components/schemas/DPOPIIView"
        truncated: {type: boolean}
        totals:
          type: object
          required: [police_queries, police_queries_with_pii, pii_views]
          properties:
            police_queries: {type: integer}
            police_queries_with_pii: {type: integer}
            pii_views: {type: integer}
    # WP-27: retention, legal holds and the chain verification.
    AuditVerification:
      type: object
      required: [month, rows, intact, verified_at]
      properties:
        month: {type: string, description: The UTC month verified (YYYY-MM).}
        rows: {type: integer, format: int64, description: Rows checked.}
        first_id: {type: integer, format: int64}
        last_id: {type: integer, format: int64}
        last_hash: {type: string}
        anchored_to:
          type: string
          description: The dropped month whose last hash the first row links to (older months dropped after their retention); empty otherwise.
        intact: {type: boolean, description: True when every row checked holds its hash and its link.}
        broken:
          $ref: "#/components/schemas/AuditChainBreak"
        verified_at: {type: string, format: date-time, description: When the verification was recorded in the chain.}
    AuditChainBreak:
      type: object
      required: [id, ts, reason]
      properties:
        id: {type: integer, format: int64}
        ts: {type: string, format: date-time}
        reason: {type: string, enum: [prev_hash_mismatch, hash_mismatch, payload_unreadable]}
        want: {type: string}
        got: {type: string}
    RetentionPeriods:
      type: object
      required: [online_days, archive_years, violations_years, incidents, audit_years, pending_gcaa, archive_store]
      properties:
        online_days: {type: integer, description: Days the telemetry hypertables stay online before they are archived and dropped.}
        archive_years: {type: integer, description: Years an archived chunk or USSP daily bundle is kept.}
        violations_years: {type: integer, description: Years a closed violation is kept after it closed.}
        incidents: {type: string, enum: [indefinite]}
        audit_years: {type: integer, description: Years a month of the audit log is kept after it ended.}
        pending_gcaa: {type: boolean, description: True while the periods are the spec's Q8 defaults and GCAA and the DPO have not decided.}
        archive_store: {type: string, description: The archive store, or empty when none is configured (nothing is archived, so no chunk is dropped).}
    RetentionJobRun:
      type: object
      required: [job, run_id, started_at]
      properties:
        job: {type: string}
        run_id: {type: integer, format: int64}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        outcome: {type: string, enum: [ok, failed], description: Absent while the run is unfinished or was interrupted.}
        summary: {type: object, additionalProperties: true}
    RetentionArchiveCounts:
      type: object
      required: [exporting, archived, dropped, objects_deleted]
      description: The telemetry archive ledger by state; archived means exported and verified, not yet dropped (held, or waiting).
      properties:
        exporting: {type: integer, format: int64}
        archived: {type: integer, format: int64}
        dropped: {type: integer, format: int64}
        objects_deleted: {type: integer, format: int64}
    RetentionStatus:
      type: object
      required: [periods, jobs, archive, active_holds, audit_broken_months, ussp_missing_days]
      properties:
        periods:
          $ref: "#/components/schemas/RetentionPeriods"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/RetentionJobRun"
        archive:
          $ref: "#/components/schemas/RetentionArchiveCounts"
        active_holds: {type: integer, format: int64}
        audit_broken_months:
          type: array
          items: {type: string}
        ussp_missing_days:
          type: array
          description: USSP code and day (CODE/YYYY-MM-DD) of every daily records bundle still missing after the grace period.
          items: {type: string}
    LegalHoldInput:
      type: object
      required: [case_ref, reason]
      properties:
        case_ref: {type: string, minLength: 1, maxLength: 200}
        reason: {type: string, minLength: 1, maxLength: 2000}
        window_from: {type: string, format: date-time}
        window_to: {type: string, format: date-time}
        track_ids:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 256}
        serials:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 64}
        violation_ids:
          type: array
          maxItems: 64
          items: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}
    LegalHoldRelease:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
    LegalHold:
      type: object
      required: [hold_id, case_ref, reason, track_ids, serials, violation_ids, placed_by, placed_at, active]
      properties:
        hold_id: {type: string}
        case_ref: {type: string}
        reason: {type: string}
        window_from: {type: string, format: date-time}
        window_to: {type: string, format: date-time}
        track_ids:
          type: array
          items: {type: string}
        serials:
          type: array
          items: {type: string}
        violation_ids:
          type: array
          items: {type: string}
        placed_by: {type: string}
        placed_at: {type: string, format: date-time}
        active: {type: boolean}
        released_by: {type: string}
        released_at: {type: string, format: date-time}
        release_reason: {type: string}
    LegalHoldPage:
      type: object
      required: [holds, truncated]
      properties:
        holds:
          type: array
          items:
            $ref: "#/components/schemas/LegalHold"
        truncated: {type: boolean}
