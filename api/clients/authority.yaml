          description: The answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryValidity"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: validateRegistryBatch
      tags: [registry-f8]
      summary: Validity of up to 100 entities (F8)
