        id: {type: string}
        operator_id: {type: string}
        serial: {type: string}
        manufacturer_code: {type: string}
        registration_mark: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        owner_ref: {type: string}
        class_label: {$ref: "#/components/schemas/ClassLabel"}
        mtom_g: {type: integer}
        rid_capability: {$ref: "#/components/schemas/RIDCapability"}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        status_reason: {type: string}
        registered_at: {type: string, format: date-time}
        registry_version: {type: integer, format: int64}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    RegistryUASList:
      type: object
