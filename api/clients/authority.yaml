              schema:
                $ref: "#/components/schemas/CertificateChange"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-13: the picture, served by picture-ws (x-picture: Caddy routes
  # /v1/picture/* there; the operations are excluded from api's
  # generated server and served by internal/picture, and a test holds
  # the list to apiserver.Picture). Every frame is the common console
  # frame of uspace-lab schemas/common (M29) with this system's extras
  # (schemas/picture/); docs/runbooks/picture.md is the contract.
  /v1/picture/ws:
    get:
      operationId: getPictureWS
      tags: [picture]
      summary: The live picture over a WebSocket (picture-ws)
      description: |
        A WebSocket upgrade, same-origin: the browser sends the
        `uspace_session` cookie (M22; no ticket, nothing in the query
        string; without it 401 `unauthenticated`, never upgraded,
        whatever the Origin) and the `Origin` header must be exactly one
        of `PICTURE_ALLOWED_ORIGINS` (else 403 `origin`, never
        upgraded). The token
        is verified by uspace-core's verifier and must be a session of
        the console or police realm whose sessions row is live (api's
        `GET /v1/auth/session`); otherwise the connection is closed
        with 4401 (sign in again), and with 1013 when the check cannot
        be made. A live connection is re-checked every
        `PICTURE_SESSION_RECHECK_S`: a logout or a revocation closes it
        with 4401. Frames: `console/status/v1` and `console/snapshot/v1`
        on connect and after every `console/subscribe/v1 {bbox,
        layers[]}`, then `track/telemetry/v1` (with `age_s` and
        `source_state`), `track/manned/v1`, `violation/v1` and
        `source/status/v1`, and `console/status/v1` every 2 s. Refusals
        before the upgrade, in this order: 401 `unauthenticated` (no
        `uspace_session` cookie), 426 `upgrade_required`, 403 `origin`,
        503 `picture_full` with Retry-After.
      security:
        - sessionCookie: []
      x-picture: true
      x-audit: none
      responses:
        "101":
          description: Switching protocols; the console frame follows.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "426":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/picture/snapshot:
    get:
      operationId: getPictureSnapshot
      tags: [picture]
      summary: The picture inside a box (picture-ws)
      description: |
        The `console/snapshot/v1` frame a WebSocket console receives, for
        the box itself (`bbox` = `west,south,east,north`, WGS84 degrees;
        west above east crosses the antimeridian) and every layer unless
        `layers` names some. The session is the bearer the BFF forwards
        or the `uspace_session` cookie; an `Origin`, when sent, must be
        allowed. 400 `validation` names `bbox` (including a box of more
        than `PICTURE_MAX_CELLS` cells) or `layers`; 401
        `unauthenticated`; 503 `session_unavailable`.
      security:
        - sessionCookie: []
      x-picture: true
      x-audit: none
      parameters:
        - {name: bbox, in: query, required: true, schema: {type: string, maxLength: 128}}
        - {name: layers, in: query, schema: {type: string, maxLength: 64}}
      responses:
        "200":
          description: The snapshot frame.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PictureFrame"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/picture/sources:
    get:
      operationId: getPictureSources
      tags: [picture]
      summary: Every source with its state, the projection ages and the CIS age (picture-ws)
      security:
        - sessionCookie: []
      x-picture: true
      x-audit: none
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PictureSources"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-14: the F3411 Display Provider. Administration is api's (admin);
  # the ISA change notification and the conformance hook are served by
  # dp-poller (`x-dp: true`), which verifies the token itself with
  # uspace-core's verifier and never reaches api's Authorize.
  /v1/dp/views:
    get:
      operationId: listDPViews
      tags: [dp]
      summary: The oversight areas the Display Provider shows
      description: |
        Every oversight area, oldest first. The Display Provider shows
        these areas whether or not a console looks at them, beside the
        console viewports picture-ws reports (which expire with the
        console).
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The areas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DPViewList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDPView
      tags: [dp]
      summary: Add an oversight area
      description: |
        A WGS84 box `[west, south, east, north]` that never crosses the
        antimeridian. The row and its `events` row are one transaction;
        after the commit every area is published to KV bucket
        `dp_oversight` (key `views`) with the table's version, never
        replacing a higher one (two api replicas never move it back), and
        republished periodically. dp-poller covers each area with tiles of
        at most `dp_view_diagonal_km` (F3411 7 km). At most 256 areas
        (E-10): one more is refused with 409.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: dp_view_created, entity_type: dp_view, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DPViewInput"
      responses:
        "201":
          description: The area as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DPView"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dp/providers:
    get:
      operationId: listDPProviders
      tags: [dp]
      summary: The Service Providers the Display Provider has seen, with their state
      description: |
        Every Service Provider an ISA named (its owner is its id and the
        source instance of its tracks), from dp-poller's last
        `src.v1.network_rid.<uss_id>` status: live, down (`unavailable
        since T`: its polls fail for 10 s; never removed), disabled (by
        whom), or unknown; slow (polled at 0.5 Hz past the F3411 p99 of
        3 s) with p95 and p99; the ISAs and tiles it is polled for; and
        `provider_unknown` when it matches no operating certificate (it
        is still polled and shown). `status_age_s` is the age of the
        status itself.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DPProviderList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dp/providers/{uss_id}/availability:
    parameters:
      - {name: uss_id, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$"}}
    put:
      operationId: setDPProviderAvailability
      tags: [dp]
      summary: Arbitrate a USS's availability at the DSS (F3548)
      description: |
        `PUT /dss/v1/uss_availability/{uss_id}` at the DSS with scope
        `utm.availability_arbitration` (F3548-21, through the client
        generated from `api/clients/dss-utm.yaml` with uspace-core's
        types). The request is recorded first (`dp_availability_requested`,
        committed), then the DSS is called with the arbitration of this
        USS held by an advisory lock (a concurrent arbitration of the
        same USS is refused with 409), and the outcome is recorded
        (`dp_availability_set` or `dp_availability_failed`). A DSS that
        refuses or cannot be reached answers 502 with its status.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: dp_availability_set, entity_type: uss_availability, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DPAvailabilityInput"
      responses:
        "200":
          description: The availability as the DSS now holds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DPAvailabilityResult"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dp/observations/display_data:
    get:
      operationId: getDPDisplayData
      tags: [dp]
      summary: "Conformance hook: what the Display Provider shows in a view (dp-poller)"
      description: |
        The InterUSS Remote ID observation interface `GET
        {base}/display_data?view=` with base `/v1/dp/observations`, its
        shape read from `api/clients/interuss-observation/observation.yaml`
        at the commit `api/clients/SOURCE` records (Q-A7). A bearer
        ecosystem token granting `dp.observe` (issued to `lab-01` only)
        with `aud` one of this system's hosts. A view within the F3411
        details diagonal (2 km) is answered with flights, a wider one with
        clusters only. A conformance hook, not a product endpoint.
      security:
        - ecosystemToken: []
      x-dp: true
      x-audit: none
      parameters:
        - {name: view, in: query, required: true, schema: {type: string, maxLength: 256}, description: "lat1,lng1,lat2,lng2"}
      responses:
        "200":
          description: The observation interface's GetDisplayDataResponse.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/dp/observations/display_data/{id}:
    get:
      operationId: getDPFlightDetails
      tags: [dp]
      summary: "Conformance hook: a flight's details (dp-poller)"
      description: |
        The observation interface's `GET {base}/display_data/{id}`: the
        operator id's public part only (the secret part of a registration
        number never leaves), the operator location and the serial.
        Same token as `getDPDisplayData`.
      security:
        - ecosystemToken: []
      x-dp: true
      x-audit: none
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The observation interface's GetDetailsResponse.
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /uss/identification_service_areas/{id}:
    post:
      operationId: postDPISANotification
      tags: [dp]
      summary: F3411 ISA change notification from a Service Provider (dp-poller)
      description: |
        ASTM F3411-22a `postIdentificationServiceArea`
        (`api/clients/dss-rid.yaml`), served by dp-poller through the
        server generated from that file: the Service Provider that owns
        an ISA posts its creation, change or deletion to every subscriber
        the DSS named. A bearer token from an allow-listed issuer (this
        system's, or the lab's in the lab) granting `rid.service_provider`
        with `aud` one of `AUTHORITY_AUDIENCES` (M6, M18); the service
        area's owner must be the token's subject (403 otherwise). Body:
        F3411 `PutIdentificationServiceAreaNotificationParameters`, at most
        `DP_MAX_NOTIFICATION_BYTES`. Every refusal is the problem/v1 body
        (`application/problem+json`) with the F3411 `ErrorResponse`
        member `message` beside it, equal to `detail`
        (`DPNotificationProblem`).
      security:
        - ecosystemToken: []
      x-dp: true
      x-audit: none
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: Applied.
        "400":
          description: Malformed (`validation`, the field in `errors`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DPNotificationProblem"
        "401":
          description: No token, or a token refused (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DPNotificationProblem"
        "403":
          description: The token does not grant rid.service_provider, or its subject does not own the ISA (`forbidden`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DPNotificationProblem"
        "413":
          description: Larger than the bound (`body_too_large`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DPNotificationProblem"
        "503":
          description: The token cannot be verified yet (`unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DPNotificationProblem"

  # WP-19: the police realm (spec 02 F10). A session of the police realm
  # holding police.query, signed in with MFA from an address of the
  # account's allow-list; every query names a purpose from the
  # configured list and a case reference, is one police_queries row and
  # one police_query events row, and is rate-limited per user and per
  # agency. Personal data only where the purpose allows it.
  /v1/police/aircraft:
    get:
      operationId: queryPoliceAircraft
      tags: [police]
      summary: Who is flying in a box now, or was at an instant
      description: |
        Without `at`: the tracks of the authority's picture last seen
        within `POLICE_LIVE_WINDOW_S` of now (the telemetry database's
        clock). With `at`: the tracks seen within `POLICE_AT_WINDOW_S`
        either side of it; an `at` older than `POLICE_HISTORY_MAX_AGE_S`
        (the online retention) or in the future is refused. Each
        aircraft: its serial and the operator registration's public part
        as identified, the identification status, the trust, the first
        and last time seen and its positions in the box (the newest
        `POLICE_MAX_POSITIONS`, `positions_truncated` beyond). The remote
        pilot position is never returned. The operator's identity is
        added only when `purpose` is one of `POLICE_PII_PURPOSES`, each
        read a `registry_pii_viewed` events row carrying the case
        reference. `sources` says how fresh the picture is and which
        recorded writer gaps fall in the window: an empty answer from a
        stale or gapped picture is not an empty sky.
      security:
        - sessionCookie: []
      x-roles: [police.query]
      x-realm: police
      x-audit: {event_type: police_query, entity_type: police_query, purpose: required}
      parameters:
        - {name: bbox, in: query, required: true, description: "min_lon,min_lat,max_lon,max_lat (WGS84 degrees), each side at most POLICE_MAX_BBOX_DEG.", schema: {type: string, maxLength: 128}}
        - {name: at, in: query, schema: {type: string, format: date-time}}
        - {name: purpose, in: query, required: true, schema: {type: string, maxLength: 64}}
        - {name: case_ref, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
      responses:
        "200":
          description: The aircraft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliceAircraftAnswer"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/police/operators/{reg}:
    parameters:
      - {name: reg, in: path, required: true, description: "The operator registration number (its public part; a secret part sent with it is dropped).", schema: {type: string, minLength: 1, maxLength: 64}}
    get:
      operationId: queryPoliceOperator
      tags: [police]
      summary: An operator's registry status and fleet
      description: |
        The registration as the registry holds it (status, validity),
        its fleet (at most `POLICE_MAX_FLEET`, `fleet_truncated`
        beyond), and the operator's identity only when `purpose` allows
        personal data. An unknown number is a 404 after the query is
        recorded with `result_count` 0.
      security:
        - sessionCookie: []
      x-roles: [police.query]
      x-realm: police
      x-audit: {event_type: police_query, entity_type: police_query, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, maxLength: 64}}
        - {name: case_ref, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
      responses:
        "200":
          description: The operator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliceOperatorAnswer"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/police/serials/{serial}:
    parameters:
      - {name: serial, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
    get:
      operationId: queryPoliceSerial
      tags: [police]
      summary: An aircraft's registry status and its operator
      description: |
        The aircraft the serial names under uspace-core's matching
        (exact, else a unique folded match), its status and its
        operator's registration; the operator's identity only when
        `purpose` allows personal data. An unknown serial is a 404 after
        the query is recorded with `result_count` 0.
      security:
        - sessionCookie: []
      x-roles: [police.query]
      x-realm: police
      x-audit: {event_type: police_query, entity_type: police_query, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, maxLength: 64}}
        - {name: case_ref, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
      responses:
        "200":
          description: The aircraft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliceSerialAnswer"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/police/exports:
    post:
      operationId: createPoliceExport
      tags: [police]
      summary: A legal evidence pack for an incident or for an area and a window
      description: |
        Builds a `legal` evidence pack through WP-17's builder (hash
        sealed, the seal statement signed by the publication key, stored
        sealed at rest) for [from, to): of `incident_id`, or of the
        aircraft the picture held in `query.bbox` over the window, for
        which an incident `opened_from: police_request` is opened (at
        most 32 aircraft, 413 beyond: narrow the query; 422 when there is
        none). A legal pack carries personal data, so `purpose` must be
        one of `POLICE_PII_PURPOSES` (403 otherwise). The export is a
        police_queries row before the build, and the pack's
        `evidence_pack_built` row carries the purpose and the case
        reference. Only the requesting agency downloads it.
      security:
        - sessionCookie: []
      x-roles: [police.query]
      x-realm: police
      x-audit: {event_type: police_query, entity_type: police_query, purpose: required}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoliceExportInput"
      responses:
        "201":
          description: The sealed pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliceExport"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/police/exports/{pack_id}/download:
    parameters:
      - {name: pack_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: downloadPoliceExport
      tags: [police]
      summary: The sealed archive of an export of this agency (audited)
      description: |
        Only a pack exported for the caller's agency (404 otherwise).
        The download is a police_queries row, and WP-17's download
        checks the hash before a byte is served and records
        `evidence_pack_downloaded` with the purpose and the case
        reference. `purpose` must be one of `POLICE_PII_PURPOSES`.
      security:
        - sessionCookie: []
      x-roles: [police.query]
      x-realm: police
      x-audit: {event_type: police_query, entity_type: police_query, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, maxLength: 64}}
        - {name: case_ref, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
      responses:
        "200":
          description: The archive (a ZIP file).
          headers:
            X-Content-SHA256:
              description: The archive's hash, as content_hash records it.
              schema: {type: string}
            X-Evidence-Signature:
              description: The detached JWS of the seal statement; empty when the pack is unsigned.
              schema: {type: string}
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"

  # WP-27: retention, legal holds and the verification of the records
  # (spec 05 §4, 06 §2 T7, 06 §5, 08 Q8; plan Q-A15, Q-A18;
  # docs/runbooks/retention.md). The periods are configuration, the
  # spec's defaults pending GCAA.
  /v1/audit/verify:
    get:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Verify one month of the audit log's hash chain
      description: |
        Recomputes the month's chain in id order (`audit.Verify`) and
        answers how many rows from which id to which were checked, the
        last hash, and the first broken row or none. The oldest kept
        month, once older months were dropped after their retention,
        links to the anchor recorded at the drop (`anchored_to`). The
        verification is itself an `audit_chain_verified` events row in
        the chain, and a broken month is an alarm on the status line.
        `month` is a UTC calendar month (YYYY-MM); a month with no rows
        answers `rows: 0`, never "intact" without numbers.
      security:
        - sessionCookie: []
      x-roles: [admin, auditor]
      x-audit: {event_type: audit_chain_verified, entity_type: events, purpose: none}
      parameters:
        - {name: month, in: query, required: true, schema: {type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"}}
      responses:
        "200":
          description: What was checked and what was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerification"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/retention/status:
    get:
      operationId: getRetentionStatus
      tags: [retention]
      summary: The retention periods, the jobs' last runs, the archive and the alarms
      description: |
        The periods in force (`pending_gcaa: true`: the spec's Q8
        defaults until GCAA and the DPO decide), every job's newest run
        from the job ledger (database clock) with its summary, the
        archive ledger by state, the active holds, the months of the
        audit log found broken, and the USSP days still missing after
        the grace period (02 F7). The read is a `retention_status_viewed`
        events row.
      security:
        - sessionCookie: []
      x-roles: [admin, auditor]
      x-audit: {event_type: retention_status_viewed, entity_type: retention, purpose: none}
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/retention/holds:
    get:
      operationId: listLegalHolds
      tags: [retention]
      summary: Legal holds, newest first
      description: |
        Active holds, and released ones with `include_released`. At most
        `limit`; `truncated` says when there are more. The read is a
        `legal_holds_viewed` events row.
      security:
        - sessionCookie: []
      x-roles: [admin, auditor, incident_officer]
      x-audit: {event_type: legal_holds_viewed, entity_type: legal_hold, purpose: none}
      parameters:
        - {name: include_released, in: query, schema: {type: boolean, default: false}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: One page of holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHoldPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: placeLegalHold
      tags: [retention]
      summary: Place a legal hold
      description: |
        Keeps what the hold covers past every retention period until it
        is released: no deletion batch, chunk drop, month drop or
        archive expiry touches it. A hold covers the violations named in
        `violation_ids` (and their aircraft's telemetry around them);
        with a window `[window_from, window_to)` the records of that
        time, all of them when no list is given, else those of the
        listed `track_ids` and `serials`; without a window the listed
        aircraft at any time. A window, or at least one list, is
        required. Placing a hold waits for a deletion batch in progress
        and is never missed by the next one (the hold gate). The hold is
        a `legal_hold_placed` events row with the case reference.
      security:
        - sessionCookie: []
      x-roles: [admin, incident_officer]
      x-audit: {event_type: legal_hold_placed, entity_type: legal_hold, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalHoldInput"
      responses:
        "201":
          description: The hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHold"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/retention/holds/{hold_id}/release:
    parameters:
      - {name: hold_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    post:
      operationId: releaseLegalHold
      tags: [retention]
      summary: Release a legal hold
      description: |
        The hold stays on record with who released it, when and why; its
        records fall back under their retention periods at the next run.
        409 when it is released already. A `legal_hold_released` events
        row.
      security:
        - sessionCookie: []
      x-roles: [admin, incident_officer]
      x-audit: {event_type: legal_hold_released, entity_type: legal_hold, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalHoldRelease"
      responses:
        "200":
          description: The released hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHold"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: uspace_session
      description: |
        Console session (decision M20): a JWT with `scope = "session"`,
        `roles[]`, `realm` (`console` or `police`), `jti`, `aud` = this
        system's host, set by the web BFF. State-changing requests also
        carry `X-CSRF-Token` matching the `uspace_csrf` cookie (M21).
    ecosystemToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Ecosystem machine token issued by a trusted issuer (RS256,
        `aud` = this system's host, scope from the catalogue in
        `docs/WORKPACKAGES/WP-2.md`), verified by uspace-core `auth`.
        Table B, the whole catalogue: `cis.read`, `cis.publish:zones`,
        `cis.publish:uspace`, `cis.publish:ussp_list`,
        `cis.publish:restrictions`, `cis.publish:ats_data` (reserved,
        never issued), `registry.validate`, `ussp.records`,
        `occurrences.write`, `certificates.status`, `police.query`,
        `ansp.traffic`, `ansp.coordination`, `ansp.requests`,
        `dp.observe` (lab-01 only), `utm.strategic_coordination`,
        `utm.constraint_processing`, `utm.constraint_management`,
        `utm.conformance_monitoring_sa`, `utm.availability_arbitration`,
        `rid.service_provider`, `rid.display_provider`, and at a USSP's
        issuer only `ussp.intents`, `ussp.telemetry`, `ussp.traffic`,
        `ussp.geo`.
    receiverKey:
      type: http
      scheme: bearer
      description: |
        Per-receiver bearer key of a Remote ID receiver, together with
        an HMAC-SHA256 of the exact body bytes under a separate secret
        (WP-7). Not a JWT and not a scope.

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The budget of this client address or account is spent.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OAuthError:
      description: A refused token request (RFC 6749 §5.2 inside a problem).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OAuthProblem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: Check name to its state; an error names the cause.
          additionalProperties:
            $ref: "#/components/schemas/Check"
    Check:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    FieldProblem:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          description: JSON path or parameter name, as core.FieldError writes it.
        reason:
          type: string
          minLength: 1
    Problem:
      type: object
      description: |
        RFC 9457 problem details with the field-error extension of
        decision M28; the shape of uspace-lab `schemas/common/problem/v1`.
        `errors` is capped at 100 entries; `truncated` is true when it
        was cut.
      required: [type, title, status, errors]
      properties:
        type:
          type: string
          pattern: "^https://schemas\\.uspace\\.ge/problems/[a-z_]+$"
          description: "`https://schemas.uspace.ge/problems/<slug>`, slug = the counter or refusal name."
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldProblem"
        truncated:
          type: boolean
    DPNotificationProblem:
      description: |
        The refusal of the F3411 ISA notification (dp-poller): the
        problem/v1 body, which is also an F3411 `ErrorResponse`, its one
        member `message` carrying the same text as `detail`.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [message]
          properties:
            message:
              type: string
              description: F3411 `ErrorResponse.message`; equal to `detail`.
    Severity:
      type: string
      enum: [info, warning, critical]
    PolicyInput:
      type: object
      description: |
        The thresholds of one policy version. Units are in the names;
        every number is finite and positive (E-15). The defaults named
        below are those of version 1, the predecessor's values.
      required:
        - height_limit_agl_m
        - pressure_uncertainty_m
        - zone_conditional_severity
        - mismatch_severity
        - identification_severity
        - spoof_distance_m
        - identity_ttl_s
        - max_gap_s
        - identify_within_s
        - broadcast_tolerance_s
        - max_latency_s
        - live_max_age_s
        - clear_after_s
        - stale_after_s
        - dp_view_diagonal_km
        - dp_poll_hz
        - cis_stale_bound_s
        - height_limit_in_uspace
      properties:
        height_limit_agl_m: {type: number, format: double, description: "Height limit over the ground (default 120)."}
        pressure_uncertainty_m: {type: number, format: double, description: "Pressure-altitude margin (default 250)."}
        zone_conditional_severity: {$ref: "#/components/schemas/Severity"}
        mismatch_severity: {$ref: "#/components/schemas/Severity"}
        identification_severity: {$ref: "#/components/schemas/Severity"}
        spoof_distance_m: {type: number, format: double, description: "Default 300."}
        identity_ttl_s: {type: number, format: double, description: "Default 15."}
        max_gap_s: {type: number, format: double, description: "Default 3."}
        identify_within_s: {type: number, format: double, description: "Default 4."}
        broadcast_tolerance_s: {type: number, format: double, description: "Default 1."}
        max_latency_s: {type: number, format: double, description: "Default 5."}
        live_max_age_s: {type: number, format: double, description: "Default 10."}
        clear_after_s: {type: number, format: double, description: "Default 3."}
        stale_after_s: {type: number, format: double, description: "Default 15."}
        dp_view_diagonal_km: {type: number, format: double, description: "Default 7."}
        dp_poll_hz: {type: number, format: double, description: "Default 1."}
        cis_stale_bound_s: {type: number, format: double, description: "Default 300."}
        height_limit_in_uspace:
          type: string
          enum: [evaluate, skip_when_authorised]
        registration_number_pattern:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            The operator registration-number format the registry
            validates against (uspace-core regnum, G-07; the Georgian
            format is open, spec Q5). Default the EU shape
            `^[A-Z]{3}[A-Za-z0-9]{8,16}$`.
        certificate_lapse_unused_months:
          type: integer
          minimum: 1
          maximum: 120
          description: "Art. 16(2): a certificate not used within this many months of its issue lapses (default 6). Copied onto a certificate at issue."
        certificate_lapse_ceased_months:
          type: integer
          minimum: 1
          maximum: 120
          description: "Art. 16(2): a certificate whose operations ceased this many months ago lapses (default 12). Copied onto a certificate at issue."
        no_authorisation_grace_s:
          type: number
          format: double
          description: |
            WP-26: how long an aircraft inside a U-space airspace may show
            no matching operational intent before no_authorisation is
            raised (default 10; pending GCAA, spec Q2).
            no_authorisation_severity (default warning, pending GCAA) is
            the severity it is raised at.
        no_authorisation_severity: {$ref: "#/components/schemas/Severity"}
        note:
          type: string
          maxLength: 1000
    Policy:
      allOf:
        - $ref: "#/components/schemas/PolicyInput"
        - type: object
          required: [version, active, created_at, created_by, note, registration_number_pattern, certificate_lapse_unused_months, certificate_lapse_ceased_months, no_authorisation_grace_s, no_authorisation_severity]
          properties:
            version:
              type: integer
              format: int64
              description: The policy_version every violation carries.
            active:
              type: boolean
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
            activated_at:
              type: string
              format: date-time
            activated_by:
              type: string
    AuditEvent:
      type: object
      required: [id, ts, actor_type, actor_id, entity_type, event_type, payload, prev_hash, hash]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, client, receiver, system]
        actor_id:
          type: string
        realm:
          type: string
        purpose:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        prev_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    AuditEventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_before_id:
          type: integer
          format: int64
          description: Pass as before_id for the next page; absent on the last page.
    OAuthProblem:
      description: |
        A problem (M28) that also carries the RFC 6749 §5.2 members, so
        an OAuth2 client library reads `error` and a uspace client reads
        the problem. `error` is `invalid_request`, `invalid_client`,
        `invalid_scope`, `invalid_target` (RFC 8707),
        `unauthorized_client`, `unsupported_grant_type` or
        `temporarily_unavailable` (rate limit).
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [invalid_request, invalid_client, invalid_scope, invalid_target, unauthorized_client, unsupported_grant_type, temporarily_unavailable]
            error_description:
              type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: {type: string}
        client_id: {type: string}
        client_secret: {type: string}
        client_assertion_type: {type: string}
        client_assertion: {type: string}
        scope: {type: string, description: "Space-separated catalogue scopes (WP-2 table B)."}
        audience: {type: string, description: "The target's host or base URL; its host becomes aud (M18)."}
        resource:
          type: array
          description: RFC 8707 resource indicator (one), an alternative to audience.
          items: {type: string}
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, description: Seconds until exp (at most 3600).}
        scope: {type: string}
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
    IssuerMetadata:
      type: object
      required: [issuer, jwks_uri, token_endpoint, grant_types_supported, token_endpoint_auth_methods_supported, token_endpoint_auth_signing_alg_values_supported, scopes_supported]
      properties:
        issuer: {type: string}
        jwks_uri: {type: string}
        token_endpoint: {type: string}
        grant_types_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_methods_supported:
          type: array
          items: {type: string}
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items: {type: string}
        scopes_supported:
          type: array
          items: {type: string}
    OAuthClientStatus:
      type: string
      enum: [active, suspended, revoked]
    OAuthAuthMethod:
      type: string
      enum: [client_secret_post, private_key_jwt]
    OAuthClientInput:
      type: object
      required: [client_id, scopes, auth_method]
      properties:
        client_id:
          type: string
          maxLength: 64
          description: "authority-01, cisp-01, ansp-01, ussp-<code>-01 or lab-01 (M24)."
        scopes:
          type: array
          maxItems: 32
          items: {type: string}
        audiences:
          type: array
          maxItems: 32
          description: Hosts this client may name for national scopes.
          items: {type: string}
        auth_method:
          $ref: "#/components/schemas/OAuthAuthMethod"
        jwks:
          $ref: "#/components/schemas/JWKS"
        mtls_subject: {type: string, maxLength: 512}
        certificate_id: {type: string, maxLength: 64}
        note: {type: string, maxLength: 1000}
    OAuthClientPatch:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OAuthClientStatus"
        scopes:
          type: array
          maxItems: 32
          items: {type: string}
        audiences:
          type: array
          maxItems: 32
          items: {type: string}
        note: {type: string, maxLength: 1000}
    OAuthClient:
      type: object
      required: [client_id, system, scopes, audiences, auth_method, status, note, created_at, created_by, updated_at, updated_by]
      properties:
        client_id: {type: string}
        system: {type: string, enum: [authority, cisp, ansp, ussp, lab]}
        scopes:
          type: array
          items: {type: string}
        audiences:
          type: array
          items: {type: string}
        auth_method:
          $ref: "#/components/schemas/OAuthAuthMethod"
        jwks:
          $ref: "#/components/schemas/JWKS"
        mtls_subject: {type: string}
        certificate_id: {type: string}
        status:
          $ref: "#/components/schemas/OAuthClientStatus"
        note: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    OAuthClientList:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClient"
    OAuthClientCreated:
      type: object
      required: [client]
      properties:
        client:
          $ref: "#/components/schemas/OAuthClient"
        client_secret:
          type: string
          description: The client_secret_post secret; shown here once and never again.
    SigningKey:
      type: object
      required: [kid, purpose, state, registered_at]
      properties:
        kid: {type: string}
        purpose: {type: string, enum: [token, publication]}
        state:
          type: string
          enum: [candidate, requested, active, retiring, retired, compromised]
          description: "retiring: retired but still in the JWKS; retired: no longer published."
        registered_at: {type: string, format: date-time}
        active_from: {type: string, format: date-time}
        retired_at: {type: string, format: date-time}
        requested_by: {type: string}
        requested_at: {type: string, format: date-time}
        compromised_at: {type: string, format: date-time}
        compromised_by: {type: string}
        compromise_reason: {type: string}
    SigningKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SigningKey"
    KeyRotation:
      type: object
      required: [state, kid, active_kid]
      properties:
        state: {type: string, enum: [requested, activated]}
        kid: {type: string, description: The key requested or activated.}
        active_kid: {type: string, description: The key that signs after this call.}
        previous_kid: {type: string}
        requested_by: {type: string}
        confirm_before: {type: string, format: date-time}
    Role:
      type: string
      description: The console roles, and `police.query`, the one grant of the police realm (WP-19).
      enum: [viewer, inspector, registrar, incident_officer, admin, auditor, police.query]
    Realm:
      type: string
      enum: [console, police]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 256}
        password: {type: string, maxLength: 1024}
    LoginChallenge:
      type: object
      required: [mfa_token, expires_at]
      properties:
        mfa_token: {type: string, description: Single use; present it to /v1/auth/mfa.}
        expires_at: {type: string, format: date-time}
        enrolment:
          $ref: "#/components/schemas/MFAEnrolment"
    MFAEnrolment:
      type: object
      description: Present only while the account has no confirmed TOTP.
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string, description: Base32 TOTP secret (RFC 6238, SHA-1, 6 digits, 30 s).}
        otpauth_uri: {type: string}
    MFARequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token: {type: string, maxLength: 256}
        code: {type: string, maxLength: 16, description: The current TOTP code.}
        recovery_code: {type: string, maxLength: 64, description: One unused recovery code, instead of a TOTP code.}
    SessionInfo:
      type: object
      required: [sub, roles, realm, jti, expires_at, idle_expires_at]
      properties:
        sub: {type: string, description: The account id.}
        roles:
          type: array
          items: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        jti: {type: string, description: The session id.}
        expires_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
    SessionIssued:
      type: object
      required: [token, token_type, expires_at, idle_timeout_s, session]
      properties:
        token: {type: string, description: "The session JWT (table A): the BFF puts it in the uspace_session cookie."}
        token_type: {type: string, enum: [Bearer]}
        expires_at: {type: string, format: date-time}
        idle_timeout_s: {type: integer}
        session:
          $ref: "#/components/schemas/SessionInfo"
        recovery_codes:
          type: array
          description: Shown once, at the sign-in that confirms enrolment.
          items: {type: string}
    UserInput:
      type: object
      required: [username, password, roles, realm]
      description: |
        A console account holds console roles only; a police account
        (WP-19) holds `police.query` only, names its `agency` and the
        CIDRs of `ip_allowlist` it signs in and queries from (an empty
        list admits no address). A console account carries neither.
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, maxLength: 1024}
        display_name: {type: string, maxLength: 200}
        roles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/Role"
        realm:
          $ref: "#/components/schemas/Realm"
        agency: {type: string, maxLength: 100, description: "Police realm only: the agency, 1 to 100 of letters, digits, space . _ -."}
        ip_allowlist:
          type: array
          maxItems: 32
          description: Police realm only, required there; CIDRs or single addresses.
          items: {type: string, maxLength: 64}
    PoliceAccessInput:
      type: object
      required: [agency, ip_allowlist]
      properties:
        agency: {type: string, maxLength: 100}
        ip_allowlist:
          type: array
          maxItems: 32
          items: {type: string, maxLength: 64}
    RolesInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/Role"
    User:
      type: object
      required: [id, username, display_name, roles, realm, status, mfa_enrolled, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        roles:
          type: array
          items: {type: string}
        realm:
          $ref: "#/components/schemas/Realm"
        agency: {type: string, description: Police realm only.}
        ip_allowlist:
          type: array
          description: Police realm only; the CIDRs a sign-in and a police query may come from.
          items: {type: string}
        status: {type: string, enum: [active, disabled]}
        mfa_enrolled: {type: boolean}
        mfa_failures: {type: integer, description: Consecutive wrong MFA codes.}
        mfa_locked_until: {type: string, format: date-time, description: MFA refused until then.}
        mfa_hard_locked: {type: boolean, description: MFA refused until an admin unlocks the account.}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked: {type: integer}
    # WP-3: the registry. Records (RegistryOperator, RegistryUAS,
    # RegistryPilot) and every F8 schema carry no personal data;
    # internal/registry's contract test fails if a personal property
    # name appears in them, and checks that the personal-data schemas
    # do carry them (E-01).
    RegistryStatus:
      type: string
      enum: [active, suspended, revoked, expired]
    RegistryStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, revoked]
          description: expired is set by the expiry job only.
        reason:
          type: string
          maxLength: 500
          description: Required for suspended and revoked.
    RegistrySource:
      type: string
      enum: [portal, uas_gov_ge_import, manual]
    OperatorType:
      type: string
      enum: [natural, legal]
    RegistryOperatorInput:
      type: object
      description: |
        The 2019/947 Art. 14(2) field set. A natural person gives
        full_name and date_of_birth; a legal person legal_name and
        legal_identification_number.
      required: [operator_type, registration_number, postal_address, contact_email, contact_phone, valid_until]
      properties:
        operator_type: {$ref: "#/components/schemas/OperatorType"}
        registration_number: {type: string, maxLength: 64, description: "The public part only, under the policy's registration_number_pattern."}
        secret_part: {type: string, minLength: 3, maxLength: 3, description: "The three secret characters the authority issued; stored as a keyed hash, never returned."}
        full_name: {type: string, maxLength: 200}
        legal_name: {type: string, maxLength: 200}
        date_of_birth: {type: string, format: date}
        legal_identification_number: {type: string, maxLength: 64}
        postal_address: {type: string, maxLength: 500}
        contact_email: {type: string, maxLength: 254}
        contact_phone: {type: string, maxLength: 32}
        insurance_policy_number: {type: string, maxLength: 64}
        competency_confirmation: {type: boolean, description: "The Art. 14(2)(e) statement of a legal person."}
        authorisations:
          type: array
          maxItems: 100
          description: Operational authorisations, LUCs and declarations with their confirmations (Art. 14(2)(f)).
          items: {type: object, additionalProperties: true}
        valid_from: {type: string, format: date-time, description: Default now.}
        valid_until: {type: string, format: date-time}
        source: {$ref: "#/components/schemas/RegistrySource"}
    RegistryOperatorPatch:
      type: object
      properties:
        full_name: {type: string, maxLength: 200}
        legal_name: {type: string, maxLength: 200}
        date_of_birth: {type: string, format: date}
        legal_identification_number: {type: string, maxLength: 64}
        postal_address: {type: string, maxLength: 500}
        contact_email: {type: string, maxLength: 254}
        contact_phone: {type: string, maxLength: 32}
        insurance_policy_number: {type: string, maxLength: 64}
        competency_confirmation: {type: boolean}
        authorisations:
          type: array
          maxItems: 100
          items: {type: object, additionalProperties: true}
        valid_until: {type: string, format: date-time}
    RegistryOperator:
      type: object
      description: An operator without personal data.
      required: [id, operator_type, registration_number, has_secret_part, competency_confirmation, authorisations, status, status_reason, valid_from, valid_until, source, registry_version, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        operator_type: {$ref: "#/components/schemas/OperatorType"}
        registration_number: {type: string, description: The public part as registered.}
        has_secret_part: {type: boolean}
        competency_confirmation: {type: boolean}
        authorisations:
          type: array
          items: {type: object, additionalProperties: true}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        status_reason: {type: string}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        source: {$ref: "#/components/schemas/RegistrySource"}
        registry_version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    RegistryOperatorList:
      type: object
      required: [operators]
      properties:
        operators:
          type: array
          items: {$ref: "#/components/schemas/RegistryOperator"}
        next_after: {type: string, description: Pass as after for the next page; absent on the last page.}
    RegistryOperatorPersonalData:
      type: object
      required: [operator_id, postal_address, contact_email, contact_phone]
      properties:
        operator_id: {type: string}
        full_name: {type: string}
        legal_name: {type: string}
        date_of_birth: {type: string, format: date}
        legal_identification_number: {type: string}
        postal_address: {type: string}
        contact_email: {type: string}
        contact_phone: {type: string}
        insurance_policy_number: {type: string}
    ClassLabel:
      type: string
      enum: [C0, C1, C2, C3, C4, C5, C6]
    RIDCapability:
      type: string
      enum: [direct, network, both, none]
    RegistryUASInput:
      type: object
      required: [operator_id, serial, rid_capability]
      properties:
        operator_id: {type: string, maxLength: 32}
        serial: {type: string, maxLength: 64, description: "Kept as given, trimmed; ANSI/CTA-2063-A for C1, C2, C3, C5, C6."}
        registration_mark: {type: string, maxLength: 32}
        manufacturer: {type: string, maxLength: 100}
        model: {type: string, maxLength: 100}
        owner_ref: {type: string, maxLength: 64, description: "Certified UA: the registry person record of the owner (Art. 14(3)(d))."}
        class_label: {$ref: "#/components/schemas/ClassLabel"}
        mtom_g: {type: integer, minimum: 1, maximum: 10000000}
        rid_capability: {$ref: "#/components/schemas/RIDCapability"}
    RegistryUASPatch:
      type: object
      properties:
        registration_mark: {type: string, maxLength: 32}
        manufacturer: {type: string, maxLength: 100}
        model: {type: string, maxLength: 100}
        owner_ref: {type: string, maxLength: 64}
        class_label: {$ref: "#/components/schemas/ClassLabel"}
        mtom_g: {type: integer, minimum: 1, maximum: 10000000}
        rid_capability: {$ref: "#/components/schemas/RIDCapability"}
    RegistryUAS:
      type: object
      required: [id, operator_id, serial, manufacturer_code, manufacturer, model, rid_capability, status, status_reason, registered_at, registry_version, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        operator_id: {type: string}
        serial: {type: string}
        manufacturer_code: {type: string}
        registration_mark: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        owner_ref: {type: string}
        class_label: {$ref: "#/components/schemas/ClassLabel"}
        mtom_g: {type: integer}
        rid_capability: {$ref: "#/components/schemas/RIDCapability"}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        status_reason: {type: string}
        registered_at: {type: string, format: date-time}
        registry_version: {type: integer, format: int64}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    RegistryUASList:
      type: object
      required: [uas]
      properties:
        uas:
          type: array
          items: {$ref: "#/components/schemas/RegistryUAS"}
        next_after: {type: string}
    RegistryPilotInput:
      type: object
      required: [person_ref, name]
      properties:
        person_ref: {type: string, minLength: 4, maxLength: 64, description: "The national id; stored as a keyed hash and its last four characters."}
        name: {type: string, maxLength: 200}
        operator_id: {type: string, maxLength: 32}
    RegistryPilotPatch:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        operator_id: {type: string, maxLength: 32, description: An empty string detaches the pilot from its operator.}
    PilotCompetencyInput:
      type: object
      required: [competency, certificate_ref, valid_until]
      properties:
        competency: {type: string, maxLength: 41, description: "A1_A3, A2, STS_01, STS_02 or national_<code>."}
        certificate_ref: {type: string, maxLength: 64}
        valid_until: {type: string, format: date-time}
    PilotCompetency:
      type: object
      required: [competency, certificate_ref, valid_until, recorded_at, recorded_by]
      properties:
        competency: {type: string}
        certificate_ref: {type: string}
        valid_until: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        recorded_by: {type: string}
    RegistryPilot:
      type: object
      description: A remote pilot without personal data.
      required: [id, status, status_reason, competencies, registry_version, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        operator_id: {type: string}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        status_reason: {type: string}
        competencies:
          type: array
          items: {$ref: "#/components/schemas/PilotCompetency"}
        registry_version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    RegistryPilotList:
      type: object
      required: [pilots]
      properties:
        pilots:
          type: array
          items: {$ref: "#/components/schemas/RegistryPilot"}
        next_after: {type: string}
    RegistryPilotPersonalData:
      type: object
      required: [pilot_id, name, person_ref_last4]
      properties:
        pilot_id: {type: string}
        name: {type: string}
        person_ref_last4: {type: string}
    RegistryPurpose:
      type: string
      enum: [authorisation, identification]
    RegistryValidityStatus:
      type: string
      enum: [valid, suspended, revoked, unknown]
    RegistryValidateItem:
      type: object
      description: At least one key.
      properties:
        operator: {type: string, maxLength: 64}
        serial: {type: string, maxLength: 64}
        pilot: {type: string, maxLength: 32}
    RegistryValidateBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/RegistryValidateItem"}
    OperatorValidity:
      type: object
      required: [registration_number, status]
      properties:
        registration_number: {type: string, description: "The public part of the number asked (regnum.PublicPart); a secret part sent with it is never echoed or recorded."}
        status: {$ref: "#/components/schemas/RegistryValidityStatus"}
        valid_until: {type: string, format: date-time}
    UASValidity:
      type: object
      required: [serial, status]
      properties:
        serial: {type: string, description: As asked.}
        status: {$ref: "#/components/schemas/RegistryValidityStatus"}
        class_label: {$ref: "#/components/schemas/ClassLabel"}
        mtom_band: {type: string, description: "The MTOM band of REGISTRY_MTOM_BANDS_G: under_<g>g, or from_<g>g above the last bound."}
    CompetencyValidity:
      type: object
      required: [competency, valid_until]
      properties:
        competency: {type: string}
        valid_until: {type: string, format: date-time}
    PilotValidity:
      type: object
      required: [pilot, status, competencies]
      properties:
        pilot: {type: string, description: As asked.}
        status: {$ref: "#/components/schemas/RegistryValidityStatus"}
        competencies:
          type: array
          items: {$ref: "#/components/schemas/CompetencyValidity"}
    RegistryValidity:
      type: object
      description: One answer per key asked; status only.
      properties:
        operator: {$ref: "#/components/schemas/OperatorValidity"}
        uas: {$ref: "#/components/schemas/UASValidity"}
        pilot: {$ref: "#/components/schemas/PilotValidity"}
    RegistryValidityList:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/RegistryValidity"}
    RegistryChange:
      type: object
      required: [seq, entity_type, entity_id, public_key, status, at]
      properties:
        seq: {type: integer, format: int64}
        entity_type: {type: string, enum: [operator, uas, pilot]}
        entity_id: {type: string}
        public_key: {type: string, description: "The registration number, the serial or the pilot id."}
        status: {$ref: "#/components/schemas/RegistryStatus"}
        at: {type: string, format: date-time}
    RegistryChangePage:
      type: object
      required: [changes, next_since]
      properties:
        changes:
          type: array
          items: {$ref: "#/components/schemas/RegistryChange"}
        next_since: {type: integer, format: int64, description: Pass as since for the next page.}
    # WP-20: the import report, the public check and the portal. The
    # check, the applicant's status and the import report carry no
    # personal data (internal/registry's contract test); only
    # RegistryApplicationPersonalData does, for registrars.
    RegistryImportKind:
      type: string
      enum: [operators, uas]
    RegistryImportJSON:
      type: array
      description: A JSON export, an array of flat objects, kept as given and read by the rules file.
      items: {type: object, additionalProperties: true}
      x-go-type: json.RawMessage
    RegistryImportOutcome:
      type: object
      required: [record, source_id, action, status]
      properties:
        record: {type: integer, minimum: 1, description: The record's number in the file, 1 being the first after the header.}
        source_id: {type: string, description: The source's id of the record.}
        action: {type: string, enum: [created, updated, unchanged]}
        entity_id: {type: string, description: The registry id; absent in a dry run's create.}
        fields:
          type: array
          description: The fields an update changes (names only; the values are personal).
          items: {type: string}
        status: {$ref: "#/components/schemas/RegistryStatus"}
    RegistryImportReport:
      type: object
      required: [kind, dry_run, applied, records, created, updated, unchanged, rules_version, content_sha256, problems, outcomes]
      properties:
        kind: {$ref: "#/components/schemas/RegistryImportKind"}
        dry_run: {type: boolean}
        applied: {type: boolean, description: True when the import committed (never in a dry run).}
        records: {type: integer, minimum: 0}
        created: {type: integer, minimum: 0}
        updated: {type: integer, minimum: 0}
        unchanged: {type: integer, minimum: 0}
        registry_version: {type: integer, format: int64, description: The registry version the import committed as.}
        rules_version: {type: string}
        content_sha256: {type: string, description: SHA-256 of the exact bytes read.}
        problems:
          type: array
          maxItems: 100
          description: Every problem by record and field (records[<n>].<field>); with any, nothing is written.
          items: {$ref: "#/components/schemas/FieldProblem"}
        problems_truncated: {type: boolean}
        outcomes:
          type: array
          maxItems: 1000
          description: What was (or would be) done with each record, at most 1000; outcomes_truncated beyond.
          items: {$ref: "#/components/schemas/RegistryImportOutcome"}
        outcomes_truncated: {type: boolean}
    RegistryCheck:
      type: object
      description: The public answer for a registration number. Status only.
      required: [status]
      properties:
        status: {type: string, enum: [valid, suspended, revoked, unknown]}
        valid_until: {type: string, format: date-time, description: The end of validity of a registered number; absent for unknown.}
    RegistryApplicationState:
      type: string
      enum: [unverified, submitted, under_review, approved, refused]
    RegistryApplicationInput:
      type: object
      description: |
        A registration application: the 2019/947 Art. 14(2) field set of
        RegistryOperatorInput without the number (the authority issues
        it), the validity (set at approval) and the source. lang is the
        language of the e-mails (`en` or `ka`).
      required: [operator_type, postal_address, contact_email, contact_phone, lang]
      properties:
        operator_type: {$ref: "#/components/schemas/OperatorType"}
        full_name: {type: string, maxLength: 200}
        legal_name: {type: string, maxLength: 200}
        date_of_birth: {type: string, format: date}
        legal_identification_number: {type: string, maxLength: 64}
        postal_address: {type: string, maxLength: 500}
        contact_email: {type: string, maxLength: 254}
        contact_phone: {type: string, maxLength: 32}
        insurance_policy_number: {type: string, maxLength: 64}
        competency_confirmation: {type: boolean}
        authorisations:
          type: array
          maxItems: 100
          items: {type: object, additionalProperties: true}
        lang: {type: string, enum: [en, ka]}
    RegistryApplicationStatus:
      type: object
      description: What the applicant's link shows. No personal data.
      required: [application_id, state, submitted_at]
      properties:
        application_id: {type: string}
        state: {$ref: "#/components/schemas/RegistryApplicationState"}
        submitted_at: {type: string, format: date-time}
        verify_expires_at: {type: string, format: date-time, description: While unverified, when the verification link expires.}
        decided_at: {type: string, format: date-time}
        refusal_reason: {type: string}
        registration_number: {type: string, description: Once approved, the public part of the number issued.}
    RegistryApplication:
      type: object
      description: An application as registrars list it, without personal data.
      required: [application_id, kind, state, operator_type, lang, submitted_at]
      properties:
        application_id: {type: string}
        kind: {type: string, enum: [operator_registration]}
        state: {$ref: "#/components/schemas/RegistryApplicationState"}
        operator_type: {$ref: "#/components/schemas/OperatorType"}
        lang: {type: string, enum: [en, ka]}
        submitted_at: {type: string, format: date-time}
        verified_at: {type: string, format: date-time}
        registrar_id: {type: string}
        review_started_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        refusal_reason: {type: string}
        registration_number: {type: string, description: The public part issued at approval.}
        operator_id: {type: string, description: The operator registered at approval.}
        valid_until: {type: string, format: date-time}
    RegistryApplicationPage:
      type: object
      required: [applications]
      properties:
        applications:
          type: array
          items: {$ref: "#/components/schemas/RegistryApplication"}
        next_cursor: {type: string}
    RegistryApplicationPersonalData:
      type: object
      description: An application's content (registrars, with a purpose).
      required: [application_id, operator_type]
      properties:
        application_id: {type: string}
        operator_type: {$ref: "#/components/schemas/OperatorType"}
        full_name: {type: string}
        legal_name: {type: string}
        date_of_birth: {type: string}
        legal_identification_number: {type: string}
        postal_address: {type: string}
        contact_email: {type: string}
        contact_phone: {type: string}
        insurance_policy_number: {type: string}
        competency_confirmation: {type: boolean}
        authorisations:
          type: array
          items: {type: object, additionalProperties: true}
    RegistryApplicationApproval:
      type: object
      properties:
        valid_until: {type: string, format: date-time, description: "Default: REGISTRY_APPLICATION_VALIDITY_S from now."}
    RegistryApplicationRefusal:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    OperatorLinkRequest:
      type: object
      required: [registration_number]
      properties:
        registration_number: {type: string, minLength: 1, maxLength: 64}
        lang: {type: string, enum: [en, ka], default: en}
    # WP-7: Remote ID receivers, observations and raw frames.
    RIDReceiverOwner:
      type: string
      enum: [authority, third_party]
    RIDReceiverStatus:
      type: string
      enum: [enabled, disabled]
    RIDReportingField:
      type: string
      enum: [transmitter, payload_hex, rssi_dbm, rx_ts, receiver_position]
    RIDReceiverConfig:
      type: object
      description: |
        What the receiver is told to do (GET .../config). Absent members
        take the defaults of the ingest's configuration
        (RID_DEFAULT_* variables), so a default is never a literal
        here (INV-03).
      properties:
        batch_interval_ms: {type: integer, minimum: 100, maximum: 1000, description: How often the receiver posts a batch; at most one second of reception per batch.}
        backlog_cap: {type: integer, minimum: 1, maximum: 10000000, description: Observations the receiver buffers while the ingest is unreachable, replayed with backlog true and the original rx_ts.}
        heartbeat_interval_s: {type: integer, minimum: 1, maximum: 300}
        position_tolerance_m: {type: number, format: double, exclusiveMinimum: 0, maximum: 100000, description: Distance from the pinned position beyond which a heartbeat's reported position is counted as a deviation (T2).}
        reporting_fields:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {$ref: "#/components/schemas/RIDReportingField"}
    RIDPosition:
      type: object
      required: [lat_deg, lon_deg]
      properties:
        lat_deg: {type: number, format: double, minimum: -90, maximum: 90}
        lon_deg: {type: number, format: double, minimum: -180, maximum: 180}
        alt_hae_m: {type: [number, "null"], format: double, minimum: -1000, maximum: 10000, description: Height above the WGS-84 ellipsoid, as the receiver's GNSS reports it.}
    RIDReceiverInput:
      type: object
      required: [id, label, lat_deg, lon_deg, owner]
      properties:
        id: {type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$", description: Slug; the receiver id of every batch and status.}
        label: {type: string, minLength: 1, maxLength: 200, description: The receiver's display label (rid_receivers.name).}
        lat_deg: {type: number, format: double, minimum: -90, maximum: 90, description: Pinned position.}
        lon_deg: {type: number, format: double, minimum: -180, maximum: 180}
        owner: {$ref: "#/components/schemas/RIDReceiverOwner"}
        owner_name: {type: string, maxLength: 200}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
    RIDReceiverPatch:
      type: object
      description: Members present are changed; lat_deg and lon_deg come together.
      properties:
        label: {type: string, minLength: 1, maxLength: 200, description: The receiver's display label (rid_receivers.name).}
        lat_deg: {type: number, format: double, minimum: -90, maximum: 90}
        lon_deg: {type: number, format: double, minimum: -180, maximum: 180}
        owner: {$ref: "#/components/schemas/RIDReceiverOwner"}
        owner_name: {type: string, maxLength: 200}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
    RIDReceiver:
      type: object
      required: [id, label, lat_deg, lon_deg, owner, status, key_generation, position_deviations, config, version, created_at, created_by, updated_at, updated_by]
      properties:
        id: {type: string}
        label: {type: string}
        lat_deg: {type: number, format: double}
        lon_deg: {type: number, format: double}
        owner: {$ref: "#/components/schemas/RIDReceiverOwner"}
        owner_name: {type: string}
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        disabled_by: {type: string, description: Who disabled it, as the audit log names them.}
        disabled_reason: {type: string}
        disabled_at: {type: string, format: date-time}
        key_generation: {type: integer}
        previous_key_valid_until: {type: string, format: date-time, description: The previous generation's keys are accepted until then.}
        last_seen_at: {type: string, format: date-time, description: The last heartbeat, on api's clock; absent when never heard.}
        last_position: {$ref: "#/components/schemas/RIDPosition"}
        position_deviation_m: {type: number, format: double, description: Distance of the last reported position from the pinned one.}
        position_deviations: {type: integer, format: int64, description: Heartbeats whose position was beyond the tolerance.}
        firmware: {type: string}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
    RIDReceiverList:
      type: object
      required: [receivers]
      properties:
        receivers:
          type: array
          items: {$ref: "#/components/schemas/RIDReceiver"}
        next_after: {type: string, description: Pass as after for the next page; absent on the last page.}
    RIDReceiverCredentials:
      type: object
      description: Shown once. Neither value can be read back; a lost key is replaced by a rotation.
      required: [generation, bearer_key, hmac_secret_hex, signature_header]
      properties:
        generation: {type: integer}
        bearer_key: {type: string, description: "Authorization: Bearer <bearer_key> on every receiver request."}
        hmac_secret_hex: {type: string, pattern: "^[0-9a-f]{64}$", description: The 32-byte HMAC-SHA256 secret, hex.}
        signature_header: {type: string, enum: [X-Report-Signature]}
    RIDReceiverCreated:
      type: object
      required: [receiver, credentials]
      properties:
        receiver: {$ref: "#/components/schemas/RIDReceiver"}
        credentials: {$ref: "#/components/schemas/RIDReceiverCredentials"}
    RIDReceiverStatusInput:
      type: object
      required: [status, reason]
      properties:
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        reason: {type: string, minLength: 1, maxLength: 500}
    RIDKeyRotationInput:
      type: object
      properties:
        grace_s: {type: integer, minimum: 0, maximum: 604800, description: How long the previous keys keep working; default RID_KEY_ROTATION_GRACE_S.}
    RIDIngestLimits:
      type: object
      required: [max_batch_bytes, max_observations, max_payload_bytes, max_skew_s, nonce_window_s]
      properties:
        max_batch_bytes: {type: integer}
        max_observations: {type: integer}
        max_payload_bytes: {type: integer}
        max_skew_s: {type: integer}
        nonce_window_s: {type: integer, description: A nonce is refused if seen again from this receiver within this window (twice max_skew_s).}
    RIDReceiverConfigView:
      type: object
      required: [receiver_id, status, config, limits, signature_header, server_time_ms]
      properties:
        receiver_id: {type: string}
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        config: {$ref: "#/components/schemas/RIDReceiverConfig"}
        limits: {$ref: "#/components/schemas/RIDIngestLimits"}
        signature_header: {type: string, enum: [X-Report-Signature]}
        server_time_ms: {type: integer, format: int64, description: The authority's clock, so a receiver can see its own skew.}
    RIDHeartbeat:
      type: object
      required: [receiver_id, sent_at_ms, nonce]
      properties:
        receiver_id: {type: string}
        sent_at_ms: {type: integer, format: int64, description: Epoch milliseconds on the receiver's clock.}
        nonce: {type: string, minLength: 1, maxLength: 256}
        position: {$ref: "#/components/schemas/RIDPosition"}
        firmware: {type: string, maxLength: 100}
        queue_depth: {type: integer, minimum: 0, description: Observations the receiver holds unsent.}
    RIDHeartbeatAck:
      type: object
      required: [receiver_id, status, last_seen_at, server_time_ms]
      properties:
        receiver_id: {type: string}
        status: {$ref: "#/components/schemas/RIDReceiverStatus"}
        last_seen_at: {type: string, format: date-time}
        position_deviation_m: {type: number, format: double}
        position_tolerance_m: {type: number, format: double}
        server_time_ms: {type: integer, format: int64}
    RIDObservation:
      type: object
      description: One frame as the receiver heard it (schemas/rid/observation/v1.json).
      required: [transmitter, payload_hex]
      properties:
        transmitter: {type: string, pattern: "^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$", description: The BT or Wi-Fi MAC address the frame came from.}
        payload_hex: {type: string, minLength: 2, maxLength: 1024, pattern: "^([0-9A-Fa-f]{2})+$", description: The ODID message or message pack, as received.}
        rssi_dbm: {type: [number, "null"], format: double, minimum: -200, maximum: 50}
        rx_ts: {type: [string, "null"], format: date-time, description: "Reception time on the receiver's clock, RFC 3339 UTC; null when unknown (placed at arrival, T-12)."}
        receiver_position: {$ref: "#/components/schemas/RIDPosition"}
    RIDObservationBatch:
      type: object
      description: rid/observation/v1, the exact bytes signed.
      required: [receiver_id, sent_at_ms, nonce, observations]
      properties:
        receiver_id: {type: string}
        sent_at_ms: {type: integer, format: int64}
        nonce: {type: string, minLength: 1, maxLength: 256}
        backlog: {type: boolean, default: false, description: True when the batch replays observations buffered while the ingest was unreachable (T-04).}
        observations:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/RIDObservation"}
    RIDObservationAck:
      type: object
      required: [batch_id, accepted, duplicates]
      properties:
        batch_id: {type: string, description: "<receiver_id>:<nonce>"}
        accepted: {type: integer, description: Observations written to the work queue.}
        duplicates: {type: integer, description: Observations already accepted within the dedupe window, not queued again.}
    RIDFrame:
      type: object
      required: [frame_id, ingest_ts, receiver_id, transmitter, payload_hex, payload_sha256_hex, backlog, sent_at_ms, nonce]
      properties:
        frame_id: {type: string}
        ingest_ts: {type: string, format: date-time}
        receiver_ts: {type: string, format: date-time, description: "The receiver's clock (rid_observations.receiver_ts; rx_ts in the batch). Not comparable with another clock."}
        receiver_id: {type: string}
        transmitter: {type: string}
        msg_type: {type: integer}
        payload_hex: {type: string}
        payload_sha256_hex: {type: string}
        rssi_dbm: {type: number, format: double}
        backlog: {type: boolean}
        receiver_position: {$ref: "#/components/schemas/RIDPosition"}
        sent_at_ms: {type: integer, format: int64}
        nonce: {type: string}
    RIDFramePage:
      type: object
      required: [frames, truncated]
      properties:
        frames:
          type: array
          items: {$ref: "#/components/schemas/RIDFrame"}
        truncated: {type: boolean, description: The window holds more frames than were returned.}
    CellOwnership:
      type: object
      required: [version, assignments, updated_by, updated_at]
      properties:
        version: {type: integer, format: int64, minimum: 1, description: Rises by one with every change.}
        assignments:
          type: object
          description: cell3 name (`c3:<lat_idx>:<lon_idx>`, uspace-core geodesy/cell) -> detect worker id.
          additionalProperties: {type: string}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    CellOwnershipInput:
      type: object
      required: [assignments, reason]
      properties:
        assignments:
          type: object
          description: cell3 name -> detect worker id (`^[a-z0-9][a-z0-9_-]{0,62}$`); the whole map, replacing the stored one.
          maxProperties: 64800
          additionalProperties: {type: string, maxLength: 63}
        reason: {type: string, minLength: 1, maxLength: 500}
    SourceType:
      type: string
      description: The adapter type (04 §2 `source`), one per adapter process.
      enum: [direct_rid, network_rid, ansp_feed]
    SourceSwitchInput:
      type: object
      required: [enabled, reason]
      properties:
        enabled: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500}
    SourceControl:
      type: object
      required: [source_type, enabled, reason, actor, changed_at, version]
      properties:
        source_type: {$ref: "#/components/schemas/SourceType"}
        instance_id: {type: string, description: Absent for the switch of the whole type.}
        enabled: {type: boolean}
        reason: {type: string}
        actor: {type: string, description: Who switched it, as the audit log names them.}
        changed_at: {type: string, format: date-time}
        version: {type: integer, format: int64}
    SourceSwitchResult:
      type: object
      required: [control, changed, epoch, version]
      properties:
        control: {$ref: "#/components/schemas/SourceControl"}
        changed: {type: boolean, description: False when the switch already held this state; nothing was written.}
        epoch: {type: string}
        version: {type: integer, format: int64, description: The version of the whole state after the switch.}
    SourceView:
      type: object
      required: [source_type, switch, health]
      properties:
        source_type: {$ref: "#/components/schemas/SourceType"}
        instance_id: {type: string}
        switch: {type: string, enum: [enabled, disabled]}
        disabled_by: {type: string, enum: [type, instance, default_deny]}
        disabled_by_who: {type: string}
        disabled_reason: {type: string}
        health: {type: string, enum: [healthy, stale, lagging, never_heard]}
        age_s: {type: number, format: double, description: Seconds since the adapter last heard the source.}
        lag_s: {type: number, format: double}
        status_age_s: {type: number, format: double, description: Seconds since the adapter's last status reached api.}
        counters:
          type: object
          additionalProperties: {type: integer, format: int64}
    SourceOverview:
      type: object
      required: [epoch, version, default_deny, controls, sources]
      properties:
        epoch: {type: string}
        version: {type: integer, format: int64}
        default_deny: {type: boolean}
        controls:
          type: array
          items: {$ref: "#/components/schemas/SourceControl"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/SourceView"}
    ZoneState:
      type: string
      enum: [draft, approved, published, superseded]
    ZoneDataset:
      type: string
      enum: [zones, uspace_airspace]
    ED318Feature:
      type: object
      description: One ED-318 UASZone feature (GeoJSON Feature), validated by uspace-core ed318.Parse; kept as given.
      x-go-type: json.RawMessage
    ED318Collection:
      type: object
      description: An ED-318 FeatureCollection exactly as uspace-core ed318.Export writes it.
      x-go-type: json.RawMessage
    ZoneDraftInput:
      type: object
      required: [feature, valid_from, valid_to]
      properties:
        feature: {$ref: "#/components/schemas/ED318Feature"}
        valid_from: {type: string, format: date-time, description: Start of the period of validity (947 Art. 15(3)).}
        valid_to: {type: string, format: date-time, description: End of the period of validity; after valid_from.}
    ZoneApproveInput:
      type: object
      required: [zone_version]
      properties:
        zone_version: {type: integer, minimum: 1, description: The version approved; it must be the newest and a draft.}
    ZoneExtension:
      type: object
      description: A member that uses this project's extension of ED-318 (LESSONS Z-05).
      required: [field, reason]
      properties:
        field: {type: string}
        reason: {type: string}
    USpaceDesignation:
      type: object
      description: |
        The 03 §1 designation of a U-space airspace (2021/664 Art. 3 and
        5); `airspace_name` is the 03 §1 `name` column (the feature's
        ED-318 name list is the published one).
      required: [airspace_name, services_required, uas_requirements, service_performance, operational_conditions, airspace_constraints, in_controlled_airspace]
      properties:
        airspace_name: {type: string, minLength: 1, maxLength: 200}
        services_required:
          type: array
          minItems: 4
          maxItems: 6
          uniqueItems: true
          items: {type: string, enum: [NID, GEO, FA, TI, WX, CM]}
        uas_requirements: {type: object, additionalProperties: true, description: Art. 3(4)(a).}
        service_performance:
          type: object
          description: Art. 3(4)(c); nid_update_hz, ti_update_hz and cis_latency_s are required, other members pass.
          additionalProperties: true
          required: [nid_update_hz, ti_update_hz, cis_latency_s]
          properties:
            nid_update_hz: {type: number, format: double, exclusiveMinimum: 0}
            ti_update_hz: {type: number, format: double, exclusiveMinimum: 0}
            cis_latency_s: {type: number, format: double, exclusiveMinimum: 0}
        operational_conditions: {type: object, additionalProperties: true, description: Art. 3(4)(b).}
        airspace_constraints:
          type: object
          description: Art. 3(4)(d), including any height ceiling.
          additionalProperties: true
          properties:
            max_height_agl_m: {type: number, format: double, exclusiveMinimum: 0}
        adjacent_ids:
          type: array
          maxItems: 1000
          items: {type: string, minLength: 1, maxLength: 7}
        risk_assessment_ref: {type: string, maxLength: 200}
        in_controlled_airspace: {type: boolean}
        ats_provider_id: {type: string, maxLength: 64}
        cisp_id: {type: string, maxLength: 64}
        designation_ref: {type: string, maxLength: 200}
        aip_ref: {type: string, maxLength: 200}
    USpaceDraftInput:
      type: object
      required: [feature, designated_from, designated_to, designation]
      properties:
        feature: {$ref: "#/components/schemas/ED318Feature"}
        designated_from: {type: string, format: date-time}
        designated_to: {type: string, format: date-time}
        designation: {$ref: "#/components/schemas/USpaceDesignation"}
    ZoneVersion:
      type: object
      required: [dataset, identifier, zone_version, state, type, country, feature, valid_from, valid_to, extensions, created_at, created_by]
      properties:
        dataset: {$ref: "#/components/schemas/ZoneDataset"}
        identifier: {type: string}
        zone_version: {type: integer}
        state: {$ref: "#/components/schemas/ZoneState"}
        type: {type: string, enum: [PROHIBITED, REQ_AUTHORIZATION, CONDITIONAL, NO_RESTRICTION, USPACE]}
        country: {type: string}
        feature: {$ref: "#/components/schemas/ED318Feature"}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time}
        extensions:
          type: array
          items: {$ref: "#/components/schemas/ZoneExtension"}
        designation: {$ref: "#/components/schemas/USpaceDesignation"}
        published_version: {type: integer, format: int64}
        published_at: {type: string, format: date-time}
        published_by: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        approved_at: {type: string, format: date-time}
        approved_by: {type: string}
    ZoneVersionList:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items: {$ref: "#/components/schemas/ZoneVersion"}
        next_after: {type: string, description: Pass as `after` for the next page; absent on the last.}
    ZoneVersionPage:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items: {$ref: "#/components/schemas/ZoneVersion"}
        next_before: {type: integer, description: Pass as `before` for the next page; absent on the last.}
    ZoneImportResult:
      type: object
      required: [format, created]
      properties:
        format: {type: string, enum: [ed318, ed269]}
        created:
          type: array
          items: {$ref: "#/components/schemas/ZoneVersion"}
    GovGeKindRule:
      type: object
      description: What the authority says one kind of airspace.gov.ge zone is; nothing has a default.
      required: [restriction, uom, lower_reference, upper_reference, applicability]
      properties:
        restriction: {type: string, enum: [PROHIBITED, REQ_AUTHORISATION, CONDITIONAL, NO_RESTRICTION]}
        uom: {type: string, enum: [M, FT]}
        lower_reference: {type: string, enum: [AGL, AMSL, WGS84]}
        upper_reference: {type: string, enum: [AGL, AMSL, WGS84]}
        lower_limit: {type: number, format: double}
        upper_limit: {type: number, format: double}
        applicability:
          type: array
          minItems: 1
          maxItems: 32
          description: ED-269 applicability periods, as published in an ED-269 file.
          items:
            type: object
            additionalProperties: true
        reason:
          type: array
          maxItems: 9
          items: {type: string}
        message: {type: string, maxLength: 200}
    GovGeRules:
      type: object
      required: [country, authority, kinds]
      properties:
        country: {type: string, pattern: "^[A-Z]{3}$"}
        authority:
          type: object
          description: The ED-269 zoneAuthority entry every zone names (name, purpose, ...).
          additionalProperties: {type: string}
        kinds:
          type: object
          maxProperties: 64
          additionalProperties: {$ref: "#/components/schemas/GovGeKindRule"}
        identifiers:
          type: object
          maxProperties: 10000
          description: Variable name -> ED-269 identifier, for names longer than 7 characters.
          additionalProperties: {type: string, maxLength: 7}
    GovGeImportInput:
      type: object
      required: [points_js, page_html, rules]
      properties:
        points_js: {type: string, description: "The saved /Airspace/leaflet/zone/points.js."}
        page_html: {type: string, description: The saved page, for the circles' radii.}
        rules: {$ref: "#/components/schemas/GovGeRules"}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time}
        lang: {type: string, maxLength: 5}
    PublicationRow:
      type: object
      description: |
        The F1 outbox row (dataset, version, payload hash), written
        `pending` with the detached JWS of the payload (WP-6); the
        sender re-signs it at every attempt. GET /v1/publications shows
        its later states.
      required: [id, dataset, version, payload_hash, feature_count, signature, state, created_at]
      properties:
        id: {type: integer, format: int64}
        dataset: {type: string}
        version: {type: integer, format: int64}
        payload_hash: {type: string, description: SHA-256 of the payload bytes, lower-case hex.}
        feature_count: {type: integer}
        signature: {type: [string, "null"]}
        state: {type: string, enum: [pending, sent, acknowledged, failed, conflict, superseded]}
        created_at: {type: string, format: date-time}
    ZonePublication:
      type: object
      required: [dataset, zones_version, published, publication]
      properties:
        dataset: {$ref: "#/components/schemas/ZoneDataset"}
        zones_version: {type: integer, format: int64}
        published:
          type: array
          items: {$ref: "#/components/schemas/ZoneVersion"}
        publication: {$ref: "#/components/schemas/PublicationRow"}
    ZoneApplicability:
      type: object
      required: [identifier, zone_version, at, applicability]
      properties:
        identifier: {type: string}
        zone_version: {type: integer}
        at: {type: string, format: date-time}
        applicability: {type: string, enum: [applies, not_applicable, unknown]}
        reason: {type: string}
    # WP-6: the CISP client.
    PublicationStatus:
      type: object
      required: [cisp_configured, publications, cache, heartbeat, subscription]
      properties:
        cisp_configured:
          type: boolean
          description: false when CISP_BASE_URL is unset; nothing is sent or pulled and the ages grow.
        publications:
          type: array
          items: {$ref: "#/components/schemas/PublicationOutboxRow"}
        cache:
          type: array
          items: {$ref: "#/components/schemas/CISCacheState"}
        heartbeat: {$ref: "#/components/schemas/PublisherHeartbeatState"}
        subscription: {$ref: "#/components/schemas/CISSubscriptionState"}
    PublicationOutboxRow:
      type: object
      required: [id, dataset, version, payload_hash, feature_count, content_type, state, attempts, created_at, created_by, state_changed_at, age_s]
      properties:
        id: {type: integer, format: int64}
        dataset: {type: string, enum: [zones, uspace_airspace, ussp_list]}
        version: {type: integer, format: int64}
        payload_hash: {type: string, description: SHA-256 of the payload bytes, lower-case hex.}
        feature_count: {type: integer}
        content_type: {type: string}
        state: {type: string, enum: [pending, sent, acknowledged, failed, conflict, superseded]}
        attempts: {type: integer}
        signature_kid: {type: [string, "null"], description: The kid of the publication key that signed the last attempt.}
        signed_at: {type: [string, "null"], format: date-time}
        next_retry_at: {type: [string, "null"], format: date-time}
        cisp_version: {type: [integer, "null"], format: int64, description: The CISP's version once acknowledged.}
        conflict_version: {type: [integer, "null"], format: int64, description: The CISP's current version a 412 showed.}
        last_attempt_at: {type: [string, "null"], format: date-time}
        last_status: {type: [integer, "null"], description: The CISP's last HTTP status; null for a network error.}
        last_error: {type: [string, "null"]}
        acknowledged_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        state_changed_at: {type: string, format: date-time}
        age_s:
          type: [number, "null"]
          format: double
          description: Seconds since the row was written while it is pending or sent (not yet published); null otherwise.
    CISCacheState:
      type: object
      required: [dataset, cis_version, cis_age_s, stale]
      properties:
        dataset: {type: string, enum: [zones, uspace_airspace, ussp_list, restrictions]}
        cis_version: {type: [integer, "null"], format: int64, description: The version held; null when none was ever pulled.}
        etag: {type: [string, "null"]}
        cis_updated_at: {type: [string, "null"], format: date-time}
        fetched_at: {type: [string, "null"], format: date-time}
        checked_at: {type: [string, "null"], format: date-time, description: When the CISP last confirmed the version held.}
        cis_age_s: {type: [number, "null"], format: double, description: Seconds since checked_at; null when nothing is held.}
        stale: {type: boolean, description: "cis_age_s beyond the policy's cis_stale_bound_s, or nothing held: the console shows cis_stale."}
        feature_count: {type: [integer, "null"]}
        held_version: {type: [integer, "null"], format: int64, description: A newer version not used because its publisher's signature did not verify.}
        held_reason: {type: [string, "null"]}
        refused_version: {type: [integer, "null"], format: int64, description: A newer version refused whole by ed318.Parse or the pinned schema (T9).}
        refused_reason: {type: [string, "null"]}
        last_error: {type: [string, "null"], description: The last pull failure, cleared by the next success.}
    PublisherHeartbeatState:
      type: object
      required: [enabled, interval_s, consecutive_failures]
      properties:
        enabled: {type: boolean}
        interval_s: {type: number, format: double}
        last_success_at: {type: [string, "null"], format: date-time}
        last_status: {type: [integer, "null"], description: The CISP's last HTTP status; null for a network error or before the first.}
        last_error: {type: [string, "null"]}
        consecutive_failures: {type: integer}
    CISSubscriptionState:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean, description: false without CIS_CALLBACK_URL; the 60 s reconciliation alone keeps the cache.}
        callback_url: {type: [string, "null"]}
        subscription_id: {type: [string, "null"]}
        status: {type: [string, "null"]}
        last_error: {type: [string, "null"]}

    # WP-12: violations.
    PictureFrame:
      type: object
      description: |
        A frame of the common console frame (uspace-lab
        schemas/common/envelope/v1 with the body named by `schema`).
      required: [schema, msg_id, producer, rx_ts, captured_at, time_source, backlog, body]
      properties:
        schema: {type: string}
        msg_id: {type: string}
        producer: {type: string}
        ts: {type: [string, "null"]}
        rx_ts: {type: string}
        captured_at: {type: string}
        time_source: {type: string}
        backlog: {type: boolean}
        body: {type: object, additionalProperties: true}
    PictureSourceState:
      type: object
      description: The body of source/status/v1 (uspace-lab schemas/common) with lagging and lag_s.
      required: [source, source_instance, state, since, age_s, disabled_by, counters]
      properties:
        source: {type: string}
        source_instance: {type: [string, "null"]}
        state: {type: string, enum: [live, stale, disabled, down, unknown]}
        since: {type: string, format: date-time}
        age_s: {type: [number, "null"]}
        disabled_by: {type: [string, "null"], enum: [type, instance, default_deny, null]}
        disabled_by_who: {type: [string, "null"]}
        counters:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        lagging: {type: boolean}
        lag_s: {type: [number, "null"]}
    PictureSources:
      type: object
      required: [server_ts, sources, nats]
      properties:
        server_ts: {type: string, format: date-time}
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PictureSourceState"
        projection_age_s: {type: [number, "null"], description: Age of the registry projection (database clock).}
        zones_version: {type: [string, "null"]}
        cis_version: {type: [string, "null"]}
        cis_age_s: {type: [number, "null"]}
        nats: {type: string, enum: [connected, unavailable]}
        nats_since: {type: [string, "null"], format: date-time}
    ViolationKind:
      type: string
      enum: [height_120m, zone_incursion, unregistered, no_authorisation, identification_mismatch, rid_absent]
    ViolationStatus:
      type: string
      enum: [new, reviewed, dismissed, escalated]
    ViolationPeak:
      type: object
      required: [name, value]
      properties:
        name: {type: string, description: "The number the violation rested on: height_agl_m for height_120m."}
        value: {type: number, format: double}
    ViolationSummary:
      type: object
      required: [violation_id, kind, severity, track_id, detector_state, opened_at, last_captured_at, policy_version, in_uspace,
                 evidence_trust, excerpt_samples, cell5, status]
      properties:
        violation_id: {type: string}
        kind: {$ref: "#/components/schemas/ViolationKind"}
        severity: {type: string, enum: [info, warning, critical]}
        track_id: {type: string}
        serial: {type: [string, "null"], description: As broadcast.}
        operator_reg: {type: [string, "null"], description: "As broadcast; the public part only (regnum.PublicPart, G-04)."}
        zone_id: {type: [string, "null"], description: country/identifier of the zone judged.}
        zone_type: {type: [string, "null"]}
        detector_state: {type: string, enum: [raised, updated, cleared]}
        opened_at: {type: string, format: date-time}
        closed_at: {type: [string, "null"], format: date-time}
        clear_reason:
          type: [string, "null"]
          description: |
            resolved (shown false past the hysteresis), stale, landed,
            source_disabled, flight_ended, reconfigured (the zone set or
            policy changed and the aircraft's last sample no longer
            raised it) or detector_silent (detect stopped republishing
            it, a restart: closed by api, not judged).
        last_captured_at: {type: string, format: date-time}
        policy_version: {type: integer, format: int64, description: 0 is the documented defaults before any policy reached detect.}
        peak: {$ref: "#/components/schemas/ViolationPeak"}
        in_uspace: {type: boolean}
        evidence_trust: {type: string, enum: [authenticated, provider, surveillance, broadcast, sensor]}
        excerpt_samples: {type: integer}
        cell5: {type: string}
        status: {$ref: "#/components/schemas/ViolationStatus"}
        reviewed_at: {type: [string, "null"], format: date-time}
    Violation:
      allOf:
        - $ref: "#/components/schemas/ViolationSummary"
        - type: object
          required: [alert_key, detail, evidence_refs, evidence_track_ids, evidence_excerpt, excerpt_truncated, incident_requested]
          properties:
            alert_key: {type: string}
            registry_uas_id: {type: [string, "null"]}
            zone_version: {type: [integer, "null"], format: int64}
            detail: {type: object, additionalProperties: true, description: "The judgement's numbers and flags as uspace-core gave them (violation/v1 detail)."}
            clearing_detail: {type: object, additionalProperties: true}
            terrain_source: {type: object, additionalProperties: true, description: The DEM dataset and spacing of a height over the ground (D-05).}
            evidence_refs:
              type: array
              items: {type: object, additionalProperties: true}
            evidence_track_ids:
              type: array
              items: {type: string}
            evidence_excerpt:
              type: array
              description: The track samples copied at detection and appended while it held (violation/v1 evidence_excerpt).
              items: {type: object, additionalProperties: true}
            excerpt_truncated: {type: boolean, description: Samples past the bound were left out.}
            reviewed_by: {type: [string, "null"]}
            review_note: {type: [string, "null"]}
            incident_requested: {type: boolean}
            excerpt_segmenting:
              $ref: "#/components/schemas/ViolationExcerptSegmenting"
    # WP-23: the excerpt cut into segments and holes for the console, by
    # the rule of the evidence packs (WP-17, B-13), so the console draws
    # holes as holes and never judges where one is.
    ViolationExcerptSegmenting:
      type: object
      description: |
        The evidence excerpt cut as an evidence pack cuts a track
        (docs/runbooks/incidents.md, B-13): at every silence longer than
        the active policy's `max_gap_s`, every writer gap recorded in the
        window and every sample without a position; each hole carries
        every cause known of it and nothing is interpolated across it.
        Present on `GET /v1/violations/{violation_id}` only. `unavailable`
        (with `reason`) when the policy cannot be read: the console then
        draws the samples unjoined. `writer_gaps_read: false` when the
        recorded gaps could not be read: a silence is then labelled
        `writer_gaps_unread`, never `no recorded cause`.
      required: [state, segments, holes, unplaced]
      properties:
        state: {type: string, enum: [cut, unavailable]}
        reason: {type: string, description: Why the excerpt was not cut (state unavailable).}
        max_gap_s: {type: number, format: double, description: The active policy's max_gap_s that cut it.}
        policy_version: {type: integer, format: int64}
        writer_gaps_read: {type: boolean}
        segments:
          type: array
          items:
            $ref: "#/components/schemas/ViolationExcerptSegment"
        holes:
          type: array
          items:
            $ref: "#/components/schemas/ViolationExcerptHole"
        unplaced:
          type: array
          description: Indexes of excerpt samples without a readable captured_at, left out of the cut.
          items: {type: integer}
    ViolationExcerptSegment:
      type: object
      required: [from, to, sample_indexes]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        sample_indexes:
          type: array
          description: Indexes into evidence_excerpt, oldest first.
          items: {type: integer}
    ViolationExcerptHole:
      type: object
      required: [from, to, duration_s, causes, recorded]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        duration_s: {type: number, format: double}
        causes:
          type: array
          description: silence, no recorded cause, writer_gap, sample_without_position, writer_gaps_unread.
          items: {type: string}
        recorded:
          type: array
          description: The recorded writer gaps inside the hole, as an evidence pack words them.
          items: {type: string}
    ViolationPage:
      type: object
      required: [violations]
      properties:
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ViolationSummary"
        next_cursor:
          type: string
          description: Pass as cursor for the next page; absent on the last page.
