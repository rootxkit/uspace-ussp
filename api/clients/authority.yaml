        newest_track_age_s: {type: [number, "null"], format: double}
        writer_gaps: {type: integer, description: Recorded writer gaps of the tracks table in the window.}
        writer_gap_causes:
          type: array
          items: {type: string}
        degraded: {type: boolean, description: True when the picture is older than the live window or a recorded gap falls in the window.}
    PoliceAircraftAnswer:
