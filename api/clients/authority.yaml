  # WP-6: the CISP client (spec 02 F1, F3). The publication outbox and
  # the subscriber's cache for the console, and the change-notification
  # receiver every CIS subscriber implements (M1).
  /v1/publications:
    get:
      operationId: listPublications
      tags: [cisp]
      summary: The publication outbox and the CIS subscriber's state
      description: |
        The F1 outbox rows, newest first, without payloads: each with its
        state (pending, sent, acknowledged, failed, conflict,
        superseded), attempts, the last answer of the CISP, the CISP's
        version once acknowledged (or the one a 412 showed), and, while
        pending or sent, `age_s`: how long the publication has not been
        published (spec 02 F1 failure rule). Beside them the
        subscriber's cache per dataset (`cis_version`, `cis_age_s`,
        `stale` beyond the policy's `cis_stale_bound_s`, a version held
        because its publisher's signature did not verify, a refused
        publication, the last pull error), the publisher heartbeat's
        last answer and the subscription. Nothing here is hidden when
        the CISP is unreachable: the ages grow.
      security:
        - sessionCookie: []
      x-roles: [admin, inspector, viewer]
      x-audit: none
      parameters:
        - {name: dataset, in: query, schema: {type: string, enum: [zones, uspace_airspace, ussp_list]}}
        - {name: state, in: query, schema: {type: string, enum: [pending, sent, acknowledged, failed, conflict, superseded]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: The outbox and the subscriber's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/cis/notifications:
    post:
      operationId: receiveCISNotification
      tags: [cisp]
      summary: A CIS change notification (compact JWS from the CISP or the ANSP)
      description: |
        The receiver path every CIS subscriber implements (M1). The body
        is a compact JWS (`application/jose`, at most 256 KiB) whose
        payload is `{iss, aud, sub, iat, jti, body}` with `body` a
        `cis/change/v1` record. There is no bearer token: the JWS is the
        credential. It is verified by uspace-core's CompactVerifier
        against an allow-list of two issuers, the CISP and the ANSP
        (`AUTHORITY_CIS_NOTIFY_ISSUERS`, M5), with `aud` one of this
        system's hosts (`AUTHORITY_AUDIENCES`, M19) and `iat` at most
        five minutes old; the `jti` is single-use and remembered in the
        database (a repeated delivery is acknowledged 204 and not acted
        on). The notification is a hint, never content: reasons
        `publication` and `restriction_*` start a pull of the dataset
        from the configured CISP over https (`pull_url` is followed only
        when it is https on the CISP's configured host and port; any
        other is counted and the configured CISP is read instead);
        `subscription_test`, `republished` and any reason this receiver
        does not know are acknowledged 204 without a pull (M16). Served
        outside the generated server (`x-cis-delivery`), because the
        JWS is read from the raw body.
      security: []
      x-cis-delivery: true
      x-audit: none
      requestBody:
        required: true
        content:
          application/jose:
            schema:
              type: string
              maxLength: 262144
      responses:
        "204":
          description: Accepted (a pull may have been started), or acknowledged without action.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-12: violations (spec 01 A7, 03 §1 violations, 04 §3.3
  # violation/v1). detect raises and clears them on alrt.v1; api's
  # consumer persists them (internal/violations). Reads carry no personal
  # data: the serial and the operator registration number are as
  # broadcast (registry records name them to viewers too).
  /v1/violations:
    get:
      operationId: listViolations
      tags: [violations]
      summary: Violations, newest first
      description: |
        Every filter is optional. `from` and `to` bound `opened_at`;
        `bbox` (`min_lon,min_lat,max_lon,max_lat`, WGS84 degrees, min
        below max) selects by the first position of the evidence excerpt
        (PostGIS). Pages are cut by `cursor` (the `next_cursor` of the
        previous page). A violation is open while `closed_at` is null.
      security:
        - sessionCookie: []
      x-roles: [inspector]
      x-audit: none
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ViolationStatus"}}
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ViolationKind"}}
        - {name: from, in: query, description: Inclusive lower bound of opened_at., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Exclusive upper bound of opened_at., schema: {type: string, format: date-time}}
        - {name: bbox, in: query, schema: {type: string, maxLength: 128}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: One page of violations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViolationPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/violations/{violation_id}:
    parameters:
      - {name: violation_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: getViolation
      tags: [violations]
      summary: One violation with its evidence excerpt
      security:
        - sessionCookie: []
      x-roles: [inspector]
      x-audit: none
      responses:
        "200":
          description: The violation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/violations/{violation_id}/review:
    parameters:
      - {name: violation_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    post:
      operationId: reviewViolation
      tags: [violations]
      summary: Review a violation (reviewed, dismissed or escalated)
      description: |
        `new` or `reviewed` may become `reviewed`, `dismissed` or
        `escalated`; `dismissed` and `escalated` are final (409
        `violation_reviewed`). Evidence that is broadcast only
        (`evidence_trust: broadcast`) is never escalated without a
        note (spec 06 §2 T1; 400 naming `note`). Escalation requests an
        incident (`incident_requested`) and opens it (`incident_opened`,
        `GET /v1/incidents?violation_id=`). The review, the request and
        the incident are written in the same transaction.
      security:
        - sessionCookie: []
      x-roles: [inspector]
      x-audit: {event_type: violation_reviewed, entity_type: violation, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViolationReviewInput"
      responses:
        "200":
          description: The violation as reviewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-17: incidents and evidence packs (spec 01 A10, 02 F10, 03 §1,
  # 05 §4, 06 §2 T6-T7, 06 §5); docs/runbooks/incidents.md is the
  # procedure. Every change and every pack built, downloaded or verified
  # is an events row (the chain of custody). A legal pack carries
  # personal data and is built and downloaded only by a session holding
  # one of the personal-data roles (inspector); an incident officer
  # builds and downloads oversight packs.
  /v1/incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: Incidents, newest first
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: none
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/IncidentStatus"}}
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/IncidentKind"}}
        - {name: violation_id, in: query, description: The incident opened from this violation., schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: One page of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIncident
      tags: [incidents]
      summary: Open an incident from the authority's own observation or a notice
      description: |
        `opened_from` is `own_observation`, `ansp_notice` or
        `ussp_notice` (the last two with `notice_ref`); an incident is
        opened from a violation only by escalating it (`POST
        /v1/violations/{violation_id}/review`), never here (400 naming
        `opened_from`). Never from an occurrence report (376/2014 Art.
        15-16). An aircraft's `operator_reg` is stored as its public part
        only: a secret part sent is dropped, never stored (spec 06 §5).
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: {event_type: incident_opened, entity_type: incident, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: The incident opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/incidents/{incident_id}:
    parameters:
      - {name: incident_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: getIncident
      tags: [incidents]
      summary: One incident with its aircraft, notes and evidence packs
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: none
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateIncident
      tags: [incidents]
      summary: Change an incident, assign or close it, add an aircraft or a note
      description: |
        Every member is optional; what is present is applied in one
        transaction with one `incident_updated` events row naming each
        change (from, to). `status` moves open -> assigned (an
        `assignee` is required) -> closed, open -> closed, and a closed
        incident is reopened (closed -> open or assigned), so a case is
        never shut without a way back. Notes are append-only: `note`
        adds one (at most 500 per incident). `add_aircraft` adds
        aircraft (at most 32 per incident, E-10).
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: {event_type: incident_updated, entity_type: incident, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentPatch"
      responses:
        "200":
          description: The incident as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/incidents/{incident_id}/evidence-packs:
    parameters:
      - {name: incident_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    post:
      operationId: createEvidencePack
      tags: [incidents]
      summary: Build, seal and store an evidence pack for a window
      description: |
        Assembles the manifest and the archive of the incident's evidence
        in [from, to): track excerpts cut into segments at every silence
        longer than the active policy's `max_gap_s`, every recorded
        writer gap and every sample without a position, each hole
        labelled with its cause or `no recorded cause` (B-13; nothing is
        interpolated); the raw Remote ID frames; the Display Provider's
        rows while still held (24 h); the zone versions named and in
        force; the policy versions; the violations; the events lines;
        the ground dataset and spacing of every AGL number (D-05); the
        USSP's service record of each USSP flight fetched on demand (02
        F7, scope `ussp.records`). A source that cannot be read is in
        the manifest as `unavailable` with the reason, never silently
        missing. A window longer than `INCIDENTS_PACK_MAX_WINDOW_S` is
        refused (400 `window_too_large`) and a section holding more than
        `INCIDENTS_PACK_MAX_ROWS` rows is refused (413
        `pack_too_large`), never thinned. The archive is deterministic
        (sorted entries, fixed timestamps); `content_hash` is its
        SHA-256, recorded here and in the `evidence_pack_built` events
        row with the purpose; the seal statement (pack id, incident,
        kind, window, hash, time) is signed as a detached JWS by the
        publication key when one is configured. `oversight` packs carry
        no personal data (registration public part and serial only;
        frame payloads that may carry the remote pilot position are
        withheld and kept by hash); `legal` packs need `case_ref` and a
        personal-data role (403 otherwise), resolve the operators'
        personal data from the registry (each read audited with the
        purpose) and are sealed at rest. 503
        `evidence_storage_unavailable` without `EVIDENCE_DIR`; 503
        `pack_busy` past `INCIDENTS_PACK_CONCURRENCY` builds at once.
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: {event_type: evidence_pack_built, entity_type: incident, purpose: required}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidencePackInput"
      responses:
        "201":
          description: The pack as sealed, with its manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePack"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/incidents/{incident_id}/evidence-packs/{pack_id}:
    parameters:
      - {name: incident_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
      - {name: pack_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: getEvidencePack
      tags: [incidents]
      summary: One evidence pack's manifest, hash and signature
      description: The manifest holds no personal data, whatever the kind.
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: none
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePack"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/incidents/{incident_id}/evidence-packs/{pack_id}/download:
    parameters:
      - {name: incident_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
      - {name: pack_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: downloadEvidencePack
      tags: [incidents]
      summary: The sealed archive (purpose required, audited)
      description: |
        The stored archive is read, opened when sealed at rest, and its
        SHA-256 compared with `content_hash` before a byte is served: a
        mismatch is refused (409 `evidence_tampered`, with an
        `evidence_pack_verified` events row recording the failure).
        Every download is an `evidence_pack_downloaded` events row with
        the purpose, committed before the body is sent. A legal pack is
        served only to a personal-data role (403).
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: {event_type: evidence_pack_downloaded, entity_type: incident, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200":
          description: The archive (a ZIP file).
          headers:
            X-Content-SHA256:
              description: The archive's hash, as content_hash records it.
              schema: {type: string}
            X-Evidence-Signature:
              description: The detached JWS of the seal statement; empty when the pack is unsigned.
              schema: {type: string}
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/incidents/{incident_id}/evidence-packs/{pack_id}/verify:
    parameters:
      - {name: incident_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
      - {name: pack_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: verifyEvidencePack
      tags: [incidents]
      summary: Recompute the stored archive's hash and check the signature
      description: |
        Reads the stored archive, recomputes its SHA-256 and compares it
        with `content_hash`, and verifies the seal statement's signature
        against the publication key this system holds. The answer says
        what was found, a mismatch included (200 with `hash_matches:
        false` and the problem); every verification is an
        `evidence_pack_verified` events row.
      security:
        - sessionCookie: []
      x-roles: [inspector, incident_officer]
      x-audit: {event_type: evidence_pack_verified, entity_type: incident, purpose: none}
      responses:
        "200":
          description: What the verification found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePackVerification"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-18: occurrence reports under Reg. (EU) 376/2014 (spec 01 A8, 02
  # F7 and F11, 03 §1 occurrence_reports, 04 §3.3 occurrence/v1, 06 §2
  # T6, 06 §5, 09 §1.7); docs/runbooks/occurrences.md is the procedure.
  # The reports live in their own schema and role and are never joined
  # to violations or incidents (376 Art. 15-16). The reporter's identity
  # is its own operation, for incident officers only, purpose-logged;
  # an inspector reads reports without it (403 there). The
  # de-identified export carries no reporter, name or address.
  /v1/occurrences:
    post:
      operationId: createOccurrence
      tags: [occurrences]
      summary: Report an occurrence (occurrence/v1; USSPs, the ANSP)
      description: |
        The body is `occurrence/v1` (schemas/occurrence/v1.json, owned
        here, M14). The sender is the token's `sub`, recorded as
        `reporter_org` (a `reporter.org` that differs is ignored and
        counted). Idempotent on (`reporter_org`, `report_ref`): the same
        report again answers 200 with the id given first; another
        report under the same reference is 409 `report_ref_conflict`.
        A report received more than the reporting deadline (72 h,
        `OCCURRENCES_REPORT_DEADLINE_S`) after `became_aware_at` is
        accepted with `within_72h: false`, never refused. A
        `became_aware_at` ahead of the database clock by more than the
        allowed skew, or before `occurred_at`, is 400. A
        `reporter.person_ref` is stored sealed under the occurrence key;
        without that key configured such a report is 503
        `occurrence_key_unavailable` (retry later), never stored in
        clear. Operator aircraft keep the registration number's public
        part only. Recorded with an `occurrence_received` events row
        that holds no reporter identity.
      security:
        - ecosystemToken: []
      x-scope: occurrences.write
      x-audit: {event_type: occurrence_received, entity_type: occurrence, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrenceReport"
      responses:
        "200":
          description: The same report was received before; the id given then.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceReceipt"
        "201":
          description: The report as received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listOccurrences
      tags: [occurrences]
      summary: Occurrence reports, newest received first (no reporter identity)
      security:
        - sessionCookie: []
      x-roles: [incident_officer, inspector]
      x-audit: none
      parameters:
        - {name: state, in: query, schema: {$ref: "#/components/schemas/OccurrenceState"}}
        - {name: category, in: query, schema: {$ref: "#/components/schemas/OccurrenceCategory"}}
        - {name: channel, in: query, schema: {$ref: "#/components/schemas/OccurrenceChannel"}}
        - {name: from, in: query, description: Received at or after., schema: {type: string, format: date-time}}
        - {name: to, in: query, description: Received before., schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: One page of reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/occurrences/export:
    post:
      operationId: exportOccurrences
      tags: [occurrences]
      summary: A de-identified export of the reports received in a window (hash-sealed, audited)
      description: |
        Builds the de-identified record set of the reports received in
        [`from`, `to`) in `format` (default `eccairs-compatible-draft`,
        the only format of this build; the E5X writer is open question
        Q-A12). No reporter organisation, reporter reference, person,
        name or address; aircraft by serial and the registration
        number's public part; the narrative as the reporter wrote it
        (the officer redacts it before filing). `content` is the exact
        document; `content_hash` is the SHA-256 of its UTF-8 bytes,
        recorded in `deidentified_exports` and in the
        `occurrence_export_created` events row. A window holding more
        reports than `OCCURRENCES_EXPORT_MAX_RECORDS` is refused
        (`export_too_large`), never thinned.
      security:
        - sessionCookie: []
      x-roles: [incident_officer]
      x-audit: {event_type: occurrence_export_created, entity_type: occurrence_export, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrenceExportInput"
      responses:
        "201":
          description: The sealed export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceExport"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/occurrences/{occurrence_id}:
    parameters:
      - {name: occurrence_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: getOccurrence
      tags: [occurrences]
      summary: One occurrence report (no reporter identity)
      security:
        - sessionCookie: []
      x-roles: [incident_officer, inspector]
      x-audit: none
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/occurrences/{occurrence_id}/reporter:
    parameters:
      - {name: occurrence_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    get:
      operationId: getOccurrenceReporter
      tags: [occurrences]
      summary: The reporter of an occurrence (incident officers only; purpose required, audited)
      description: |
        The reporting organisation, its reference and the reporter's
        person reference opened from the occurrence key. Refused without
        `purpose`; every read is an `occurrence_reporter_viewed` events
        row with the purpose, written before the identity is returned
        (376 Art. 16(1)). An inspector, whatever else it may read, is
        403 here. Without the occurrence key a sealed person reference
        is 503 `occurrence_key_unavailable`.
      security:
        - sessionCookie: []
      x-roles: [incident_officer]
      x-audit: {event_type: occurrence_reporter_viewed, entity_type: occurrence, purpose: required}
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200":
          description: The reporter.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceReporter"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/occurrences/{occurrence_id}/classify:
    parameters:
      - {name: occurrence_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    post:
      operationId: classifyOccurrence
      tags: [occurrences]
      summary: Classify the safety risk of an occurrence (376 Art. 7(2))
      description: |
        `risk_classification` is one class of the configured scheme
        (`OCCURRENCES_RISK_CLASSES`; another value is 400 naming the
        scheme). A received report becomes `classified`; a classified or
        analysed one keeps its state with the new class; a closed one
        is 409 `occurrence_closed`. Recorded with an
        `occurrence_classified` events row (from, to).
      security:
        - sessionCookie: []
      x-roles: [incident_officer]
      x-audit: {event_type: occurrence_classified, entity_type: occurrence, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrenceClassification"
      responses:
        "200":
          description: The report as classified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/occurrences/{occurrence_id}/analysis:
    parameters:
      - {name: occurrence_id, in: path, required: true, schema: {type: string, pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"}}
    patch:
      operationId: updateOccurrenceAnalysis
      tags: [occurrences]
      summary: Record the analysis and follow-up of an occurrence, mark it analysed or closed
      description: |
        Every member is optional; what is present is applied in one
        transaction with one `occurrence_analysis_updated` events row
        naming what changed (never the text). `state` moves a classified
        report to `analysed` (an analysis is required) and an analysed
        one to `closed`; a report not yet classified cannot be analysed
        (409 `occurrence_not_classified`) and a closed one cannot change
        (409 `occurrence_closed`).
      security:
        - sessionCookie: []
      x-roles: [incident_officer]
      x-audit: {event_type: occurrence_analysis_updated, entity_type: occurrence, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrenceAnalysisPatch"
      responses:
        "200":
          description: The report as changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # WP-16: USSP and CISP certificates (spec 01 A5, 02 F1 and F7, 03 §1;
  # Reg. 2021/664 Art. 7(6), 14-16, 18(a)). Issuing a certificate creates
  # its holder's client in the token service (06 §3, least privilege);
  # suspending it suspends the client and takes the USSP off the CIS
  # USSP list; the holder's own client records its operating status; a
  # daily job lapses what Art. 16(2) lapses; the public register is open.
  /v1/certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: The certificates
      description: Newest first, at most 500, optionally of one holder kind and one status.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      parameters:
        - {name: holder, in: query, schema: {$ref: "#/components/schemas/CertificateHolder"}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/CertificateStatus"}}
      responses:
        "200":
          description: The certificates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: issueCertificate
      tags: [certificates]
      summary: Issue a USSP or CISP certificate and register its client
      description: |
        One transaction: the certificate (status `issued`), its `code`
        (one to eight upper-case alphanumerics, unique, never changed;
        409 when taken), the holder's client in the token service
        (`ussp-<code>-01` or `cisp-01`, M24) with the scopes its
        services imply (least privilege; `scopes` in the answer) and
        the audiences of this system and the CISP, the Art. 16(2) lapse
        periods of the active policy, and the `certificate_issued` and
        `oauth_client_created` events rows. A `client_secret_post`
        client's secret is in the answer once and is handed to the
        holder out of band; a `private_key_jwt` client registers the
        holder's public JWKS. An issued certificate is not on the USSP
        list until its holder notifies the start of operations.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: certificate_issued, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "201":
          description: The certificate and its client.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssued"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/register:
    get:
      operationId: getCertificateRegister
      tags: [certificates]
      summary: The public register of certified providers (Art. 18(a))
      description: |
        Every certificate not revoked or lapsed, and one that was for a
        year after: holder kind and name, code, services, status,
        validity and limitations. No address, contact, conditions or
        client id: the response schema has no such property and a test
        fails if one appears. Unauthenticated, cacheable for 60 s and
        rate-limited per client address (429 with Retry-After).
      security: []
      x-audit: none
      responses:
        "200":
          description: The register.
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateRegister"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/publish-list:
    post:
      operationId: publishUSSPList
      tags: [certificates]
      summary: Publish the USSP list now (F1 ussp_list)
      description: |
        Builds `cis/ussp_list/v1` from the USSP certificates operating
        or limited whose holder operates, within their validity
        (`ussp_id` = `code`), holds it to the CISP's pinned schema and
        queues it, signed, in WP-6's outbox (`publication_queued`). The
        list is also queued after every transition that changes it, and
        a job repairs one that was not queued (the durable
        `certificate_list_state`). 503 when no publication key is
        configured; 400 when the list does not pass the schema.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: publication_queued, entity_type: publication, purpose: none}
      responses:
        "200":
          description: The list as queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/USSPListPublication"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/CertificateID"}}
    get:
      operationId: getCertificate
      tags: [certificates]
      summary: One certificate with its operating-status notices
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: none
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateDetail"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCertificate
      tags: [certificates]
      summary: Correct a certificate's details
      description: |
        The holder's name, address and contact, the base URL, the
        conditions, the limitations, the terms URL and the end of
        validity. The holder kind, code, client and issue time never
        change; the status changes only through its operations. One
        `certificate_updated` events row with the fields before and
        after; the USSP list is queued again when the certificate is on
        it.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: certificate_updated, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificatePatch"
      responses:
        "200":
          description: The certificate as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateChange"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/CertificateID"}}
    post:
      operationId: postCertificateStatus
      tags: [certificates]
      summary: The holder's operating-status notice (02 F7, Art. 7(6))
      description: |
        `started` (the start of operations after certification),
        `ceased` or `restarted`, at `at`, with the holder's `reference`.
        Only the holder's own client: an ecosystem token of this issuer
        with scope `certificates.status` whose `sub` is the
        certificate's `client_id` (403 otherwise). A notice the status
        does not admit is 409 (`started` twice, `ceased` before a start,
        anything on a revoked or lapsed certificate, `started` or
        `restarted` while suspended). A retried notice with the same
        `reference` and state answers 200 with the notice recorded
        first; the same reference for another state is 409. `at` is
        neither before the issue nor more than 5 minutes ahead of the
        database clock. Recorded with a `certificate_notice_recorded`
        events row; the USSP list is queued again.
      security:
        - ecosystemToken: []
      x-scope: certificates.status
      x-audit: {event_type: certificate_notice_recorded, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateStatusNotice"
      responses:
        "200":
          description: The same notice was recorded before.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateNoticeResult"
        "201":
          description: The notice as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateNoticeResult"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/{id}/status-notices:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/CertificateID"}}
    post:
      operationId: recordCertificateStatusNotice
      tags: [certificates]
      summary: Enter an operating-status notice received by letter
      description: |
        The paper fallback of `POST .../status` (02 F7: "manual fallback
        by letter is acceptable"): the same rules, the letter's
        `reference` required, recorded with source `manual` and the
        admin as the actor.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: certificate_notice_recorded, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateStatusNotice"
      responses:
        "200":
          description: The same notice was recorded before.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateNoticeResult"
        "201":
          description: The notice as recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateNoticeResult"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/{id}/suspend:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/CertificateID"}}
    post:
      operationId: suspendCertificate
      tags: [certificates]
      summary: Suspend a certificate
      description: |
        One transaction: the certificate is suspended (a limitation and
        the operating status are kept for the reinstatement), its client
        is suspended at once, so the next token request is refused
        (`invalid_client`), and the transition and the client change are
        events rows with the reason. A token issued before stays valid
        to its `exp` (at most the token TTL): `tokens_valid_until` in
        the answer says until when. The USSP list is queued again
        without the holder (06 §2 T9). 409 when suspended, revoked or
        lapsed already.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: certificate_status_changed, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateReason"
      responses:
        "200":
          description: The transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateChange"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/{id}/limit:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/CertificateID"}}
    post:
      operationId: limitCertificate
      tags: [certificates]
      summary: Limit a certificate
      description: |
        The certificate is limited with the `limitations` given (they
        replace the ones held and travel on the USSP list as
        `certification_limitations`). The client stays active. 409 when
        limited, revoked or lapsed already.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: certificate_status_changed, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateLimit"
      responses:
        "200":
          description: The transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateChange"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/{id}/revoke:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/CertificateID"}}
    post:
      operationId: revokeCertificate
      tags: [certificates]
      summary: Revoke a certificate
      description: |
        Final: the certificate is revoked and its client revoked, in one
        transaction with the reason. Tokens issued before stay valid to
        their `exp` (`tokens_valid_until`). 409 when revoked or lapsed
        already.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: certificate_status_changed, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateReason"
      responses:
        "200":
          description: The transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateChange"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificates/{id}/reinstate:
    parameters:
      - {name: id, in: path, required: true, schema: {$ref: "#/components/schemas/CertificateID"}}
    post:
      operationId: reinstateCertificate
      tags: [certificates]
      summary: Lift a suspension, or else a limitation
      description: |
        A suspended certificate is reinstated (its client active again;
        a limitation held stays); a limited one that is not suspended
        has its limitation lifted (the limitations cleared). 409 when
        neither suspended nor limited, or revoked or lapsed.
      security:
        - sessionCookie: []
      x-roles: [admin]
      x-audit: {event_type: certificate_status_changed, entity_type: certificate, purpose: none}
      requestBody:
        required: true
        content:
          application/json:
