              $ref: "#/components/schemas/ConsoleActionReason"
      responses:
        "200":
          description: The subscription as written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/console/subscriptions/{id}/resume:
    post:
      operationId: resumeConsoleSubscription
      tags: [console]
      summary: Resume a suspended subscription
      description: |
        Role publisher_admin and above. A suspended subscription returns
        to pending_verification with a new verification ping (WP-6: it
        is verified again before it receives); 409 subscription_state
        when it is not suspended. Audited with the reason before it
        happens (console_subscription_resumed).
      x-role: publisher_admin
      security:
        - consoleSession: []
      parameters:
        - $ref: "#/components/parameters/SubscriptionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsoleActionReason"
      responses:
        "200":
          description: The subscription as written.
          content:
            application/json:
