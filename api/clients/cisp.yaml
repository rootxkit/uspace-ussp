  /v1/console/audit:
    get:
      operationId: listConsoleAudit
      tags: [console]
      summary: The audit log
      description: |
        Role admin. The events table (every publication, restriction
        change, subscription change, account change, session and console
        action, with its actor), newest first, with the chain hashes;
        filtered by since, actor (actor_id) and type (event_type), paged
        with before_id.
      x-role: admin
      security:
        - consoleSession: []
      parameters:
        - name: since
          in: query
          required: false
          description: RFC 3339 instant with an offset (default 30 days ago).
          schema:
            type: string
