openapi: 3.1.0
info:
  title: uspace-cisp national CIS publication API
  version: 0.1.0
  description: |
    The Common Information Service of the Georgian U-space
    system-of-systems (Reg. (EU) 2021/664 Art. 5). This file is the
    contract: an endpoint that is not in it does not exist, and changes
    within /v1 are additive only. Every error is
    application/problem+json in the shape of the Problem schema.

    Skeleton (WP-0): health, readiness and the status stub. Every other
    work package adds its paths under its tag; see api/README.md.
    WP-2: the signing JWKS. WP-4: the reads (datasets, versions, the
    change feed, status) and the public subset. WP-5: the dynamic
    restrictions of the ANSP (F2), their expiry and the publisher
    staleness. WP-6: subscriptions and the signed webhook delivery
    (F3 push). WP-7: the WebSocket change stream. WP-8: the console (accounts,
    sessions, read models and audited actions; no write path to
    content).
servers:
  - url: /
tags:
  - name: health
    description: Liveness and readiness of one process instance.
  - name: publications
    description: Publication intake from the authority (F1).
  - name: restrictions
    description: Dynamic restrictions from the ANSP (F2).
  - name: datasets
    description: Reads, versions and the change feed (F3 pull).
  - name: subscriptions
    description: Webhook subscriptions (F3 push).
  - name: stream
    description: The WebSocket change stream.
  - name: console
    description: The CISP operators' console.
  - name: status
    description: Service status for consumers and consoles.
  - name: keys
    description: The CISP's public signing keys.

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness
      description: 200 while the process runs. Says nothing about dependencies.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness
      description: |
        200 only when the database is reachable and its migrations are
        current. A NATS outage is reported in checks.nats but does not
        make the instance unready (it is ready, degraded). Every check
        names its state; a check that is not implemented yet says so and
        counts as not ready, never as ok.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready; checks names why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        default:
          $ref: "#/components/responses/Problem"
  /v1/status:
    get:
      operationId: getStatus
      tags: [status]
      summary: Service status
      description: |
        Per dataset the current version, its update time and ETag (from
        the instance's snapshot cache); per publisher the heartbeat and
        staleness (stale when the last heartbeat is older than its
        stale_after_s, 60 s by default: three missed 15 s heartbeats; a
        configured publisher never heard from is stale with no
        stale_since); the degraded dependencies with their since-times;
        the mTLS mode; and the CISP's clock. Token scope cis.read.
        Served while the database is down: the datasets come from the
        cache and database is listed in degraded.
      security:
        - ecosystemToken: []
        - consoleSession: []
      responses:
        "200":
          description: The service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publications/{dataset}:
    put:
      operationId: putPublication
      tags: [publications]
      summary: Publish a whole dataset (F1)
      description: |
        The authority publishes the whole of zones, uspace_airspace or
        ussp_list. Token scope cis.publish:zones, cis.publish:uspace or
        cis.publish:ussp_list for the dataset, and sub the configured
        authority client id. The body is at most
        CISP_MAX_PUBLICATION_BYTES, application/geo+json or
        application/json (415 otherwise), and carries the authority's
        detached JWS over its exact bytes in X-JWS-Signature; a missing
        or refused signature is 403 signature before anything else is
        read (docs/PLAN.md section 15 Q30).

        If-Match must name the current version ("<dataset>:<version>",
        "zones:0" before the first publication): absent is 428
        precondition_required, another version is 412
        precondition_failed with the current one in the ETag header.

        The publication is accepted whole or refused whole (spec 06 T9):
        a refusal is 400 with every problem named by its JSON path in
        errors[] (at most 100; truncated says more existed and detail
        gives the count), and is recorded as an attempt the publisher
        can read back. Zones and U-space airspace are ED-318 collections
        parsed by uspace-core/ed318 and then held to the dataset rules
        (no USPACE in zones, only USPACE in uspace_airspace, no DAR
        reason, identifiers unique across zones, uspace_airspace and
        restrictions, every zone buildable by ed318.ToZones, the
        UspaceRequirements block on every USPACE feature); ussp_list is
        the closed UsspList schema. A body equal by canonical content to
        the current version is 200 with unchanged true and no new
        version; otherwise 201 with the new version and what changed.
        The bytes stored are the bytes received.

        Zones may also be published as a EUROCAE ED-269 document,
        Content-Type application/vnd.ed269+json (415 on the other
        datasets; WP-12). The signature covers the ED-269 bytes and is
        verified before anything parses them. The document is read
        strictly by uspace-core/ed269 (a refusal names every problem by
        its ED-269 path), mapped onto ED-318 by
        uspace-core/ed318.FromED269 with metadata.issued the time of
        receipt, metadata.provider the publisher's client id and the
        single-string texts in lang (a document that parses but does not
        map is refused with core's reason), and the mapped collection is
        held to the zones rules above. The version's body is the mapped
        ED-318, which is what every consumer reads; the ED-269 bytes are
        kept beside it and served by GET
        /v1/zones/versions/{version}?format=ed269&source=true with the
        publisher's signature. The result says mapped_from ed269 and
        warns of every ED-269 member carried under
        extendedProperties.ed269.
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
            enum: [zones, uspace_airspace, ussp_list]
        - name: lang
          in: query
          required: false
          description: |
            The language of an ED-269 document's single-string texts
            (name, message, otherReasonInfo, the authority texts), as an
            ED-318 language tag of 1 to 5 characters; ka when absent.
            Only read for application/vnd.ed269+json.
          schema:
            type: string
            minLength: 1
            maxLength: 5
            examples: [ka, en-GB]
        - name: If-Match
          in: header
          required: false
          description: The current ETag; required by the server (428 when absent).
          schema:
            type: string
            examples: ['"zones:4"']
        - name: X-JWS-Signature
          in: header
          required: false
          description: |
            RFC 7515 Appendix F detached JWS with RFC 7797 b64 false over
            the exact body bytes (alg RS256, kid, iat, crit ["b64"]);
            required by the server (403 signature when absent).
          schema:
            type: string
      requestBody:
        required: true
        description: The whole dataset, verbatim.
        content:
          application/geo+json:
            schema:
              $ref: "#/components/schemas/PublicationBody"
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationBody"
          application/vnd.ed269+json:
            schema:
              $ref: "#/components/schemas/ED269Document"
      responses:
        "200":
          description: Equal to the current version; nothing was written.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationResult"
        "201":
          description: Accepted as a new version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listPublications
      tags: [publications]
      summary: The version history of a dataset
      description: |
        Every version of the dataset, newest first, with its publisher,
        time, counts, reason and warnings; no bodies (they are served by
        the datasets reads). Token scope cis.read, or the dataset's
        publisher. Page with before (versions below it) and limit.
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
            enum: [zones, uspace_airspace, ussp_list, restrictions]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          required: false
          description: Only versions below this one.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The versions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationVersionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publications/{dataset}/attempts:
    get:
      operationId: listPublicationAttempts
      tags: [publications]
      summary: The caller's refused publications (Annex III A(5))
      description: |
        The refused attempts of the calling publisher on this dataset,
        newest first, each with every problem by path. Only the dataset's
        publisher may read them, with the dataset's publish scope (403
        for another client or without the scope); the console's admin
        view arrives with WP-8.
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
            enum: [zones, uspace_airspace, ussp_list, restrictions]
        - name: since
          in: query
          required: false
          description: Only attempts received after this instant.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The refused attempts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAttemptList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publishers/heartbeat:
    post:
      operationId: postPublisherHeartbeat
      tags: [publications]
      summary: Publisher heartbeat (every 15 s)
      description: |
        Every publisher sends this every 15 s with any cis.publish:*
        scope; the CISP records the time it arrived as last_heartbeat_at
        for the caller's sub and stores active_refs verbatim (the ANSP's
        ansp_refs; the authority sends none). A publisher silent for 60 s
        is stale (docs/PLAN.md section 15 Q3). The heartbeat never
        changes a restriction's state. 403 when sub is not a configured
        publisher; the ANSP's heartbeat is bound to its client
        certificate subject like its other routes (section 8.3).

        The ANSP's active_refs are compared with the restrictions the
        CISP holds as active: a declared ansp_ref the CISP does not hold
        as active, and an active restriction the ANSP did not declare,
        are counted (heartbeat_ref_unknown, heartbeat_ref_missing) and
        listed in GET /v1/status, and never acted on: only the ANSP's
        POST and PATCH change a restriction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublisherHeartbeat"
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/restrictions:
    post:
      operationId: createRestriction
      tags: [restrictions]
      summary: Create a dynamic restriction (F2)
      description: |
        The ANSP publishes a dynamic restriction (ATS.TR.237: activation,
        deactivation, temporary limitation), planned or active. Token
        scope cis.publish:restrictions, sub the configured ANSP client
        id, and the ANSP's client certificate subject
        (X-Client-Cert-Subject, forwarded by Caddy) equal to
        CISP_ANSP_MTLS_SUBJECT when CISP_MTLS_MODE is required (403
        mtls_required otherwise). The body is application/json (415
        otherwise), at most CISP_MAX_RESTRICTION_BYTES (256 KiB), and
        carries the ANSP's detached JWS over its exact bytes in
        X-JWS-Signature, verified with the ANSP's own key from the ANSP's
        JWKS (CISP_ANSP_JWKS_URL; docs/PLAN.md section 15 Q8): absent or
        refused is 403 signature, before anything else is read.

        Idempotency: the key is the body pair (ansp_ref, ansp_version),
        never a header. The same pair with the same body bytes again is
        200 with the stored head and replay true, and makes no new
        version (a retry storm from a degraded ANSP cannot flood
        subscribers); the same pair with another body, and a lower
        ansp_version for the ansp_ref, are 409 ansp_version. An Idempotency-Key header, if
        the ANSP's planner sends one, is ignored: nothing depends on it,
        and two different values on the same pair still replay.

        The body is the closed RestrictionCreate (cis/restriction/v1):
        an unknown member is refused, never ignored. The feature is
        parsed strictly as a one-feature ED-318 collection
        (uspace-core ed318.Parse) and held to the DAR rules: reason holds
        DAR; type PROHIBITED, REQ_AUTHORIZATION or CONDITIONAL (a DAR
        that opens airspace is not a restriction); exactly one
        limitedApplicability period whose startDateTime and endDateTime
        are starts_at and ends_at, without daylight events; ed318.ToZones
        can build it; at most 1000 vertices and 10 000 km2 (F3548
        CstrMaxVertices, CstrMaxAreaKm2); ends_at - starts_at at most 24
        h, starts_at at most 56 days ahead (CstrMaxDurationHours,
        CstrMaxPlanningHorizonDays), ends_at after now, and an active
        create starting within 60 s. The identifier is checked for
        length (at most 7 characters, ED-318) and uniqueness across
        zones, uspace_airspace and restrictions only, never for a prefix:
        the ANSP mints DAR plus 4 base-36 characters (docs/PLAN.md
        section 15 Q17). uspace_airspace_id must name a current USPACE
        feature of the uspace_airspace dataset and the restriction must
        intersect it; there is no option to skip the check, and the lab
        publishes a designation for every demo (section 15 Q6). A refusal
        is 400 restriction_refused with every problem by path, recorded
        as an attempt the ANSP reads at
        /v1/publications/restrictions/attempts.

        Accepted, the restriction is a new version of the restrictions
        dataset with reason restriction_created (planned) or
        restriction_activated (active) and a change record, in the same
        transaction as the head; 201 with the head and the version. The
        ANSP is the master of the state (section 15 Q2): the CISP moves a
        restriction itself only from planned or active to ended, with
        ended_by expiry, when its ends_at passes (judged on the
        database's clock); a planned restriction past its starts_at but
        before its ends_at stays planned.
      parameters:
        - $ref: "#/components/parameters/JWSSignature"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestrictionCreate"
      responses:
        "200":
          $ref: "#/components/responses/RestrictionReplay"
        "201":
          description: Accepted as a new version of the restrictions dataset.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/restrictions/heads:
    get:
      operationId: listRestrictions
      tags: [restrictions]
      summary: The restriction heads, with their events
      description: |
        The lifecycle heads, newest window first, each with its events;
        the restrictions dataset (GET /v1/restrictions) is the ED-318
        view of the same rows. Token scope cis.read. state keeps one
        state; airspace keeps the restrictions of one U-space airspace;
        at keeps the heads whose window [starts_at, ends_at) holds that
        instant, whatever their state. While the ANSP is stale (no
        heartbeat for its stale_after_s, 60 s) the list carries
        cis_publisher_stale_since; nothing is ended or hidden because the
        ANSP is silent: active restrictions stay active until their
        ends_at (spec 02 F2).

        This list is at /v1/restrictions/heads, not at /v1/restrictions,
        because GET /v1/restrictions is the dataset read every consumer
        already runs for zones (docs/PLAN.md section 15 Q35).
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [planned, active, ended, cancelled]
        - name: airspace
          in: query
          required: false
          description: The uspace_airspace_id.
          schema:
            type: string
            maxLength: 7
        - name: at
          in: query
          required: false
          description: RFC 3339 instant with an offset inside the window.
          schema:
            type: string
            examples: ["2026-10-02T12:00:00Z"]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The heads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/restrictions/{id}:
    get:
      operationId: getRestriction
      tags: [restrictions]
      summary: One restriction head with its events
      description: |
        The head and its events by the CISP's id, or by=ansp_ref by the
        ANSP's reference. Token scope cis.read. 404 when none.
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
        - $ref: "#/components/parameters/RestrictionBy"
      responses:
        "200":
          description: The head.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionHead"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchRestriction
      tags: [restrictions]
      summary: Activate, extend, end or cancel a restriction (F2)
      description: |
        The ANSP changes a restriction's state: planned to active
        (activate), planned to cancelled (cancel), active to ended (end,
        ended_by ansp), and active to active with a later ends_at
        (extend). Anything else is 409 state; an ended or cancelled
        restriction changes no more. Authentication, mTLS, the body cap
        and the signature are those of POST /v1/restrictions; the head
        is named by its id, or with by=ansp_ref by the ANSP's reference;
        404 when none.

        ansp_version must rise on every accepted op: the same
        (ansp_ref, ansp_version) pair with the same body bytes is 200
        with the stored head and replay true and no new version; the
        same pair with another op or body, and a lower one, are 409
        ansp_version.
        An Idempotency-Key header is ignored.

        An extend carries ends_at and the feature again, its one period
        ending at the new ends_at (refused otherwise): the published
        period and ends_at are one truth, and the CISP never edits a
        published feature, so the ANSP republishes it (docs/PLAN.md
        section 15 Q36). Its window is held to 24 h from starts_at. The
        feature may differ from the published one only in its period's
        endDateTime: any other difference (identifier, geometry, layer,
        type, texts, members) is 409 feature_changed. Every other op
        carries neither.

        Each accepted op is a new version of the restrictions dataset
        with the matching reason (restriction_activated,
        restriction_extended, restriction_ended, restriction_cancelled)
        and a change record; an ended or cancelled restriction leaves
        the current set and stays in history by version.
      parameters:
        - $ref: "#/components/parameters/RestrictionID"
        - $ref: "#/components/parameters/RestrictionBy"
        - $ref: "#/components/parameters/JWSSignature"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestrictionPatch"
      responses:
        "200":
          description: Accepted as a new version (replay false), or the same pair again (replay true, no version).
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictionResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/subscriptions:
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Register a webhook for changes (F3 push)
      description: |
        Any client with cis.read registers a callback for some datasets,
        optionally within a box. callback_url must be https (plain http
        only to localhost, and only with CISP_ALLOW_INSECURE_CALLBACKS),
        an absolute URL without userinfo or fragment, its host at most
        253 characters, and neither a literal IP address nor a
        localhost, .local, .internal or .localhost name, nor a name that
        resolves to a loopback, private, link-local, CGNAT, multicast or
        unspecified address, unless CISP_ALLOW_PRIVATE_CALLBACKS (the
        lab). deliver applies the address rule again at every dial, to
        the address it connects to, and never follows a redirect. A
        client holds at most CISP_MAX_SUBSCRIPTIONS_PER_CLIENT (20)
        subscriptions that are not deleted; one more is 409 limit.

        The subscription is created pending_verification and deliver
        POSTs it a cis/change/v1 with reason subscription_test at once;
        the first 2xx makes it active. Until then GET says
        pending_verification and, in verification, the last attempt's
        status and error. Pending subscriptions are sent changes too.

        Every notification is POSTed to the registered callback_url
        (receivers in the ecosystem expose POST /v1/cis/notifications,
        but the CISP never assumes a path) as application/jose: a compact
        JWS (RS256, a kid of /.well-known/jwks.json) whose payload is
        {iss, aud, sub, iat, jti, body}: iss is CISP_ISSUER_URL, aud the
        host of callback_url without its port, sub the subscription id,
        jti the delivery id, and body the cis/change/v1 record (the
        Change schema). Receivers answer 2xx within 2 s; anything else,
        a redirect or a timeout is retried 1, 2, 4 ... s doubling to
        300 s (with 10 % jitter) until 24 h after the change, then the
        delivery expires. 50 consecutive failures over at least an hour
        suspend an active subscription (its suspended_reason says since
        when and why). Receivers acknowledge reason subscription_test
        and republished, and any reason they do not know, with 204
        without pulling; only the publication and restriction reasons
        trigger a pull of pull_url, and only when its host is this
