      operationId: retryConsoleDelivery
      tags: [console]
      summary: Re-queue a delivery now
      description: |
        Role publisher_admin and above. As WP-6's retry (the delivery is
        queued and due now; 409 delivering while an attempt is in
        flight), for any client's subscription, audited with the reason
        (console_delivery_retried).
      x-role: publisher_admin
      security:
        - consoleSession: []
      parameters:
