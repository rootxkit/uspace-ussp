# sqlc: typed queries for the two databases, one package per tree,
# generated into internal/store/relational and internal/store/timeseries
# and committed; scripts/check-generated.sh proves they are current.
# The schemas are the goose trees (sqlc reads the Up sections only);
# the queries are internal/store/queries/<tree>/*.sql, one file per
# concern. Never edit the generated packages by hand (CLAUDE.md
# engineering rules). The two trees never share a query file (rule 10).
version: "2"
sql:
  - engine: postgresql
    schema: migrations/relational
    queries: internal/store/queries/relational
    gen:
      go:
        package: relational
        out: internal/store/relational
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: migrations/timeseries
    queries: internal/store/queries/timeseries
    gen:
      go:
        package: timeseries
        out: internal/store/timeseries
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_pointers_for_null_types: true
overrides:
  go:
    overrides:
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
