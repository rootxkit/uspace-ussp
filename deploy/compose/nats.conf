# NATS for uspace-ussp (deploy/compose/docker-compose.yml): JetStream on
# a file store, monitoring on 8222 inside the project network only (the
# health check reads /healthz), and no anonymous access: every process
# connects with its own credentials, so a leaked one names its process
# and can be revoked alone. The passwords come from the environment
# (deploy/compose/.env), never from this file.
#
# The seven users share the account USSP because they share its
# subjects and streams (trk.v1, alrt.v1, KV buckets); per-user subject
# permissions follow the subject catalogue of WP-6.
#
# jwks_cache (the issuers' JWKS kept across restarts, PLAN §15.2 Q35 b)
# is written only by the processes that verify tokens (api,
# telemetry-ingest, rid-sp, traffic-ws), each under its own user's
# prefix ($KV.jwks_cache.<user>.<issuer hash>, auth.JWKSCacheKey): every
# user is denied the other users' prefixes, the processes that verify
# nothing are denied the bucket and its creation, and nobody may change,
# delete or purge its stream or delete a message from it. A verifier
# uses what it reads back only when its HMAC verifies under that
# process's own key (USSP_JWKS_CACHE_KEY_FILE): these permissions narrow
# who could write an entry; the MAC makes a written one unforgeable.
# internal/bus TestNATSConfJWKSCacheWriters holds these lists to the
# code, and its integration twin runs them on a server started with
# this file.
port: 4222
http_port: 8222

# max_file_store holds every stream's and bucket's max_bytes together
# (bus.Topology.MaxBytes, about 12.6 GiB by default; every bound is set
# through USSP_*_STREAM_MAX_* and USSP_*_BUCKET_MAX_BYTES, deploy/ENV.md;
# TestTopologyFitsTheFileStore in internal/app/proc checks it by
# test): a full store refuses every publish of the account, alerts
# included. Raising a stream's bound means raising this first.
jetstream {
  store_dir: /data
  max_file_store: 16GB
  max_memory_store: 64MB
}

accounts {
  USSP {
    jetstream: enabled
    users: [
      {
        user: api
        password: $USSP_NATS_API_PASSWORD
        permissions: { publish: { deny: [
          "$KV.jwks_cache.telemetry-ingest.>"
          "$KV.jwks_cache.rid-sp.>"
          "$KV.jwks_cache.monitor.>"
          "$KV.jwks_cache.traffic-ws.>"
          "$KV.jwks_cache.dss-sync.>"
          "$KV.jwks_cache.tsdb-writer.>"
          "$KV.jwks_cache.*"
          "$JS.API.STREAM.UPDATE.KV_jwks_cache"
          "$JS.API.STREAM.DELETE.KV_jwks_cache"
          "$JS.API.STREAM.PURGE.KV_jwks_cache"
          "$JS.API.STREAM.MSG.DELETE.KV_jwks_cache"
        ] } }
      }
      {
        user: telemetry-ingest
        password: $USSP_NATS_TELEMETRY_INGEST_PASSWORD
        permissions: { publish: { deny: [
          "$KV.jwks_cache.api.>"
          "$KV.jwks_cache.rid-sp.>"
          "$KV.jwks_cache.monitor.>"
          "$KV.jwks_cache.traffic-ws.>"
          "$KV.jwks_cache.dss-sync.>"
          "$KV.jwks_cache.tsdb-writer.>"
          "$KV.jwks_cache.*"
          "$JS.API.STREAM.UPDATE.KV_jwks_cache"
          "$JS.API.STREAM.DELETE.KV_jwks_cache"
          "$JS.API.STREAM.PURGE.KV_jwks_cache"
          "$JS.API.STREAM.MSG.DELETE.KV_jwks_cache"
        ] } }
      }
      {
        user: rid-sp
        password: $USSP_NATS_RID_SP_PASSWORD
        permissions: { publish: { deny: [
          "$KV.jwks_cache.api.>"
          "$KV.jwks_cache.telemetry-ingest.>"
          "$KV.jwks_cache.monitor.>"
          "$KV.jwks_cache.traffic-ws.>"
          "$KV.jwks_cache.dss-sync.>"
          "$KV.jwks_cache.tsdb-writer.>"
          "$KV.jwks_cache.*"
          "$JS.API.STREAM.UPDATE.KV_jwks_cache"
          "$JS.API.STREAM.DELETE.KV_jwks_cache"
          "$JS.API.STREAM.PURGE.KV_jwks_cache"
          "$JS.API.STREAM.MSG.DELETE.KV_jwks_cache"
        ] } }
      }
      {
        user: monitor
        password: $USSP_NATS_MONITOR_PASSWORD
        permissions: { publish: { deny: [
          "$KV.jwks_cache.>"
          "$JS.API.STREAM.CREATE.KV_jwks_cache"
          "$KV.jwks_cache.*"
          "$JS.API.STREAM.UPDATE.KV_jwks_cache"
          "$JS.API.STREAM.DELETE.KV_jwks_cache"
          "$JS.API.STREAM.PURGE.KV_jwks_cache"
          "$JS.API.STREAM.MSG.DELETE.KV_jwks_cache"
        ] } }
      }
      {
        user: traffic-ws
        password: $USSP_NATS_TRAFFIC_WS_PASSWORD
        permissions: { publish: { deny: [
          "$KV.jwks_cache.api.>"
          "$KV.jwks_cache.telemetry-ingest.>"
          "$KV.jwks_cache.rid-sp.>"
          "$KV.jwks_cache.monitor.>"
          "$KV.jwks_cache.dss-sync.>"
          "$KV.jwks_cache.tsdb-writer.>"
          "$KV.jwks_cache.*"
          "$JS.API.STREAM.UPDATE.KV_jwks_cache"
          "$JS.API.STREAM.DELETE.KV_jwks_cache"
          "$JS.API.STREAM.PURGE.KV_jwks_cache"
          "$JS.API.STREAM.MSG.DELETE.KV_jwks_cache"
        ] } }
      }
      {
        user: dss-sync
        password: $USSP_NATS_DSS_SYNC_PASSWORD
        permissions: { publish: { deny: [
          "$KV.jwks_cache.>"
          "$JS.API.STREAM.CREATE.KV_jwks_cache"
          "$KV.jwks_cache.*"
          "$JS.API.STREAM.UPDATE.KV_jwks_cache"
          "$JS.API.STREAM.DELETE.KV_jwks_cache"
          "$JS.API.STREAM.PURGE.KV_jwks_cache"
          "$JS.API.STREAM.MSG.DELETE.KV_jwks_cache"
        ] } }
      }
      {
        user: tsdb-writer
        password: $USSP_NATS_TSDB_WRITER_PASSWORD
        permissions: { publish: { deny: [
          "$KV.jwks_cache.>"
          "$JS.API.STREAM.CREATE.KV_jwks_cache"
          "$KV.jwks_cache.*"
          "$JS.API.STREAM.UPDATE.KV_jwks_cache"
          "$JS.API.STREAM.DELETE.KV_jwks_cache"
          "$JS.API.STREAM.PURGE.KV_jwks_cache"
          "$JS.API.STREAM.MSG.DELETE.KV_jwks_cache"
        ] } }
      }
    ]
  }
}
