# NATS for uspace-ussp on staging and in production
# (deploy/compose/staging.yaml). The laptop's deploy/compose/nats.conf
# with two changes: the store bounds come from the environment
# (NATS_MAX_FILE_STORE, NATS_MAX_MEMORY_STORE; staging.yaml sets them
# and check-deploy holds every stream's and bucket's max_bytes within
# the file store), and a `backup` user that deploy/backup.sh uses to
# export the KV buckets.
#
# Monitoring on 8222 is inside the project network only (the health
# check reads /healthz). No anonymous access: every process connects
# with its own credentials, so a leaked one names its process and can
# be revoked alone. The passwords come from the container's environment
# (nats.env, written by deploy/gen-secrets.sh), never from this file.
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: $NATS_MAX_FILE_STORE
  max_memory_store: $NATS_MAX_MEMORY_STORE
}

accounts {
  USSP {
    jetstream: enabled
    users: [
      { user: api,              password: $USSP_NATS_API_PASSWORD }
      { user: telemetry-ingest, password: $USSP_NATS_TELEMETRY_INGEST_PASSWORD }
      { user: rid-sp,           password: $USSP_NATS_RID_SP_PASSWORD }
      { user: monitor,          password: $USSP_NATS_MONITOR_PASSWORD }
      { user: traffic-ws,       password: $USSP_NATS_TRAFFIC_WS_PASSWORD }
      { user: dss-sync,         password: $USSP_NATS_DSS_SYNC_PASSWORD }
      { user: tsdb-writer,      password: $USSP_NATS_TSDB_WRITER_PASSWORD }
      # Reads the KV buckets and nothing else: it may list the streams
      # (the listing names every stream; their content is not read), read
      # the info of a KV_<bucket> stream, read its messages directly and
      # run the ordered consumer a key listing uses on it. It may not
      # read any other stream (TRK, ALRT, ...: telemetry and alerts are
      # in the database dump), publish to a subject a process reads, put
      # or delete a key, delete a consumer (a process's durable one
      # included), or change a stream. The KV_<bucket> list is the
      # topology's (internal/app/proc TestNATSStagingBackupUser holds it
      # to bus.Topology); a new bucket is added here or is not backed
      # up, which backup.sh then fails on.
      {
        user: backup
        password: $USSP_NATS_BACKUP_PASSWORD
        permissions: {
          publish: {
            allow: [
              "$JS.API.INFO"
              "$JS.API.STREAM.NAMES"
              "$JS.API.STREAM.LIST"
              "$JS.API.STREAM.INFO.KV_cis_current"
              "$JS.API.STREAM.MSG.GET.KV_cis_current"
              "$JS.API.DIRECT.GET.KV_cis_current"
              "$JS.API.DIRECT.GET.KV_cis_current.>"
              "$JS.API.CONSUMER.CREATE.KV_cis_current"
              "$JS.API.CONSUMER.CREATE.KV_cis_current.>"
              "$JS.API.CONSUMER.INFO.KV_cis_current.>"
              "$JS.FC.KV_cis_current.>"
              "$JS.API.STREAM.INFO.KV_policy"
              "$JS.API.STREAM.MSG.GET.KV_policy"
              "$JS.API.DIRECT.GET.KV_policy"
              "$JS.API.DIRECT.GET.KV_policy.>"
              "$JS.API.CONSUMER.CREATE.KV_policy"
              "$JS.API.CONSUMER.CREATE.KV_policy.>"
              "$JS.API.CONSUMER.INFO.KV_policy.>"
              "$JS.FC.KV_policy.>"
              "$JS.API.STREAM.INFO.KV_source_control"
              "$JS.API.STREAM.MSG.GET.KV_source_control"
              "$JS.API.DIRECT.GET.KV_source_control"
              "$JS.API.DIRECT.GET.KV_source_control.>"
              "$JS.API.CONSUMER.CREATE.KV_source_control"
              "$JS.API.CONSUMER.CREATE.KV_source_control.>"
              "$JS.API.CONSUMER.INFO.KV_source_control.>"
              "$JS.FC.KV_source_control.>"
              "$JS.API.STREAM.INFO.KV_registry_validity"
              "$JS.API.STREAM.MSG.GET.KV_registry_validity"
              "$JS.API.DIRECT.GET.KV_registry_validity"
              "$JS.API.DIRECT.GET.KV_registry_validity.>"
              "$JS.API.CONSUMER.CREATE.KV_registry_validity"
              "$JS.API.CONSUMER.CREATE.KV_registry_validity.>"
              "$JS.API.CONSUMER.INFO.KV_registry_validity.>"
              "$JS.FC.KV_registry_validity.>"
              "$JS.API.STREAM.INFO.KV_client_bindings"
              "$JS.API.STREAM.MSG.GET.KV_client_bindings"
              "$JS.API.DIRECT.GET.KV_client_bindings"
              "$JS.API.DIRECT.GET.KV_client_bindings.>"
              "$JS.API.CONSUMER.CREATE.KV_client_bindings"
              "$JS.API.CONSUMER.CREATE.KV_client_bindings.>"
              "$JS.API.CONSUMER.INFO.KV_client_bindings.>"
              "$JS.FC.KV_client_bindings.>"
              "$JS.API.STREAM.INFO.KV_intent_active"
              "$JS.API.STREAM.MSG.GET.KV_intent_active"
              "$JS.API.DIRECT.GET.KV_intent_active"
              "$JS.API.DIRECT.GET.KV_intent_active.>"
              "$JS.API.CONSUMER.CREATE.KV_intent_active"
              "$JS.API.CONSUMER.CREATE.KV_intent_active.>"
              "$JS.API.CONSUMER.INFO.KV_intent_active.>"
              "$JS.FC.KV_intent_active.>"
              "$JS.API.STREAM.INFO.KV_telemetry_seen"
              "$JS.API.STREAM.MSG.GET.KV_telemetry_seen"
              "$JS.API.DIRECT.GET.KV_telemetry_seen"
              "$JS.API.DIRECT.GET.KV_telemetry_seen.>"
              "$JS.API.CONSUMER.CREATE.KV_telemetry_seen"
              "$JS.API.CONSUMER.CREATE.KV_telemetry_seen.>"
              "$JS.API.CONSUMER.INFO.KV_telemetry_seen.>"
              "$JS.FC.KV_telemetry_seen.>"
              "$JS.API.STREAM.INFO.KV_rid_isa_notifications"
              "$JS.API.STREAM.MSG.GET.KV_rid_isa_notifications"
              "$JS.API.DIRECT.GET.KV_rid_isa_notifications"
              "$JS.API.DIRECT.GET.KV_rid_isa_notifications.>"
              "$JS.API.CONSUMER.CREATE.KV_rid_isa_notifications"
              "$JS.API.CONSUMER.CREATE.KV_rid_isa_notifications.>"
              "$JS.API.CONSUMER.INFO.KV_rid_isa_notifications.>"
              "$JS.FC.KV_rid_isa_notifications.>"
              "$JS.API.STREAM.INFO.KV_sessions_live"
              "$JS.API.STREAM.MSG.GET.KV_sessions_live"
              "$JS.API.DIRECT.GET.KV_sessions_live"
              "$JS.API.DIRECT.GET.KV_sessions_live.>"
              "$JS.API.CONSUMER.CREATE.KV_sessions_live"
              "$JS.API.CONSUMER.CREATE.KV_sessions_live.>"
              "$JS.API.CONSUMER.INFO.KV_sessions_live.>"
              "$JS.FC.KV_sessions_live.>"
              "$JS.API.STREAM.INFO.KV_conformance_state"
              "$JS.API.STREAM.MSG.GET.KV_conformance_state"
              "$JS.API.DIRECT.GET.KV_conformance_state"
              "$JS.API.DIRECT.GET.KV_conformance_state.>"
              "$JS.API.CONSUMER.CREATE.KV_conformance_state"
              "$JS.API.CONSUMER.CREATE.KV_conformance_state.>"
              "$JS.API.CONSUMER.INFO.KV_conformance_state.>"
              "$JS.FC.KV_conformance_state.>"
              "$JS.API.STREAM.INFO.KV_proximity_state"
              "$JS.API.STREAM.MSG.GET.KV_proximity_state"
              "$JS.API.DIRECT.GET.KV_proximity_state"
              "$JS.API.DIRECT.GET.KV_proximity_state.>"
              "$JS.API.CONSUMER.CREATE.KV_proximity_state"
              "$JS.API.CONSUMER.CREATE.KV_proximity_state.>"
              "$JS.API.CONSUMER.INFO.KV_proximity_state.>"
              "$JS.FC.KV_proximity_state.>"
              "$JS.API.STREAM.INFO.KV_record_holds"
              "$JS.API.STREAM.MSG.GET.KV_record_holds"
              "$JS.API.DIRECT.GET.KV_record_holds"
              "$JS.API.DIRECT.GET.KV_record_holds.>"
              "$JS.API.CONSUMER.CREATE.KV_record_holds"
              "$JS.API.CONSUMER.CREATE.KV_record_holds.>"
              "$JS.API.CONSUMER.INFO.KV_record_holds.>"
              "$JS.FC.KV_record_holds.>"
              "$JS.API.STREAM.INFO.KV_rid_dp_subscriptions"
              "$JS.API.STREAM.MSG.GET.KV_rid_dp_subscriptions"
              "$JS.API.DIRECT.GET.KV_rid_dp_subscriptions"
              "$JS.API.DIRECT.GET.KV_rid_dp_subscriptions.>"
              "$JS.API.CONSUMER.CREATE.KV_rid_dp_subscriptions"
              "$JS.API.CONSUMER.CREATE.KV_rid_dp_subscriptions.>"
              "$JS.API.CONSUMER.INFO.KV_rid_dp_subscriptions.>"
              "$JS.FC.KV_rid_dp_subscriptions.>"
              "$JS.API.STREAM.INFO.KV_monitor_status"
              "$JS.API.STREAM.MSG.GET.KV_monitor_status"
              "$JS.API.DIRECT.GET.KV_monitor_status"
              "$JS.API.DIRECT.GET.KV_monitor_status.>"
              "$JS.API.CONSUMER.CREATE.KV_monitor_status"
              "$JS.API.CONSUMER.CREATE.KV_monitor_status.>"
              "$JS.API.CONSUMER.INFO.KV_monitor_status.>"
              "$JS.FC.KV_monitor_status.>"
              "$JS.API.STREAM.INFO.KV_flight_binding"
              "$JS.API.STREAM.MSG.GET.KV_flight_binding"
              "$JS.API.DIRECT.GET.KV_flight_binding"
              "$JS.API.DIRECT.GET.KV_flight_binding.>"
              "$JS.API.CONSUMER.CREATE.KV_flight_binding"
              "$JS.API.CONSUMER.CREATE.KV_flight_binding.>"
              "$JS.API.CONSUMER.INFO.KV_flight_binding.>"
              "$JS.FC.KV_flight_binding.>"
              "$JS.API.STREAM.INFO.KV_jwks_cache"
              "$JS.API.STREAM.MSG.GET.KV_jwks_cache"
              "$JS.API.DIRECT.GET.KV_jwks_cache"
              "$JS.API.DIRECT.GET.KV_jwks_cache.>"
              "$JS.API.CONSUMER.CREATE.KV_jwks_cache"
              "$JS.API.CONSUMER.CREATE.KV_jwks_cache.>"
              "$JS.API.CONSUMER.INFO.KV_jwks_cache.>"
              "$JS.FC.KV_jwks_cache.>"
            ]
            deny: ["$JS.API.CONSUMER.DELETE.>", "$JS.API.CONSUMER.DURABLE.CREATE.>"]
          }
          subscribe: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
}
