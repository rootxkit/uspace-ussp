# The real uspace-authority for the lab clause of H-1 (USSP occurrence
# reports reach the authority): its image, on databases and a NATS of
# its own, with nothing of this USSP's inside it. Driven by
# scripts/lab-authority.sh, which generates the keys and the admin
# password into LAB_AUTHORITY_DIR (never in git) and tears the project
# down after the run. Only the processes the occurrence intake needs
# run: migrate (both trees) and api. The api is published on
# 127.0.0.1:${LAB_AUTHORITY_PORT} only; its public URL is
# http://localhost:${LAB_AUTHORITY_PORT}, so its audience (M18) is
# localhost, the host this USSP's token client asks for (the authority
# registers audiences as host names, not addresses). The layout follows the authority's deploy/compose.yaml at the
# image's commit (one timescaledb-ha container holding `authority` and
# `authority_ts`, M37); the images are pinned by digest.
name: ${LAB_AUTHORITY_PROJECT:-ussp-lab-authority}

x-authority: &authority
  image: ${LAB_AUTHORITY_IMAGE:?the uspace-authority image (repo@sha256:digest or a local tag)}
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [authority]
  volumes:
    - ${LAB_AUTHORITY_DIR:?generated by scripts/lab-authority.sh}/keys:/run/secrets/authority:ro
    - ${LAB_GEOID_DIR:?a directory holding egm2008-2_5.pgm}:/srv/ground:ro

x-db: &db
  PG_URL: postgres://postgres:${LAB_AUTHORITY_PG_PASSWORD:?generated}@postgres:5432/authority?sslmode=disable
  TS_URL: postgres://postgres:${LAB_AUTHORITY_PG_PASSWORD}@postgres:5432/authority_ts?sslmode=disable

services:
  postgres:
    image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
    networks: [authority]
    environment:
      POSTGRES_PASSWORD: ${LAB_AUTHORITY_PG_PASSWORD}
      POSTGRES_DB: authority
    volumes:
      # The authority's deploy/initdb/10-authority.sql: the telemetry
      # database beside the relational one.
      - ./initdb.sql:/docker-entrypoint-initdb.d/10-authority.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d authority && psql -U postgres -d authority_ts -tAc 'SELECT 1' | grep -q 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  nats:
    image: nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    networks: [authority]
    command: ["-js", "-sd", "/data", "-m", "8222"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *authority
    command: ["migrate"]
    environment:
      <<: *db
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *authority
    command: ["api"]
    ports: ["127.0.0.1:${LAB_AUTHORITY_PORT:-58180}:8080"]
    environment:
      <<: *db
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      API_ADDR: ":8080"
      ADMIN_ADDR: ":9090"
      AUTHORITY_PUBLIC_URL: http://localhost:${LAB_AUTHORITY_PORT:-58180}
      AUTHORITY_AUDIENCES: localhost
      AUTHORITY_MTLS_MODE: "off"
      AUTHORITY_TRUSTED_PROXIES: ""
      GEOID_FILE: /srv/ground/egm2008-2_5.pgm
      SIGNING_KEY_FILES: /run/secrets/authority/token-1.pem
      PUBLICATION_KEY_FILE: /run/secrets/authority/publication-1.pem
      PII_KEY_FILE: /run/secrets/authority/pii.key
      REGISTRY_HASH_KEY_FILE: /run/secrets/authority/registry-hash.key
      OCCURRENCE_KEY_FILE: /run/secrets/authority/occurrence.key
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/authority/admin.pw
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

networks:
  authority: {}
