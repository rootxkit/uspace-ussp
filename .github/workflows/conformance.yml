name: conformance

# The InterUSS DSS and uss_qualifier against this USSP (docs/PLAN.md
# §10, WP-19). Manual only: it pulls external images, and it fails
# until WP-19 fills `make conformance`. Not a required check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: uss_qualifier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make conformance
