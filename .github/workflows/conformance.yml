name: conformance

# The InterUSS DSS and uss_qualifier against this USSP (docs/PLAN.md
# §10, WP-19). Manual only: it pulls external images, and it fails
# until WP-19 fills `make conformance`. Not a required check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: uss_qualifier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make conformance
