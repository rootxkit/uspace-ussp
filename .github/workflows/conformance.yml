name: conformance

# uspace-lab's conformance suite (WP-L7) against this USSP (docs/PLAN.md
# §10, §14 job 7; WP-19): `make conformance` with this commit's image in
# the lab's systems stack, the InterUSS DSS beside it, the lab at the
# commit deploy/conformance/SOURCE pins. On a manual dispatch and on
# release tags only: it pulls external images and the lab. Not a
# required check. The reports are uploaded whatever the verdict.
#
# The job's status is the suite's gate on the reviewed baseline
# (deploy/conformance/baseline.json): a failure or a regression fails it,
# and so does an incomplete run (exit 3: a gate requirement not checked
# that the baseline does not record) unless the dispatch says
# allow_incomplete. The requirements the baseline accepts not applicable
# (F3548-CP, NAT-PRECONDITION, REG-NOPII) do not fail a tag's run, and are not a
# pass: each is a warning annotation "not checked (not a pass)" with its
# reason, and the report's verdict stays incomplete. Nothing here writes
# anywhere but the runner.
#
# Until WP-21's R6 to R8 are fixed (docs/RUNBOOKS/WP-21.md), F3411-SP and
# F3548-SCD are recorded in the baseline as known failures: status fail,
# the finding that tracks each, and the exact checks that fail. A tag's
# run does not fail on them while they fail only those checks; a check
# outside the list is a regression and fails it, and a qualifier run that
# writes no report fails it as before. They are never a pass: each is a
# warning annotation "known failing (not a pass)" with its note. When R6
# to R8 pass, the baseline records them pass (the suite reports a known
# failure that now passes, for that update).
#
# WP-21: the stack also runs the test-interfaces process (the testif
# image, built from this commit) and the hook runs the lab's
# uss_qualifier f3411-sp.yaml, f3548-scd.yaml and f3411-dp.yaml with its
# mock USS against it, folding the reports into the run; the qualifier
# input off runs the national suite alone. The F3548 run is long (the
# lab's QUALIFIER_TIMEOUT_S, 3600 s, bounds one run): the step's timeout
# is raised for it, and its reports are uploaded with the others.
on:
  workflow_dispatch:
    inputs:
      allow_incomplete:
        description: "Accept an incomplete run (gate requirements not checked that the baseline does not record)"
        type: boolean
        default: false
      authority_push:
        description: "USSP_AUTHORITY_PUSH of the stack (off is the product default)"
        type: choice
        options: ["off", "on"]
        default: "off"
      qualifier:
        description: "Run uss_qualifier F3411-SP, F3548-SCD and F3411-DP against the test interfaces (WP-21)"
        type: choice
        options: ["on", "off"]
        default: "on"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  conformance:
    name: lab conformance suite
    runs-on: ubuntu-latest
    # The national suite takes minutes; uss_qualifier's three runs up to
    # QUALIFIER_TIMEOUT_S each (the step's bound below).
    timeout-minutes: 200
    steps:
      # qualifier off with allow_incomplete would pass having judged none
      # of the InterUSS requirements: refused here, before the lab and
      # the geoid grid are fetched (scripts/conformance.sh refuses it
      # too). scripts/conformance-selftest.sh runs this script.
      - name: refuse qualifier off with allow_incomplete
        env:
          CONFORMANCE_ALLOW_INCOMPLETE: ${{ inputs.allow_incomplete && '1' || '' }}
          CONFORMANCE_QUALIFIER: ${{ inputs.qualifier || 'on' }}
        run: |
          # inputs-guard:begin
          if [ "$CONFORMANCE_QUALIFIER" = off ] && [ "${CONFORMANCE_ALLOW_INCOMPLETE:-}" = 1 ]; then
            echo "::error title=conformance inputs::qualifier off with allow_incomplete is refused: the run would pass without the InterUSS suites having judged anything (use one or the other)"
            exit 1
          fi
          echo "inputs: qualifier $CONFORMANCE_QUALIFIER, allow_incomplete ${CONFORMANCE_ALLOW_INCOMPLETE:-0}"
          # inputs-guard:end
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: read deploy/conformance/SOURCE
        id: src
        run: |
          src() { sed -n "s/^$1 = //p" deploy/conformance/SOURCE; }
          for k in lab_commit geoid_url geoid_archive_sha256 geoid_pgm_sha256; do
            v="$(src "$k")"
            [ -n "$v" ] || { echo "deploy/conformance/SOURCE has no $k" >&2; exit 1; }
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rootxkit/uspace-lab
          ref: ${{ steps.src.outputs.lab_commit }}
          path: lab
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: the geoid grid (both digests checked)
        env:
          GEOID_URL: ${{ steps.src.outputs.geoid_url }}
          GEOID_ARCHIVE_SHA256: ${{ steps.src.outputs.geoid_archive_sha256 }}
          GEOID_PGM_SHA256: ${{ steps.src.outputs.geoid_pgm_sha256 }}
        run: |
          mkdir -p local/conformance/ground "$RUNNER_TEMP/geoid"
          curl -fsSL --max-time 300 -o "$RUNNER_TEMP/geoid/egm2008-2_5.tar.bz2" "$GEOID_URL"
          echo "$GEOID_ARCHIVE_SHA256  $RUNNER_TEMP/geoid/egm2008-2_5.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/geoid/egm2008-2_5.tar.bz2" -C "$RUNNER_TEMP/geoid" geoids/egm2008-2_5.pgm
          mv "$RUNNER_TEMP/geoid/geoids/egm2008-2_5.pgm" local/conformance/ground/
          echo "$GEOID_PGM_SHA256  local/conformance/ground/egm2008-2_5.pgm" | sha256sum -c -
      - name: make conformance
        timeout-minutes: 190
        env:
          LAB_DIR: ${{ github.workspace }}/lab
          USSP_CONFORMANCE_AUTHORITY_PUSH: ${{ inputs.authority_push || 'off' }}
          CONFORMANCE_ALLOW_INCOMPLETE: ${{ inputs.allow_incomplete && '1' || '' }}
          CONFORMANCE_QUALIFIER: ${{ inputs.qualifier || 'on' }}
          QUALIFIER_TIMEOUT_S: "3600"
        run: make conformance
      - name: reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-reports
          path: local/conformance/reports/
          if-no-files-found: warn
          retention-days: 90
