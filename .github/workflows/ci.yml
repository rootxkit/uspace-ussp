name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail.
    shell: bash

jobs:
  # Path filters for pull requests (docs/PLAN.md §14): a docs-only change
  # runs no Go job, a web/-only change runs only the web job. On main
  # and on tags every job runs. Every file a Go test or check reads
  # (testdata, schemas, fixtures, embedded migrations) is in the go
  # filter, not only the files it compiles. A job skipped by its filter
  # reports as skipped, which a required check accepts; gitleaks is
  # never filtered.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - 'migrations/**'
              - 'sqlc.yaml'
              - 'internal/store/queries/**'
              # Read by the tests and the checks, not compiled: a change
              # to a golden file, a vector, a fixture or a schema alone
              # must still run the tests that read it (and check-schemas).
              - 'testdata/**'
              - '**/testdata/**'
              - 'schemas/**'
              - 'test/**'
            # The browser tests run the portal against the processes
            # (test/e2e/stack): a change to them runs the web job too.
            web:
              - 'web/**'
              - 'api/**'
              - 'deploy/web.Dockerfile'
              - '.github/workflows/ci.yml'
              - 'test/e2e/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'internal/store/queries/**'
              - 'schemas/**'

  build-vet-lint:
    name: build, vet, lint, checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - run: CGO_ENABLED=0 go build ./...
      - name: go vet (with the integration tag)
        run: make vet
      - name: go mod tidy is clean
        run: make tidy
      # Pinned like the Makefile's STATICCHECK_VERSION and
      # GOLANGCI_LINT_VERSION (equal to uspace-core's); change both in
      # one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: generated code is current (offline)
        run: make check-generated
      - name: schemas
        run: make check-schemas
      - name: sibling OpenAPI copies match their SOURCE commits
        run: make check-contracts
      - name: import order
        run: make check-deps
      - name: no staging hostname outside deploy/staging/
        run: make check-hostnames
      # scripts/conformance.sh in each state against a fake lab, suite
      # and target (WP-19); the suite itself runs in conformance.yml.
      - name: conformance hook self-test
        run: make conformance-selftest

  test-race:
    name: test with the race detector
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -shuffle=on
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "$total"
          { echo '### Coverage'; echo '```'; echo "$total"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # uspace-core's own vector tests at the pinned version, from the
      # module cache with this module's build list (docs/PLAN.md §10).
      - name: uspace-core vectors at the pinned version
        run: go test -count=1 -run 'Vector|Manifest|Version' github.com/rootxkit/uspace-core/...

  integration:
    name: integration (TimescaleDB + PostGIS, NATS)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # A service container cannot take arguments, and NATS needs -js.
      - name: nats:2-alpine (by digest) with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4 -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: create both databases and roles (deploy/compose/initdb/10-ussp.sql)
        run: |
          api_pw="$(openssl rand -hex 16)"; tsdb_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$api_pw"; echo "::add-mask::$tsdb_pw"
          docker exec -i -e USSP_PG_API_PASSWORD="$api_pw" -e USSP_PG_TSDB_PASSWORD="$tsdb_pw" \
            "${{ job.services.timescaledb.id }}" psql -U postgres -v ON_ERROR_STOP=1 -f - < deploy/compose/initdb/10-ussp.sql
          {
            echo "USSP_TEST_PG_URL=postgres://ussp_api:${api_pw}@127.0.0.1:5432/ussp_relational?sslmode=disable"
            echo "USSP_TEST_TS_URL=postgres://ussp_api:${api_pw}@127.0.0.1:5432/ussp_timeseries?sslmode=disable"
            echo "USSP_TEST_TS_OWNER_URL=postgres://ussp_tsdb:${tsdb_pw}@127.0.0.1:5432/ussp_timeseries?sslmode=disable"
            echo "USSP_TEST_NATS_URL=nats://127.0.0.1:4222"
          } >> "$GITHUB_ENV"
      - name: make integration (fails when zero tests ran)
        run: make integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-log
          path: integration.log

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16@sha256:e9f34d8dd27621ec3933386eb07b70021d15b8116247362e0537bbff94ef0769
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: generated API types are current
        run: pnpm check:api
      - name: catalogues (en/ka complete, no duplicate key, no manoeuvre advice)
        run: node scripts/check-i18n.mjs --self-test && pnpm check:i18n
      - run: pnpm lint
      - name: tsc (a key missing from ka.json fails here)
        run: pnpm typecheck
      - run: pnpm build
      - name: playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium
      # The e2e stack (test/e2e/stack) runs the seven processes against
      # these, as make integration does.
      - name: nats:2-alpine (by digest) with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4 -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: create both databases and roles (deploy/compose/initdb/10-ussp.sql)
        working-directory: .
        run: |
          api_pw="$(openssl rand -hex 16)"; tsdb_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$api_pw"; echo "::add-mask::$tsdb_pw"
          docker exec -i -e USSP_PG_API_PASSWORD="$api_pw" -e USSP_PG_TSDB_PASSWORD="$tsdb_pw" \
            "${{ job.services.timescaledb.id }}" psql -U postgres -v ON_ERROR_STOP=1 -f - < deploy/compose/initdb/10-ussp.sql
          {
            echo "USSP_TEST_PG_URL=postgres://ussp_api:${api_pw}@127.0.0.1:5432/ussp_relational?sslmode=disable"
            echo "USSP_TEST_TS_OWNER_URL=postgres://ussp_tsdb:${tsdb_pw}@127.0.0.1:5432/ussp_timeseries?sslmode=disable"
            echo "USSP_TEST_NATS_URL=nats://127.0.0.1:4222"
          } >> "$GITHUB_ENV"
      - name: the stack builds before the browser tests start it
        working-directory: .
        run: go build -o /dev/null ./test/e2e/stack
      - name: browser tests of the operator flows, ka and en (traces recorded)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-traces
          path: |
            web/playwright-report
            web/test-results

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like GOVULNCHECK_VERSION in the Makefile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The release binary, checked against a SHA-256 pinned here (not
      # one fetched beside it), run without any token. Pinned with
      # GITLEAKS_VERSION in the Makefile; change both together.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      # Which commits: on a pull request only its own (base..head), so a
      # finding on another branch never fails it; on main, a tag or a
      # manual run the whole history of the commit checked out, which
      # holds the pushed range. Never every fetched branch (gitleaks'
      # default --all): the checkout fetches them all.
      - name: gitleaks
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="origin/$BASE_REF..$HEAD_SHA"
          else
            range="$GITHUB_SHA"
          fi
          # An empty range would scan nothing and pass: refuse it.
          n=$(git rev-list --count "$range")
          [ "$n" -gt 0 ] || { echo "empty scan range: $range"; exit 1; }
          echo "gitleaks commits: $range ($n commits)"
          ./gitleaks git --no-banner --redact --verbose --log-opts="$range" .

  # The staging shape read back as compose renders it, the deploy
  # preflight and the certificate wiring, the Caddy proof against the
  # pinned Caddy, and shellcheck from its pinned image (WP-20,
  # scripts/check-deploy.sh). Nothing is deployed.
  deploy:
    name: deploy checks (compose, preflight, Caddy proof)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tool versions
        run: |
          docker compose version
          jq --version
          openssl version
          curl -V | head -n 1
      - name: make check-deploy
        run: make check-deploy

  # The staging smoke (WP-20, deploy/smoke/run.sh): both images built from
  # this commit and loaded locally (never pushed), deploy/compose/
  # staging.yaml deployed from scratch by deploy/deploy.sh behind an edge
  # Caddy with the snippet, a simulated operator through the public host
  # (an intent authorised, telemetry acknowledged), a backup and its
  # restore check with known counts, a redeploy that keeps the data, one
  # migration back refused by name, memory per container, the teardown
  # verified. The containers' logs are uploaded on failure.
  staging-smoke:
    name: staging smoke (deploy.sh, operator, backup, restore)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: version
        id: version
        run: echo "version=smoke-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Go image (local, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: uspace-ussp:smoke
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=go
      - name: web image (local, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: deploy/web.Dockerfile
          load: true
          push: false
          tags: uspace-ussp-web:smoke
          cache-from: type=gha,scope=web
      - name: tool versions
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          jq --version
          openssl version
      - name: deploy/smoke/run.sh
        env:
          SMOKE_GO_IMAGE: uspace-ussp:smoke
          SMOKE_WEB_IMAGE: uspace-ussp-web:smoke
          SMOKE_VERSION: ${{ steps.version.outputs.version }}
          SMOKE_LOG_DIR: ${{ runner.temp }}/smoke-logs
        run: deploy/smoke/run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: staging-smoke-logs
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore

  # The three images, built on a pull request and not pushed. This job
  # holds only the workflow's read token: a branch that changes a
  # Dockerfile or a build dependency never runs with a token that may
  # push to GHCR or request an OIDC token. The production image is
  # checked to have no ussp-test-interfaces (D13), the testif image to
  # have it (the twin).
  image-build:
    name: images (build only)
    needs: [changes, build-vet-lint, test-race, integration, web, gitleaks, govulncheck]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Go image (the seven processes)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: production
          push: false
          load: true
          tags: uspace-ussp:pr
          build-args: |
            VERSION=pr
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=go
      - name: test-interfaces image (deploy/Dockerfile target testif, D13)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: testif
          push: false
          load: true
          tags: uspace-ussp-testif:pr
          build-args: |
            VERSION=pr
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=go
      - name: the production image has no ussp-test-interfaces, the testif image has
        run: scripts/check-images.sh uspace-ussp:pr uspace-ussp-testif:pr
      - name: web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: deploy/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web

  # On main and v* tags, after every gate, the three images are pushed
  # to GHCR by short SHA (and by the tag), with an SBOM and provenance,
  # and signed with cosign (keyless), and the signatures read back; the
  # SPDX SBOMs deploy/verify-image.sh checks for the two deployed images
  # are made and attested by the two jobs after this one (WP-20). `latest` is never pushed; CI never
  # deploys. Only this job and `attest`, which never run for a pull
  # request, hold packages: write and id-token: write.
  image:
    name: images
    needs: [changes, build-vet-lint, test-race, integration, web, gitleaks, govulncheck, deploy, staging-smoke]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      go_digest: ${{ steps.go.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          go_tags="ghcr.io/rootxkit/uspace-ussp:${short}"
          testif_tags="ghcr.io/rootxkit/uspace-ussp-testif:${short}"
          web_tags="ghcr.io/rootxkit/uspace-ussp-web:${short}"
          version="$short"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            go_tags+=",ghcr.io/rootxkit/uspace-ussp:${GITHUB_REF_NAME}"
            testif_tags+=",ghcr.io/rootxkit/uspace-ussp-testif:${GITHUB_REF_NAME}"
            web_tags+=",ghcr.io/rootxkit/uspace-ussp-web:${GITHUB_REF_NAME}"
            version="$GITHUB_REF_NAME"
          fi
          { echo "go=$go_tags"; echo "testif=$testif_tags"; echo "web=$web_tags"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Go image (the seven processes)
        id: go
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: production
          push: true
          tags: ${{ steps.tags.outputs.go }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
      # The test-interfaces image (D13): the conformance profile's, never
      # a deployment's; SBOM, provenance and signature as the others.
      - name: test-interfaces image (deploy/Dockerfile target testif)
        id: testif
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: testif
          push: true
          tags: ${{ steps.tags.outputs.testif }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=go
      - name: the pushed production image has no ussp-test-interfaces
        env:
          GO_DIGEST: ${{ steps.go.outputs.digest }}
          TESTIF_DIGEST: ${{ steps.testif.outputs.digest }}
        run: scripts/check-images.sh "ghcr.io/rootxkit/uspace-ussp@${GO_DIGEST}" "ghcr.io/rootxkit/uspace-ussp-testif@${TESTIF_DIGEST}"
      - name: web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign
        env:
          GO_DIGEST: ${{ steps.go.outputs.digest }}
          TESTIF_DIGEST: ${{ steps.testif.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/rootxkit/uspace-ussp@${GO_DIGEST}"
          cosign sign --yes "ghcr.io/rootxkit/uspace-ussp-testif@${TESTIF_DIGEST}"
          cosign sign --yes "ghcr.io/rootxkit/uspace-ussp-web@${WEB_DIGEST}"
      # Read back what was signed: every signature verifies against this
      # workflow's own identity, as deploy/verify-image.sh checks them.
      - name: verify the signatures
        env:
          GO_DIGEST: ${{ steps.go.outputs.digest }}
          TESTIF_DIGEST: ${{ steps.testif.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          if [ -z "$GO_DIGEST" ] || [ -z "$TESTIF_DIGEST" ] || [ -z "$WEB_DIGEST" ]; then echo "an image has no digest"; exit 1; fi
          refs=("ghcr.io/rootxkit/uspace-ussp@${GO_DIGEST}" "ghcr.io/rootxkit/uspace-ussp-testif@${TESTIF_DIGEST}" "ghcr.io/rootxkit/uspace-ussp-web@${WEB_DIGEST}")
          for ref in "${refs[@]}"; do
            cosign verify "$ref" --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "signature verified: $ref"
          done
          {
            echo '### Images (pushed, signed, signature verified)'
            echo
            for ref in "${refs[@]}"; do echo "- $ref"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: forget the registry credential
        if: always()
        run: docker logout ghcr.io

  # The SPDX SBOMs (syft), apart from the push and the signing: the
  # third-party SBOM action runs with a read-only package token and no
  # OIDC token, never beside a registry credential that can push.
  sbom:
    name: SBOMs
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: read-only registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: SBOM of the Go image (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/rootxkit/uspace-ussp@${{ needs.image.outputs.go_digest }}
          format: spdx-json
          output-file: sbom-uspace-ussp.spdx.json
          upload-artifact: false
      - name: SBOM of the web image (syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/rootxkit/uspace-ussp-web@${{ needs.image.outputs.web_digest }}
          format: spdx-json
          output-file: sbom-uspace-ussp-web.spdx.json
          upload-artifact: false
      - name: forget the registry credential
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-*.spdx.json
          if-no-files-found: error

  # The SBOMs attached to the digests as signed attestations (cosign
  # alone, with the write and OIDC permissions this needs), then read back
  # with the check deploy/verify-image.sh makes: `cosign verify` and
  # `cosign verify-attestation` run once here on every main and tag.
  attest:
    name: attest SBOMs
    if: github.event_name == 'push'
    needs: [image, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: attach the SBOMs (cosign keyless) and verify the attestations
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO_DIGEST: ${{ needs.image.outputs.go_digest }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          go_ref="ghcr.io/rootxkit/uspace-ussp@${GO_DIGEST}"
          web_ref="ghcr.io/rootxkit/uspace-ussp-web@${WEB_DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom-uspace-ussp.spdx.json "$go_ref"
          cosign attest --yes --type spdxjson --predicate sbom-uspace-ussp-web.spdx.json "$web_ref"
          for ref in "$go_ref" "$web_ref"; do
            cosign verify-attestation --type spdxjson "$ref" --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "SBOM attestation verified: $ref"
          done
