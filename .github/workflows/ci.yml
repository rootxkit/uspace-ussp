name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail.
    shell: bash

jobs:
  # Path filters for pull requests (docs/PLAN.md §14): a docs-only change
  # runs no Go job, a web/-only change runs only the web job. On main
  # and on tags every job runs. Every file a Go test or check reads
  # (testdata, schemas, fixtures, embedded migrations) is in the go
  # filter, not only the files it compiles. A job skipped by its filter
  # reports as skipped, which a required check accepts; gitleaks is
  # never filtered.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
              - 'migrations/**'
              - 'sqlc.yaml'
              - 'internal/store/queries/**'
              # Read by the tests and the checks, not compiled: a change
              # to a golden file, a vector, a fixture or a schema alone
              # must still run the tests that read it (and check-schemas).
              - 'testdata/**'
              - '**/testdata/**'
              - 'schemas/**'
              - 'test/**'
            # The browser tests run the portal against the processes
            # (test/e2e/stack): a change to them runs the web job too.
            web:
              - 'web/**'
              - 'api/**'
              - 'deploy/web.Dockerfile'
              - '.github/workflows/ci.yml'
              - 'test/e2e/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'internal/store/queries/**'
              - 'schemas/**'

  build-vet-lint:
    name: build, vet, lint, checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      - run: CGO_ENABLED=0 go build ./...
      - name: go vet (with the integration tag)
        run: make vet
      - name: go mod tidy is clean
        run: make tidy
      # Pinned like the Makefile's STATICCHECK_VERSION and
      # GOLANGCI_LINT_VERSION (equal to uspace-core's); change both in
      # one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
      - name: generated code is current (offline)
        run: make check-generated
      - name: schemas
        run: make check-schemas
      - name: sibling OpenAPI copies match their SOURCE commits
        run: make check-contracts
      - name: import order
        run: make check-deps
      - name: no staging hostname outside deploy/staging/
        run: make check-hostnames

  test-race:
    name: test with the race detector
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -shuffle=on
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "$total"
          { echo '### Coverage'; echo '```'; echo "$total"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # uspace-core's own vector tests at the pinned version, from the
      # module cache with this module's build list (docs/PLAN.md §10).
      - name: uspace-core vectors at the pinned version
        run: go test -count=1 -run 'Vector|Manifest|Version' github.com/rootxkit/uspace-core/...

  integration:
    name: integration (TimescaleDB + PostGIS, NATS)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # A service container cannot take arguments, and NATS needs -js.
      - name: nats:2-alpine with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: create both databases and roles (deploy/compose/initdb/10-ussp.sql)
        run: |
          api_pw="$(openssl rand -hex 16)"; tsdb_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$api_pw"; echo "::add-mask::$tsdb_pw"
          docker exec -i -e USSP_PG_API_PASSWORD="$api_pw" -e USSP_PG_TSDB_PASSWORD="$tsdb_pw" \
            "${{ job.services.timescaledb.id }}" psql -U postgres -v ON_ERROR_STOP=1 -f - < deploy/compose/initdb/10-ussp.sql
          {
            echo "USSP_TEST_PG_URL=postgres://ussp_api:${api_pw}@127.0.0.1:5432/ussp_relational?sslmode=disable"
            echo "USSP_TEST_TS_URL=postgres://ussp_api:${api_pw}@127.0.0.1:5432/ussp_timeseries?sslmode=disable"
            echo "USSP_TEST_TS_OWNER_URL=postgres://ussp_tsdb:${tsdb_pw}@127.0.0.1:5432/ussp_timeseries?sslmode=disable"
            echo "USSP_TEST_NATS_URL=nats://127.0.0.1:4222"
          } >> "$GITHUB_ENV"
      - name: make integration (fails when zero tests ran)
        run: make integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-log
          path: integration.log

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ci-superuser-only-in-this-job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: generated API types are current
        run: pnpm check:api
      - name: catalogues (en/ka complete, no duplicate key, no manoeuvre advice)
        run: node scripts/check-i18n.mjs --self-test && pnpm check:i18n
      - run: pnpm lint
      - name: tsc (a key missing from ka.json fails here)
        run: pnpm typecheck
      - run: pnpm build
      - name: playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium
      # The e2e stack (test/e2e/stack) runs the seven processes against
      # these, as make integration does.
      - name: nats:2-alpine with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine -js -m 8222
          for _ in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          docker logs nats; exit 1
      - name: create both databases and roles (deploy/compose/initdb/10-ussp.sql)
        working-directory: .
        run: |
          api_pw="$(openssl rand -hex 16)"; tsdb_pw="$(openssl rand -hex 16)"
          echo "::add-mask::$api_pw"; echo "::add-mask::$tsdb_pw"
          docker exec -i -e USSP_PG_API_PASSWORD="$api_pw" -e USSP_PG_TSDB_PASSWORD="$tsdb_pw" \
            "${{ job.services.timescaledb.id }}" psql -U postgres -v ON_ERROR_STOP=1 -f - < deploy/compose/initdb/10-ussp.sql
          {
            echo "USSP_TEST_PG_URL=postgres://ussp_api:${api_pw}@127.0.0.1:5432/ussp_relational?sslmode=disable"
            echo "USSP_TEST_TS_OWNER_URL=postgres://ussp_tsdb:${tsdb_pw}@127.0.0.1:5432/ussp_timeseries?sslmode=disable"
            echo "USSP_TEST_NATS_URL=nats://127.0.0.1:4222"
          } >> "$GITHUB_ENV"
      - name: the stack builds before the browser tests start it
        working-directory: .
        run: go build -o /dev/null ./test/e2e/stack
      - name: browser tests of the operator flows, ka and en (traces recorded)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-traces
          path: |
            web/playwright-report
            web/test-results

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like GOVULNCHECK_VERSION in the Makefile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The release binary, checked against a SHA-256 pinned here (not
      # one fetched beside it), run without any token. Pinned with
      # GITLEAKS_VERSION in the Makefile; change both together.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      # Which commits: on a pull request only its own (base..head), so a
      # finding on another branch never fails it; on main, a tag or a
      # manual run the whole history of the commit checked out, which
      # holds the pushed range. Never every fetched branch (gitleaks'
      # default --all): the checkout fetches them all.
      - name: gitleaks
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="origin/$BASE_REF..$HEAD_SHA"
          else
            range="$GITHUB_SHA"
          fi
          # An empty range would scan nothing and pass: refuse it.
          n=$(git rev-list --count "$range")
          [ "$n" -gt 0 ] || { echo "empty scan range: $range"; exit 1; }
          echo "gitleaks commits: $range ($n commits)"
          ./gitleaks git --no-banner --redact --verbose --log-opts="$range" .

  # Both images, built on a pull request and not pushed. This job holds
  # only the workflow's read token: a branch that changes a Dockerfile
  # or a build dependency never runs with a token that may push to GHCR
  # or request an OIDC token.
  image-build:
    name: images (build only)
    needs: [changes, build-vet-lint, test-race, integration, web, gitleaks, govulncheck]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Go image (the seven processes)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: |
            VERSION=pr
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=go
      - name: web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: web
          file: deploy/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web

  # On main and v* tags, after every gate, both images are pushed to
  # GHCR by short SHA (and by the tag), with an SBOM and provenance, and
  # signed with cosign (keyless). `latest` is never pushed; CI never
  # deploys. Only this job, which never runs for a pull request, holds
  # packages: write and id-token: write.
  image:
    name: images
    needs: [changes, build-vet-lint, test-race, integration, web, gitleaks, govulncheck]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          go_tags="ghcr.io/rootxkit/uspace-ussp:${short}"
          web_tags="ghcr.io/rootxkit/uspace-ussp-web:${short}"
          version="$short"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            go_tags+=",ghcr.io/rootxkit/uspace-ussp:${GITHUB_REF_NAME}"
            web_tags+=",ghcr.io/rootxkit/uspace-ussp-web:${GITHUB_REF_NAME}"
            version="$GITHUB_REF_NAME"
          fi
          { echo "go=$go_tags"; echo "web=$web_tags"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Go image (the seven processes)
        id: go
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.go }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ github.sha }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go
      - name: web image
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: web
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: sign
        env:
          GO_DIGEST: ${{ steps.go.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/rootxkit/uspace-ussp@${GO_DIGEST}"
          cosign sign --yes "ghcr.io/rootxkit/uspace-ussp-web@${WEB_DIGEST}"
