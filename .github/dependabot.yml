# Every third-party action is pinned to a full commit SHA with its
# version in a trailing comment; Dependabot moves the SHAs by pull
# request so a moved tag never reaches a run unreviewed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The base images of deploy/Dockerfile and deploy/web.Dockerfile are
  # pinned by digest (scripts/check-deploy.sh); Dependabot moves them.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
